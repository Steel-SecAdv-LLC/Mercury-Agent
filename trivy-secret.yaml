# Trivy secret-scanner allowlist for the container/filesystem scans.
#
# Entries here suppress SECRET findings only (never vulnerabilities — those
# go through the expiring .trivyignore ledger) and must stay path-scoped to
# published third-party package text that trips a credential regex without
# being a credential. A real key baked anywhere else in the image still
# fails the gate.
#
# Wired into .github/workflows/security.yml via TRIVY_SECRET_CONFIG.

allow-rules:
  - id: anthropic-sdk-managed-agents-type-literals
    description: >-
      The anthropic PyPI package (>= 1.14.0) ships Managed Agents type
      definitions (anthropic/types/beta/beta_managed_agents_*.py) whose
      docstrings and Literal annotations contain the string
      '{"type": "service_account"}' — the discriminator of the API's
      execution-identity union. Trivy's gcp-service-account rule matches
      that marker, flagging public SDK source text as a CRITICAL leaked
      GCP key. Scoped to the installed anthropic package only.
    path: (^|/)site-packages/anthropic/.*
