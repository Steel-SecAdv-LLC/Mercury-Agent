name: Security

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  # Manual dispatch is the recovery path when a push to ``main`` is
  # accidentally suppressed by a skip-directive substring in the squash
  # merge commit message (see CONTRIBUTING.md "Squash-merge gotcha").
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository (attempt 1)
      id: checkout
      continue-on-error: true
      uses: actions/checkout@v7

    - name: Pause before checkout retry 1 (transient flake stabilisation)
      if: steps.checkout.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
        sleep 15

    - name: Checkout repository (attempt 2, runs only on attempt-1 failure)
      id: checkout2
      if: steps.checkout.outcome == 'failure'
      continue-on-error: true
      uses: actions/checkout@v7

    - name: Pause before checkout retry 2 (extended backoff)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
        sleep 60

    - name: Checkout repository (attempt 3, final; runs only on attempts 1+2 failure)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install security tools (audit-tool layer)
      # Audit tools are installed in the *runner's* default Python
      # and never inside Mercury's environment.  This keeps audit-
      # tool transitives (``nltk``, ``joblib``, …) out of the
      # audited surface — they belong to the auditor, not to
      # Mercury.  Combined with the isolated Mercury install
      # created below, the scope of every scan below is exactly
      # Mercury's declared deps + their transitives.
      run: |
        pip install --upgrade "pip>=26.1"
        # ``click>=8.2`` re-pinned at the runner level: ``safety``'s
        # bundled ``typer>=0.20`` uses PEP 695 ``click.Choice[...]``
        # subscripting and crashes with ``TypeError: type 'Choice'
        # is not subscriptable`` against the older click that ships
        # with the GHA hosted Python image.  See ``ci.yml`` for the
        # full rationale.
        pip install safety bandit pip-audit "click>=8.2"

    - name: Create isolated Mercury install (audit target)
      # Install Mercury into a dedicated venv so the audits scan
      # ONLY Mercury's declared deps + their transitives.  Without
      # this isolation, the auditor's own transitives (nltk via
      # safety, joblib via safety) would appear in pip-audit's
      # findings as if they were Mercury's responsibility — which
      # they are not.  This is the architectural remediation that
      # replaces every prior ``--ignore-vuln`` flag.
      run: |
        python -m venv /tmp/mercury-audit-env
        /tmp/mercury-audit-env/bin/pip install --upgrade "pip>=26.1"
        /tmp/mercury-audit-env/bin/pip install -e ".[api]" \
          --upgrade "click>=8.2" "typer>=0.20"
        /tmp/mercury-audit-env/bin/pip list --format=freeze \
          > /tmp/mercury-audit-env/requirements.txt
        {
          echo "## Audit-target environment (Mercury install only)"
          echo
          echo '```'
          cat /tmp/mercury-audit-env/requirements.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

    - name: Run Safety check
      # Safety scans the isolated Mercury install via ``-r``.
      # BLOCKING — any finding in Mercury's own dependency surface
      # fails the job.  No per-CVE risk acceptance: the audit-doc
      # IGNORE column is the prior architecture (since removed)
      # because that approach silenced findings rather than
      # remediating the supply chain.
      run: |
        safety check \
          -r /tmp/mercury-audit-env/requirements.txt \
          --save-json safety-report.json \
          --policy-file .safety-policy-v2.yml

    - name: Run pip-audit
      # pip-audit cross-checks against PyPA's advisory database
      # over the isolated Mercury install only (``--path`` scopes
      # to that venv's site-packages).  BLOCKING — any new finding
      # in Mercury's supply chain fails the job.  No ``--ignore-
      # vuln`` flags: previously-ignored advisories were either
      # (a) audit-tool transitives now eliminated by isolation, or
      # (b) Mercury direct deps that must be remediated by upgrade
      # / library replacement, not by suppression.
      run: |
        pip-audit \
          --path /tmp/mercury-audit-env/lib/python3.12/site-packages \
          --skip-editable \
          --format json --output pip-audit-report.json

    - name: Run Bandit security scan
      # Bandit scans application source for common security
      # anti-patterns at MEDIUM severity and above.  BLOCKING —
      # any new finding is either a real bug or warrants an
      # explicit ``# nosec`` annotation at the call site with a
      # documented safety contract (the project doctrine forbids
      # blanket suppression via ``[tool.bandit].skips`` for the
      # specific finding type; see ``pyproject.toml`` for the
      # global skip list, which is intentionally small).
      run: bandit -r src/omni_mercury_engine/ -c pyproject.toml -f json -o bandit-report.json --severity-level medium

    - name: Upload Security Reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          safety-report.json
          pip-audit-report.json
          bandit-report.json
        retention-days: 30

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository (attempt 1)
      id: checkout
      continue-on-error: true
      uses: actions/checkout@v7

    - name: Pause before checkout retry 1 (transient flake stabilisation)
      if: steps.checkout.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
        sleep 15

    - name: Checkout repository (attempt 2, runs only on attempt-1 failure)
      id: checkout2
      if: steps.checkout.outcome == 'failure'
      continue-on-error: true
      uses: actions/checkout@v7

    - name: Pause before checkout retry 2 (extended backoff)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
        sleep 60

    - name: Checkout repository (attempt 3, final; runs only on attempts 1+2 failure)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      uses: actions/checkout@v7

    - name: Free disk space
      run: |
        # Remove unused toolchains to free up disk space for large Docker images
        # This is necessary for ML-heavy images with torch/pytorch dependencies
        echo "=== Disk space before cleanup ==="
        df -h /
        
        # Remove Android SDK (saves ~10GB)
        sudo rm -rf /usr/local/lib/android || true
        
        # Remove .NET SDK (saves ~2GB)
        sudo rm -rf /usr/share/dotnet || true
        
        # Remove Haskell/GHC (saves ~5GB)
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/.ghcup || true
        
        # Remove CodeQL (saves ~1GB)
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        
        # Remove Swift (saves ~1GB)
        sudo rm -rf /usr/share/swift || true
        
        # Clean apt cache
        sudo apt-get clean || true
        
        # Prune Docker to free space
        docker system prune -af || true
        docker builder prune -af || true
        
        echo "=== Disk space after cleanup ==="
        df -h /

    - name: Build Docker image
      run: docker build -t mercury-agent:scan .

    - name: Install Trivy binary
      # The bundled ``aquasecurity/setup-trivy`` action that
      # ``aquasecurity/trivy-action@v0.36.0`` invokes for us has a
      # known failure mode on PR runs whose ``actions/cache`` entry
      # for ``trivy-binary-v0.70.0-Linux-X64`` is cold: setup-trivy
      # then falls back to a sparse ``actions/checkout`` of the
      # ``aquasecurity/trivy`` repo at the tagged release SHA to run
      # the ``contrib/install.sh`` shipped in that tree.  That sparse
      # checkout's sub-object fetch trips ``fatal: could not read
      # Username for 'https://github.com': terminal prompts disabled``
      # because the GitHub-issued ``GITHUB_TOKEN`` credential helper
      # installed by ``actions/checkout`` is not propagated to the
      # deferred promisor-remote fetch underneath the sparse view.
      #
      # We sidestep that flake at source by installing the same Trivy
      # version directly from the project's documented release-binary
      # install script (which only ever talks to
      # ``github.com/aquasecurity/trivy/releases``, never to the
      # source tree) and then passing ``skip-setup-trivy: true`` to
      # the action below so it consumes our binary instead of
      # attempting its own.  Same Trivy version, same scan policy,
      # deterministic install path — no weakening of the gate.
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin v0.70.0
        trivy --version

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'mercury-agent:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        limit-severities-for-sarif: true
        vuln-type: 'os,library'
        # Ignore unfixed vulnerabilities to reduce noise
        ignore-unfixed: true
        # Skip duplicate detection across layers and huge ML header files
        # that cause context-deadline-exceeded timeouts in secret scanning.
        # Third-party sample dataset fetcher registries are skipped if an older
        # image layer still contains them; the runtime Dockerfile prunes these
        # unused packages before the final scan surface is produced.
        skip-dirs: '/var/lib/apt/lists,/var/cache/apt'
        skip-files: '/opt/venv/lib/python3.12/site-packages/torch/include/ATen/Tensor.h,/opt/venv/lib/python3.12/site-packages/tensorflow/include/tensorflow/compiler/mlir/tensorflow/ir/tf_all_ops.h.inc,/opt/venv/lib/python3.13/site-packages/torch/include/ATen/Tensor.h,/opt/venv/lib/python3.13/site-packages/tensorflow/include/tensorflow/compiler/mlir/tensorflow/ir/tf_all_ops.h.inc,/opt/venv/lib/python3.12/site-packages/scipy/datasets/_fetchers.py,/opt/venv/lib/python3.13/site-packages/scipy/datasets/_fetchers.py,/opt/venv/lib/python3.12/site-packages/skimage/data/_fetchers.py,/opt/venv/lib/python3.13/site-packages/skimage/data/_fetchers.py'
        timeout: '15m'
        # Use the binary installed in the explicit step above; see
        # that step's comment for the upstream-flake rationale.
        skip-setup-trivy: true

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-container-scan'

    - name: Run Trivy in table format for PR comments
      # Same scan surface as the SARIF run above, but rendered as a
      # human-readable table for PR review.  BLOCKING at the
      # CRITICAL/HIGH tier — anything findable here is also in the
      # SARIF run (which already populates the GitHub Security tab);
      # the table form is the gate that makes such findings visible
      # in the PR review UI rather than only after merge.
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: 'mercury-agent:scan'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        vuln-type: 'os,library'
        # Enumerated, expiring acceptance ledger replaces the blanket
        # unfixed-CVE waiver: new unfixed CRITICAL/HIGH findings and
        # expired ledger entries fail this gate (see .trivyignore).
        ignore-unfixed: false
        trivyignores: '.trivyignore'
        skip-dirs: '/var/lib/apt/lists,/var/cache/apt'
        skip-files: '/opt/venv/lib/python3.12/site-packages/torch/include/ATen/Tensor.h,/opt/venv/lib/python3.12/site-packages/tensorflow/include/tensorflow/compiler/mlir/tensorflow/ir/tf_all_ops.h.inc,/opt/venv/lib/python3.13/site-packages/torch/include/ATen/Tensor.h,/opt/venv/lib/python3.13/site-packages/tensorflow/include/tensorflow/compiler/mlir/tensorflow/ir/tf_all_ops.h.inc,/opt/venv/lib/python3.12/site-packages/scipy/datasets/_fetchers.py,/opt/venv/lib/python3.13/site-packages/scipy/datasets/_fetchers.py,/opt/venv/lib/python3.12/site-packages/skimage/data/_fetchers.py,/opt/venv/lib/python3.13/site-packages/skimage/data/_fetchers.py'
        timeout: '15m'
        exit-code: '1'
        # Trivy binary is already installed by the explicit
        # ``Install Trivy binary`` step above (same job); skip the
        # bundled setup-trivy sparse-checkout to avoid the
        # cold-cache failure mode documented there.
        skip-setup-trivy: true

  filesystem-scan:
    name: Filesystem Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository (attempt 1)
      id: checkout
      continue-on-error: true
      uses: actions/checkout@v7

    - name: Pause before checkout retry 1 (transient flake stabilisation)
      if: steps.checkout.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
        sleep 15

    - name: Checkout repository (attempt 2, runs only on attempt-1 failure)
      id: checkout2
      if: steps.checkout.outcome == 'failure'
      continue-on-error: true
      uses: actions/checkout@v7

    - name: Pause before checkout retry 2 (extended backoff)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
        sleep 60

    - name: Checkout repository (attempt 3, final; runs only on attempts 1+2 failure)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      uses: actions/checkout@v7

    - name: Install Trivy binary
      # See ``container-scan`` job's ``Install Trivy binary`` step
      # for the upstream-flake rationale: ``setup-trivy``'s sparse
      # checkout of the trivy source repo fails when the binary
      # cache is cold, because the deferred promisor-remote fetch
      # under the sparse view is not credentialed.  We install the
      # release binary directly (release-asset download path only,
      # never source-tree clone) and skip the bundled setup step.
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin v0.70.0
        trivy --version

    - name: Run Trivy filesystem scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        # Ignore unfixed vulnerabilities for consistency with container scan
        ignore-unfixed: true
        # Skip test files and documentation
        skip-dirs: 'tests,docs,benchmarks'
        # Use the binary installed in the explicit step above; see
        # that step's comment for the upstream-flake rationale.
        skip-setup-trivy: true

    - name: Upload Trivy filesystem results
      uses: github/codeql-action/upload-sarif@v4
      if: always() && hashFiles('trivy-fs-results.sarif') != ''
      with:
        sarif_file: 'trivy-fs-results.sarif'
        category: 'trivy-filesystem-scan'

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository (attempt 1)
      id: checkout
      continue-on-error: true
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Pause before checkout retry 1 (transient flake stabilisation)
      if: steps.checkout.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
        sleep 15

    - name: Checkout repository (attempt 2, runs only on attempt-1 failure)
      id: checkout2
      if: steps.checkout.outcome == 'failure'
      continue-on-error: true
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Pause before checkout retry 2 (extended backoff)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
        sleep 60

    - name: Checkout repository (attempt 3, final; runs only on attempts 1+2 failure)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    steps:
    - name: Checkout repository for CodeQL (attempt 1)
      id: checkout
      continue-on-error: true
      uses: actions/checkout@v7

    - name: Pause before CodeQL checkout retry 1 (transient flake stabilisation)
      if: steps.checkout.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempt 1 failed. Sleeping 15s before retry."
        sleep 15

    - name: Checkout repository for CodeQL (attempt 2, runs only on attempt-1 failure)
      id: checkout2
      if: steps.checkout.outcome == 'failure'
      continue-on-error: true
      uses: actions/checkout@v7

    - name: Pause before CodeQL checkout retry 2 (extended backoff)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
        sleep 60

    - name: Checkout repository for CodeQL (attempt 3, final; runs only on attempts 1+2 failure)
      if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      # Pin to v4.32.2: newer v4 tags call GitHub's feature-flag API during
      # init, which returns Bad credentials for Copilot Code Review tokens.
      uses: github/codeql-action/init@v4.32.2
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4.32.2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.32.2
      with:
        category: "/language:${{ matrix.language }}"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, container-scan, filesystem-scan, secret-scan]
    if: always()
    steps:
    - name: Check security scan results
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Filesystem Scan | ${{ needs.filesystem-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
