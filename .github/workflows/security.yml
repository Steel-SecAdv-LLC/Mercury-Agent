name: Security

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install security tools
      run: |
        pip install --upgrade "pip>=26.0"
        pip install safety bandit pip-audit

    - name: Run Safety check
      # Blocking.  Known Python CVEs in installed packages fail the PR.
      run: safety check --json --output safety-report.json

    - name: Run pip-audit
      # Blocking.  pip-audit provides comprehensive vulnerability detection
      # against the PyPI advisory database and OSV.
      run: pip-audit --format json --output pip-audit-report.json

    - name: Run Bandit security scan
      # Blocking.  Bandit medium+ severity findings in src/ fail the PR.
      run: bandit -r src/omni_mercury_engine/ -f json -o bandit-report.json --severity-level medium

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          pip-audit-report.json
          bandit-report.json
        retention-days: 30

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      run: |
        # Remove unused toolchains to free up disk space for large Docker images
        # This is necessary for ML-heavy images with torch/pytorch dependencies
        echo "=== Disk space before cleanup ==="
        df -h /

        # Remove Android SDK (saves ~10GB)
        sudo rm -rf /usr/local/lib/android || true

        # Remove .NET SDK (saves ~2GB)
        sudo rm -rf /usr/share/dotnet || true

        # Remove Haskell/GHC (saves ~5GB)
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/.ghcup || true

        # Remove CodeQL (saves ~1GB)
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true

        # Remove Swift (saves ~1GB)
        sudo rm -rf /usr/share/swift || true

        # Clean apt cache
        sudo apt-get clean || true

        # Prune Docker to free space
        docker system prune -af || true
        docker builder prune -af || true

        echo "=== Disk space after cleanup ==="
        df -h /

    - name: Build Docker image
      run: docker build -t mercury-agent:scan .

    - name: Run Trivy vulnerability scanner
      # Blocking.  CRITICAL/HIGH/MEDIUM fixable vulnerabilities in the
      # built image fail the PR.  exit-code: '1' is what makes this
      # actually block - without it, trivy-action returns 0 regardless of
      # findings and the SARIF upload becomes the only signal.
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'mercury-agent:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        vuln-type: 'os,library'
        ignore-unfixed: true
        skip-dirs: '/var/lib/apt/lists,/var/cache/apt'
        trivyignores: .trivyignore
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      # if: always() ensures the SARIF reaches the Security tab even when
      # the scan step failed.  No continue-on-error - upload failures
      # signal a real infra problem worth blocking on.
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-container-scan'

    - name: Render Trivy findings to job summary
      # Human-readable table for the Actions job summary.  Runs only when
      # the SARIF scan failed, since on success there is nothing to show.
      # Blocking is already enforced by the SARIF scan above; this step
      # never alters job outcome.
      if: failure()
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'mercury-agent:scan'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        vuln-type: 'os,library'
        ignore-unfixed: true
        trivyignores: .trivyignore
        exit-code: '0'

  filesystem-scan:
    name: Filesystem Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy filesystem scanner
      # Blocking.  CRITICAL/HIGH/MEDIUM fixable findings in src/ fail the
      # PR.  exit-code: '1' is what makes this gate actually block.
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        ignore-unfixed: true
        trivyignores: .trivyignore
        skip-dirs: 'tests,docs,benchmarks'
        exit-code: '1'

    - name: Upload Trivy filesystem results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-fs-results.sarif'
        category: 'trivy-filesystem-scan'

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, container-scan, filesystem-scan, secret-scan]
    if: always()
    steps:
    - name: Check security scan results
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Filesystem Scan | ${{ needs.filesystem-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
