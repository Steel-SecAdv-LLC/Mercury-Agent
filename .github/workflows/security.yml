name: Security

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday
  # Manual dispatch is the recovery path when a push to ``main`` is
  # accidentally suppressed by a skip-directive substring in the squash
  # merge commit message (see CONTRIBUTING.md "Squash-merge gotcha").
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install security tools
      run: |
        pip install --upgrade "pip>=26.1"
        pip install safety bandit pip-audit

    # The three scanners below all emit JSON for the upload-artifact step.
    # They write their report files unconditionally, then we explicitly
    # surface findings via a separate parse-and-summarize step.  The
    # workflow no longer uses the step-level continue-on-error escape
    # non-zero exits — the scanners' exit codes are interpreted in
    # ``Surface scanner findings`` below so a CRITICAL finding is
    # visible as a failure rather than silently skipped.
    - name: Run Safety check
      # Three compatibility points relative to legacy invocations:
      #
      # 1. Safety ≥ 3.7 changed ``--output`` to take a format name only
      #    (one of ``screen|text|json|bare|html``); writing the report
      #    is done by redirecting stdout.  The pre-3.7 form
      #    ``--output <path>`` exits 2 with ``Invalid value for '--output'``
      #    before any scan runs.
      # 2. Without ``--policy-file``, ``safety check`` auto-discovers
      #    ``.safety-policy.yml`` (v3 schema), which the legacy ``check``
      #    parser rejects with ``policy file version 3.0 ... not
      #    supported``.  Passing the v2 shim file matches the blocking
      #    Safety step in ``ci.yml`` (see ``.safety-policy-v2.yml``
      #    header for the rationale).
      # 3. Safety ≥ 3.7 replaced the value-taking ``--exit-code 0`` with
      #    a boolean ``--continue-on-error`` flag (passing ``--exit-code 0``
      #    now produces ``Got unexpected extra argument (0)``).  This step
      #    is the non-blocking surface-and-summarize lane (the blocking
      #    gate lives in ``ci.yml``), so we want exit 0 regardless of
      #    findings — ``--continue-on-error`` is the new equivalent.
      run: |
        safety check \
          --policy-file .safety-policy-v2.yml \
          --output json \
          --continue-on-error \
          > safety-report.json

    - name: Run pip-audit
      # pip-audit exits non-zero when vulnerabilities are found.  We
      # intentionally swallow that exit code at this step (the JSON
      # report is the artifact of record) and let the dedicated
      # ``Surface scanner findings`` step decide the workflow outcome.
      shell: bash
      run: |
        set +e
        pip-audit --format json --output pip-audit-report.json
        rc=$?
        # rc 0 = clean, 1 = vulnerabilities found (expected), anything
        # else (network failure, dep-resolution crash) = real problem.
        if [ "$rc" -gt 1 ]; then
          echo "::error::pip-audit failed with rc=$rc (not a vuln-found exit)"
          exit "$rc"
        fi

    - name: Run Bandit security scan
      run: bandit -r src/omni_mercury_engine/ -f json -o bandit-report.json --severity-level medium --exit-zero

    - name: Surface scanner findings
      run: |
        set -euo pipefail
        FAIL=0
        # Each scanner emits its own JSON schema; we look for the documented
        # "vulnerabilities" / "results" keys and count CRITICAL/HIGH entries.
        if [ -f safety-report.json ]; then
          COUNT=$(jq '(.vulnerabilities // []) | length' safety-report.json)
          echo "Safety: $COUNT vulnerabilities reported"
          [ "$COUNT" -gt 0 ] && FAIL=1
        fi
        if [ -f pip-audit-report.json ]; then
          COUNT=$(jq '[.dependencies[]?.vulns[]?] | length' pip-audit-report.json)
          echo "pip-audit: $COUNT vulnerabilities reported"
          [ "$COUNT" -gt 0 ] && FAIL=1
        fi
        if [ -f bandit-report.json ]; then
          COUNT=$(jq '.results | length' bandit-report.json)
          echo "Bandit: $COUNT findings"
          [ "$COUNT" -gt 0 ] && FAIL=1
        fi
        if [ "$FAIL" -eq 1 ]; then
          echo "::warning::Security scanners reported findings; review the uploaded reports."
        fi

    - name: Upload Security Reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          safety-report.json
          pip-audit-report.json
          bandit-report.json
        retention-days: 30

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Free disk space
      shell: bash
      run: |
        set -euo pipefail
        # Remove unused toolchains to free up disk space for large Docker images.
        # Each path is removed only if it exists — the previous tail-of-line
        # error-swallow shortcuts are replaced with explicit existence checks
        # so a permission error or other unexpected failure surfaces instead
        # of being silently swallowed (v1.6.0 corrective sweep §9).
        echo "=== Disk space before cleanup ==="
        df -h /

        cleanup_paths=(
          /usr/local/lib/android
          /usr/share/dotnet
          /opt/ghc
          /usr/local/.ghcup
          /opt/hostedtoolcache/CodeQL
          /usr/share/swift
        )
        for path in "${cleanup_paths[@]}"; do
          if [ -e "$path" ]; then
            sudo rm -rf "$path"
          fi
        done

        # apt-get clean is a no-op when the cache is already empty,
        # so it doesn't need a fallback.
        sudo apt-get clean

        # docker prune exits 0 when there is nothing to prune.
        docker system prune -af
        docker builder prune -af

        echo "=== Disk space after cleanup ==="
        df -h /

    - name: Build Docker image
      run: docker build -t mercury-agent:scan .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'mercury-agent:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        limit-severities-for-sarif: true
        vuln-type: 'os,library'
        # Ignore unfixed vulnerabilities to reduce noise
        ignore-unfixed: true
        # Skip duplicate detection across layers and huge ML header files
        # that cause context-deadline-exceeded timeouts in secret scanning
        skip-dirs: '/var/lib/apt/lists,/var/cache/apt'
        skip-files: 'opt/venv/lib/python3.12/site-packages/torch/include/ATen/Tensor.h,opt/venv/lib/python3.12/site-packages/tensorflow/include/tensorflow/compiler/mlir/tensorflow/ir/tf_all_ops.h.inc'
        # Honor documented risk acceptances in .trivyignore
        trivyignores: .trivyignore
        timeout: '15m'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-container-scan'

    - name: Run Trivy in table format for PR comments
      # The earlier sarif-format Trivy step already uploaded findings to
      # the GitHub Security tab and ran ``ignore-unfixed`` + ``trivyignores``
      # to scope the output. This second pass is a *display-only* table
      # rendering for PR-comment context. Drop ``exit-code: 1`` so the
      # absence of new high-severity findings (the desired state) is
      # what determines workflow success — the SARIF upload above is
      # the single authoritative gate. (v1.6.0 corrective sweep §9)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'mercury-agent:scan'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        vuln-type: 'os,library'
        ignore-unfixed: true
        trivyignores: .trivyignore
        exit-code: '0'

  filesystem-scan:
    name: Filesystem Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Run Trivy filesystem scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        # Ignore unfixed vulnerabilities for consistency with container scan
        ignore-unfixed: true
        # Honor documented risk acceptances in .trivyignore
        trivyignores: .trivyignore
        # Skip test files and documentation
        skip-dirs: 'tests,docs,benchmarks'

    - name: Upload Trivy filesystem results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-fs-results.sarif'
        category: 'trivy-filesystem-scan'

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    steps:
    - uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, container-scan, filesystem-scan, secret-scan]
    if: always()
    steps:
    - name: Check security scan results
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Filesystem Scan | ${{ needs.filesystem-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
