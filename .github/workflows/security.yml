name: Security

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install security tools
      run: |
        pip install --upgrade "pip>=26.0"
        pip install safety bandit pip-audit

    - name: Run Safety check
      # Safety check for known Python vulnerabilities
      # continue-on-error: upstream CVEs in transitive deps shouldn't hard-block PRs,
      # but removing || true ensures the step visibly fails when issues are found.
      continue-on-error: true
      run: safety check --json --output safety-report.json

    - name: Run pip-audit
      # pip-audit provides more comprehensive vulnerability detection
      continue-on-error: true
      run: pip-audit --format json --output pip-audit-report.json

    - name: Run Bandit security scan
      # Bandit scans for common security issues in Python code
      continue-on-error: true
      run: bandit -r src/omni_mercury_engine/ -f json -o bandit-report.json --severity-level medium

    - name: Upload Security Reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          pip-audit-report.json
          bandit-report.json
        retention-days: 30

  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      run: |
        # Remove unused toolchains to free up disk space for large Docker images
        # This is necessary for ML-heavy images with torch/pytorch dependencies
        echo "=== Disk space before cleanup ==="
        df -h /
        
        # Remove Android SDK (saves ~10GB)
        sudo rm -rf /usr/local/lib/android || true
        
        # Remove .NET SDK (saves ~2GB)
        sudo rm -rf /usr/share/dotnet || true
        
        # Remove Haskell/GHC (saves ~5GB)
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/.ghcup || true
        
        # Remove CodeQL (saves ~1GB)
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
        
        # Remove Swift (saves ~1GB)
        sudo rm -rf /usr/share/swift || true
        
        # Clean apt cache
        sudo apt-get clean || true
        
        # Prune Docker to free space
        docker system prune -af || true
        docker builder prune -af || true
        
        echo "=== Disk space after cleanup ==="
        df -h /

    - name: Build Docker image
      run: docker build -t mercury-agent:scan .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'mercury-agent:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        vuln-type: 'os,library'
        # Ignore unfixed vulnerabilities to reduce noise
        ignore-unfixed: true
        # Skip duplicate detection across layers
        skip-dirs: '/var/lib/apt/lists,/var/cache/apt'
        # Honor documented risk acceptances in .trivyignore
        trivyignores: .trivyignore

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
        category: 'trivy-container-scan'

    - name: Run Trivy in table format for PR comments
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'mercury-agent:scan'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        vuln-type: 'os,library'
        ignore-unfixed: true
        trivyignores: .trivyignore
        exit-code: '1'
      continue-on-error: true

  filesystem-scan:
    name: Filesystem Security Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy filesystem scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-fs-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        # Ignore unfixed vulnerabilities for consistency with container scan
        ignore-unfixed: true
        # Honor documented risk acceptances in .trivyignore
        trivyignores: .trivyignore
        # Skip test files and documentation
        skip-dirs: 'tests,docs,benchmarks'

    - name: Upload Trivy filesystem results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-fs-results.sarif'
        category: 'trivy-filesystem-scan'

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    steps:
    - uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, container-scan, filesystem-scan, secret-scan]
    if: always()
    steps:
    - name: Check security scan results
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Scan Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Filesystem Scan | ${{ needs.filesystem-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
