name: Live-Data Validation Gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benchmarks/**'
      - '.github/workflows/live-data-validation.yml'

jobs:
  live-data-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[all]"
          pip install pytest-json-report

      - name: Generate baseline (first run only)
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f benchmarks/live_data_baseline.json ]; then
            python scripts/generate_baseline_report.py
            echo "Baseline generated"
          fi

      - name: Run live-data validation suite
        run: |
          pytest tests/validation/test_real_data_validation.py -v --tb=short \
            --timeout=1800 \
            --json-report --json-report-file=live-data-report.json
        timeout-minutes: 35
        env:
          MERCURY_RUN_LIVE_DATA: "true"

      - name: Check benchmark thresholds
        if: always()
        run: |
          python scripts/validate_live_data_metrics.py
        env:
          MERCURY_MIN_ADBENCH_AUC: "0.55"
          MERCURY_MIN_NSLKDD_F1: "0.50"
          MERCURY_MIN_NSLKDD_AUC: "0.55"
          MERCURY_ALLOW_REGRESSION: "0.02"

      - name: Store report history
        if: always()
        run: |
          git_commit=$(git rev-parse --short HEAD)
          timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          mkdir -p benchmarks/history
          cp live-data-report.json "benchmarks/history/${timestamp}_${git_commit}.json" 2>/dev/null || true

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-data-report-${{ github.run_id }}
          path: live-data-report.json
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## Live-Data Validation Report\n\n';

            try {
              const report = JSON.parse(fs.readFileSync('live-data-report.json', 'utf8'));
              const tests = report.tests || [];
              const passed = tests.filter(t => t.outcome === 'passed').length;
              const failed = tests.filter(t => t.outcome === 'failed').length;
              const skipped = tests.filter(t => t.outcome === 'skipped').length;

              body += `- **Passed:** ${passed}\n`;
              body += `- **Failed:** ${failed}\n`;
              body += `- **Skipped:** ${skipped}\n`;
              body += `\n**Status:** ${failed === 0 ? 'All thresholds met' : 'Regressions detected'}\n`;
            } catch (e) {
              body += 'Report not available (tests may have timed out).\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });
