name: live-data-validation

# Exercises every KEYED Mercury loader against its real endpoint and asserts
# real rows come back, so the wired GitHub Actions secrets are proven effective
# (not merely present). Network-dependent and secret-dependent -- NEVER a PR
# gate. Runs weekly and on demand; a keyed loader whose secret is absent is
# reported SKIP, and any keyed-and-configured loader that returns empty/errors
# fails the job so live-wiring drift is caught within a week.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC (offset from the other weekly lanes)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-data-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keyed-loader-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Mercury Agent with the ml extra (loaders + torch import path)
        run: |
          # Floor pip to >=26.1 (CVE-2026-6357).
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"

      # AMA Cryptography is Mercury's mandatory PQC backend: importing
      # omni_mercury_engine runs the fail-closed PQC production gate, so even a
      # loader smoke aborts at import without the native backend.
      - name: Build + install AMA Cryptography (native PQC backend)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      - name: Keyed-loader live-data smoke
        env:
          # Live-data API keys. Every value is a repo secret injected only in
          # CI -- never committed, echoed, or written to any artifact. Where the
          # loader's env var differs from the secret name, BOTH are set to the
          # same secret (WildfireLoader reads NASA_FIRMS_MAP_KEY; the secret is
          # named FIRMS_MAP_KEY).
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          # USGS EROS M2M (login-token) needs BOTH the application token and the ERS username.
          USGS_KEY: ${{ secrets.USGS_KEY }}
          EROSERS_USERNAME: ${{ secrets.EROSERS_USERNAME }}
        run: |
          python scripts/live_data_smoke.py

  # Self-clearing failure alert (same idiom as gate-watchdog.yml / PR #354):
  # a red weekly run on main opens or updates a labeled tracking issue; the
  # next green run on main closes it. Without this, a red weekly run existed
  # only in the Actions tab — the EIA ``KeyError: 1`` regression ran red for
  # three consecutive Mondays with nobody told. Branch workflow_dispatch runs
  # are excluded so a green branch run cannot close an alert that is still
  # live on main. Uses no third-party actions: the preinstalled ``gh`` CLI
  # authenticates via the job's own token, and every call passes -R so no
  # checkout is needed.
  alert-on-failure:
    needs: keyed-loader-smoke
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      contains(fromJSON('["failure","success"]'), needs.keyed-loader-smoke.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TITLE: "live-data-validation: weekly keyed-loader smoke failing"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.keyed-loader-smoke.result }}
    steps:
      - name: Open/update or self-clear the live-data alert issue
        run: |
          set -euo pipefail
          existing="$(gh issue list -R "$REPO" --state open --label live-data-validation \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number' || true)"
          if [ "$RESULT" = "failure" ]; then
            body="Weekly keyed-loader live-data smoke FAILED: $RUN_URL — see the job log's FAILED-loaders summary. A keyed-and-configured loader returned empty or errored, i.e. live-wiring drift."
            if [ -n "$existing" ]; then
              printf '%s' "$body" | gh issue comment -R "$REPO" "$existing" --body-file -
            else
              gh label create live-data-validation -R "$REPO" --color B60205 \
                --description "Weekly live-data smoke alerts" 2>/dev/null || true
              printf '%s' "$body" | gh issue create -R "$REPO" --title "$TITLE" \
                --label live-data-validation --body-file -
            fi
          elif [ -n "$existing" ]; then
            printf 'Weekly keyed-loader smoke is green again: %s' "$RUN_URL" \
              | gh issue comment -R "$REPO" "$existing" --body-file -
            gh issue close -R "$REPO" "$existing" --reason completed
          fi
