# Mercury-Agent Transparent Fitness Substrate / Governed Promotion Gate
# Phases 1-3 of governed recursive self-improvement.
#
# This is the leakage-split gate and promotion decision harness the
# autonomous self-improvement loop reads from.
# It enforces, on every PR to a release branch:
#
#   1. The loader-side label-provenance audit is clean
#      (tests/loaders/test_label_provenance_gate.py): every concrete
#      live-API loader is registered with an audited LABEL_SOURCE and the
#      AST circularity heuristic stays silent on the genuine ones.
#   2. The governed-fusion manifest's per-event label_provenance /
#      series_provenance / external_label tags agree with the loader
#      registry and reconcile to the committed provenance_summary
#      (tests/research/test_governed_fusion_label_provenance.py).
#   3. The marginal-ablation ledger module produces records matching its
#      committed schema and computes leave-one-out lift correctly on
#      synthetic ground truth (tests/research/test_marginal_ablation_ledger.py).
#   4. The Phase 2 governed-promotion gate promotes only external-label
#      improvements, rejects broadened/unsafe proposals, and emits rollback
#      decisions for failed canaries.
#   5. The measurement entry point itself runs and appends one record (an
#      informational 'needs_cache' record when no $GF_CACHE_DIR is present
#      on the runner, otherwise the real per-component lift). The ledger is
#      uploaded as a CI artifact for review and Phase 3 routing.
#
# Loosening any of these gates to make CI pass is an automatic failure of
# the governed-self-improvement discipline: a fitness signal that can be
# silently broadened to admit leakage is no signal at all.
#
# Copyright (C) 2025 Steel Security Advisors LLC

name: Transparent Fitness Substrate (Promotion Gate)

permissions:
  contents: read

concurrency:
  group: ablation-ledger-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Nightly, 05:17 UTC.  Decoupled from fusion-regression's Sunday weekly
    # so a manifest-drift surfaces within 24h not 7 days.
    - cron: "17 5 * * *"

env:
  PYTHON_VERSION: "3.12"
  MERCURY_REQUIRES_ML: "1"

jobs:
  ablation-ledger:
    name: Leakage-split gate + marginal ablation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mercury [ml] + test tooling
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"
          pip install pytest pytest-asyncio scikit-learn hypothesis

      # AMA Cryptography is the mandatory PQC backend; the package fails
      # closed at import without it.
      - name: Build AMA Cryptography (native PQC)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      # 1. Loader-side audit -- the foundation everything else stands on.
      - name: Loader label-provenance audit
        run: python -m omni_mercury_engine.loaders.label_provenance --check

      # 2. Manifest integrity vs loader registry (offline, no cache).
      - name: Manifest provenance integrity
        run: pytest tests/research/test_governed_fusion_label_provenance.py -q

      # 3. Ablation ledger schema + math correctness on synthetic events.
      - name: Marginal-ablation ledger unit tests
        run: pytest tests/research/test_marginal_ablation_ledger.py -q

      # 4. Promotion gate: held-out replay, capability, safety, and rollback.
      - name: Governed promotion gate unit tests
        run: pytest tests/research/test_governed_promotion_gate.py -q

      # 5. Reachability only.  This lane deliberately does NOT warm the score
      # cache: it runs on every PR and must stay fast and network-free, so it
      # writes a 'needs_cache' record (exit 0) proving the measurement path is
      # callable.  The measuring lane below is the one that produces numbers.
      - name: Measure marginal-ablation ledger (reachability)
        run: |
          source research/governed_fusion/gf_env.sh
          python research/governed_fusion/measure_marginal_ablation.py

      - name: Upload ablation ledger
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ablation-ledger
          path: research/governed_fusion/ablation_ledger.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # The measuring lane.
  #
  # The job above proves the measurement path is reachable; it cannot measure,
  # because a GitHub runner has no $GF_CACHE_DIR and the reachability lane is not
  # allowed to spend network time warming one.  Without this job the ledger only
  # ever accumulates 'needs_cache' records, `promotion_gate._latest_ok_ledger_run`
  # has exactly one real baseline to compare against (2026-08-04), and the
  # marginal-lift figures -- including kinematic's measured -0.034 AUROC -- rest
  # on a single measurement that nothing re-runs.
  #
  # This job warms the cache from the live loaders, then measures with --check so
  # a lane that cannot measure fails loudly instead of appending another
  # 'needs_cache' and exiting green.  It is excluded from pull_request for the
  # reason above: it is slow and it reaches the network.
  #
  # Results are uploaded, never committed.  docs/BENCHMARKS.md states the rule --
  # committed ledger records come from deliberate measured runs, never from CI
  # side effects -- and `contents: write` is refused to this file by
  # scripts/check_workflow_hardening.py regardless.
  # ---------------------------------------------------------------------------
  ablation-measure:
    name: Cache-warmed marginal ablation (measuring lane)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mercury [ml] + test tooling
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"
          pip install scikit-learn

      - name: Build AMA Cryptography (native PQC)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      # The score cache is a pure function of (event data, cap, seed, detector),
      # so it is safe to carry between runs and re-warming it on every nightly
      # would hammer the upstreams for no new information. The key carries the
      # input pin and the detector source, so a change to either invalidates it
      # rather than measuring new code against stale scores.
      - name: Restore governed-fusion score cache
        id: gf-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/gf_cache
          key: >-
            gf-scores-v1-${{ hashFiles('research/governed_fusion/manifest.json',
            'src/omni_mercury_engine/detectors/statistical.py',
            'research/governed_fusion/score_cache.py') }}

      # Fits the detector once per event and caches the scores. Only the
      # external-label subset is measured downstream, but measure_baseline warms
      # the whole live suite in one pass, which is what the cache key covers.
      - name: Warm the score cache from the live loaders
        if: steps.gf-cache.outputs.cache-hit != 'true'
        run: |
          source research/governed_fusion/gf_env.sh
          python research/governed_fusion/measure_baseline.py

      # --check turns "could not measure" into a failure. That is the whole point
      # of this lane: a measuring job that silently records 'needs_cache' is the
      # state this job exists to end.
      - name: Measure marginal ablation (gated)
        run: |
          source research/governed_fusion/gf_env.sh
          python research/governed_fusion/measure_marginal_ablation.py --check

      - name: Upload measured ablation ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ablation-ledger-measured
          path: research/governed_fusion/ablation_ledger.json
          retention-days: 90
