name: Verifiers

# Oracle-validated verifier family: runs the full suite (including the live Lean theorem tier)
# and the mystery-verification benchmark. Isolated from the main CI workflow by design.

# Least-privilege: this lane only reads the checkout, runs tests, and prints a
# benchmark delta -- it never writes to the repo, so contents: read is the full
# permission surface it needs.
permissions:
  contents: read

# Cancel a superseded run on the same ref so a force-push does not pile up
# 30-minute Lean installs.
concurrency:
  group: verifiers-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "src/omni_mercury_engine/verifiers/**"
      - "src/omni_mercury_engine/security/sigma_immutable_gate.py"
      - "src/omni_mercury_engine/core/global_omni_scalar_network.py"
      - "tests/test_goldbach_verifier.py"
      - "tests/test_twin_primes_verifier.py"
      - "tests/test_collatz_verifier.py"
      - "tests/test_lean_theorem_verifier.py"
      - "tests/test_physics_verifier.py"
      - "tests/test_paradox_verifier.py"
      - "tests/test_verifier_oracles.py"
      - "tests/test_mystery_registry.py"
      - "tests/test_three_state_contract.py"
      - "tests/security/test_sigma_immutable_discrimination.py"
      - "benchmarks/mystery_verification_benchmark.py"
      - "scripts/sigma_immutable_discrimination_check.py"
      - ".github/workflows/verifiers.yml"
  workflow_dispatch:

jobs:
  verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The [ml] extra pulls ~5.4 GB of CUDA torch wheels (torch + nvidia-* cu13);
      # together with the Lean toolchain that exhausts the ~14 GB runner disk and the
      # install dies with ENOSPC -- a deterministic early failure no pip retry can cure.
      # Reclaim the image's preinstalled toolchains first, mirroring the free-disk step
      # ci.yml already runs ahead of its torch lanes.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' 'temurin-.*' 'ghc.*' 'mysql.*' 'postgresql.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"
          pip install pytest pytest-asyncio

      - name: Install Lean 4 (theorem-tier oracle)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain stable
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Lean is available
        run: lean --version

      - name: Run verifier test suite (Lean live)
        # MERCURY_REQUIRES_ML / MERCURY_REQUIRES_LEAN make this lane's
        # must-run tiers fail-loud: if torch or Lean is absent the pytest
        # session aborts at start instead of letting the torch-gated and
        # Lean-gated tests skip into a misleading green (see tests/conftest.py).
        env:
          MERCURY_REQUIRES_ML: "1"
          MERCURY_REQUIRES_LEAN: "1"
        run: |
          pytest \
            tests/test_goldbach_verifier.py \
            tests/test_twin_primes_verifier.py \
            tests/test_collatz_verifier.py \
            tests/test_lean_theorem_verifier.py \
            tests/test_physics_verifier.py \
            tests/test_paradox_verifier.py \
            tests/test_verifier_oracles.py \
            tests/test_mystery_registry.py \
            tests/test_three_state_contract.py \
            tests/security/test_sigma_immutable_discrimination.py \
            -v -p no:cov

      - name: σ_Immutable discrimination probe (gate must discriminate, not false-assure)
        # Exits non-zero (2) if the gate is near-constant-PASS, so the
        # headline safety finding of #242 is enforced before merge.
        env:
          MERCURY_REQUIRES_ML: "1"
        run: |
          python scripts/sigma_immutable_discrimination_check.py --json /tmp/sigma_discrimination.json

      - name: Run mystery-verification benchmark and assert the delta
        run: |
          python benchmarks/mystery_verification_benchmark.py --out /tmp/mystery.json
          python -c "import json; d = json.load(open('/tmp/mystery.json')); assert d['oracle_grounded']['fabrication_detection_rate'] == 1.0, d; assert d['credulous_baseline']['fabrication_detection_rate'] == 0.0, d; print('delta verified: fabrication detection 0.00 -> 1.00')"
