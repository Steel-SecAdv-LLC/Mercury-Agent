name: Auto-Format

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, devin/* ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dev tools
        run: pip install -r requirements-dev.txt
      
      - name: Check formatting with Black
        run: black --check src/ tests/ benchmarks/ tools/ examples/ setup.py
