# Mercury-Agent Tier 0 safety-foundation CI lanes.
#
# Four focused, fail-closed gates for the safety foundation:
#   * ci/tier0-verify       -- import-time native PQC build + version pin
#   * ci/gate-unit          -- fail-closed + capability-contract unit tests
#   * ci/meaning-level      -- served-model adversarial false-negative budget
#   * ci/rolling-corpus-eval-- rolling corpus integrity + OOF ECE/Brier
#
# The job display names are literally `ci/<lane>` so branch-protection required
# checks read as `Tier 0 Safety / ci/tier0-verify` etc. To make them REQUIRED for
# PRs touching gate logic, add those check names in the repository's branch
# protection settings (see docs/INSTALLATION.md "Tier 0 minimal configuration").
#
# Copyright (C) 2025 Steel Security Advisors LLC

name: Tier 0 Safety

permissions:
  contents: read

concurrency:
  group: tier0-safety-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  tier0-verify:
    name: ci/tier0-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mercury (core) + test tooling
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Build AMA Cryptography (native PQC)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v3.2.0

      - name: Import-time gate must succeed with a real, correctly-versioned AMA
        run: python -c "import omni_mercury_engine; print('omni_mercury_engine imported (PQC gate passed)')"

      - name: Import-time gate must FAIL closed on a wrong AMA_CRYPTO_VERSION
        run: |
          if AMA_CRYPTO_VERSION=9.9.9 python -c "import omni_mercury_engine" 2>/dev/null; then
            echo "::error::PQC gate accepted AMA_CRYPTO_VERSION=9.9.9 (should fail closed)"
            exit 1
          fi
          echo "OK: mismatched AMA_CRYPTO_VERSION rejected fail-closed"

      - name: PQC startup-gate unit tests
        run: pytest tests/test_pqc_startup_gate.py -q

  gate-unit:
    name: ci/gate-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mercury [ml] + test tooling
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"
          pip install pytest pytest-asyncio pytest-mock hypothesis

      - name: Build AMA Cryptography (native PQC)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v3.2.0

      - name: Fail-closed + capability-contract + no-weakening unit tests
        run: >-
          pytest
          tests/ethical/test_capability_contract.py
          tests/ethical/test_weapons_gate_fail_closed.py
          tests/ethical/test_gates_present_no_weakening.py
          tests/security/test_sigma_immutable_fail_closed.py
          tests/security/test_escalation_audit_integration.py
          tests/scripts/test_ingest_weapons_gate_corpus.py
          tests/benchmarks/test_rolling_corpus_eval.py
          tests/test_pqc_startup_gate.py
          -q

  meaning-level:
    name: ci/meaning-level
    runs-on: ubuntu-latest
    # Always-on served-model lane. A validated stdlib HTTP double
    # (benchmarks/meaning_level_model_double.py) stands in for a served reasoning
    # model -- no multi-GB download -- so the meaning-level routing rescue is
    # exercised and its adversarial false-negative budget measured on EVERY PR in
    # seconds. The double is validated, not a rubber stamp: it cuts held-out
    # adversarial FN with zero false positives. For a deeper real-model
    # measurement, set the CI_MEANING_LEVEL_ENABLED repo variable and swap the
    # double for the real-Ollama block (git history of this file).
    timeout-minutes: 20
    env:
      MERCURY_MODEL_ENDPOINT: "http://127.0.0.1:11434"
      MERCURY_OLLAMA_MODEL: "llama3.2:3b"
      MERCURY_CI_REQUIRE_REAL_CLASSIFIER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mercury [ml] + test tooling
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"
          pip install pytest pytest-asyncio

      - name: Build AMA Cryptography (native PQC)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v3.2.0

      - name: Serve the validated meaning-level model double
        run: |
          nohup python benchmarks/meaning_level_model_double.py >/tmp/double.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:11434/api/tags

      - name: Confirm the meaning-level classifier is served
        run: |
          python -c "
          from omni_mercury_engine.cognitive.harm_classifier import real_harm_classifier_available
          assert real_harm_classifier_available(), 'meaning-level classifier not served; lane cannot measure'
          print('meaning-level classifier active')
          "

      - name: Adversarial FN budget (served-model path) + validated-double checks
        run: >-
          pytest
          tests/ethical/test_meaning_level_double.py
          tests/ethical/test_weapons_gate_adversarial_eval.py::test_real_classifier_fn_budget
          -q

      - name: Sample run artifact (served-model via the double)
        run: |
          mkdir -p artifacts
          PYTHONPATH=src:benchmarks python -c "
          import json
          from eval_weapons_gate_adversarial import evaluate
          from omni_mercury_engine.cognitive.harm_classifier import default_harm_classifier
          metrics = evaluate(classifier=default_harm_classifier())
          print(json.dumps({k: v.to_dict() for k, v in metrics.items()}, indent=2))
          " | tee artifacts/meaning_level_sample_run.txt

      - name: Upload meaning-level sample run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meaning-level-sample-run
          path: artifacts/meaning_level_sample_run.txt
          retention-days: 30

  rolling-corpus-eval:
    name: ci/rolling-corpus-eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mercury (core) + benchmark tooling
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e .
          pip install pytest

      - name: Build AMA Cryptography (native PQC)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v3.2.0

      - name: Corpus integrity + versioning check
        run: python scripts/ingest_weapons_gate_corpus.py --check

      - name: Out-of-fold ECE/Brier regression gate
        run: PYTHONPATH=src python benchmarks/rolling_corpus_eval.py --check

      - name: Emit fresh OOF metrics artifact
        if: always()
        run: |
          mkdir -p artifacts
          PYTHONPATH=src python benchmarks/rolling_corpus_eval.py > artifacts/oof_metrics.json || true
          cp benchmarks/weapons_gate_oof_baseline.json artifacts/ 2>/dev/null || true
          cp benchmarks/weapons_gate_calibration_report.md artifacts/ 2>/dev/null || true

      - name: Upload OOF metrics + baseline + report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rolling-corpus-oof
          path: |
            artifacts/oof_metrics.json
            artifacts/weapons_gate_oof_baseline.json
            artifacts/weapons_gate_calibration_report.md
          retention-days: 90
