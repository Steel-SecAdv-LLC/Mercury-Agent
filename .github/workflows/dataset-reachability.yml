name: Dataset Reachability

# ---------------------------------------------------------------------------
# Nightly reachability harness for the 11 currently-unreachable Mercury
# dataset loaders flagged in CHANGELOG.md's reproducibility footnote
# (SMAP, MSL, CICIDS-2017, MIT-BIH, UCR, SWaT, WADI, USGS Geochemistry,
# NOAA StormEvents, NOAA ERDDAP, FEMA HazardMitigation).
#
# Why a separate workflow:
#   * The reachability tests are marked ``@pytest.mark.network`` and
#     ``tests/conftest.py`` auto-skips them unless
#     ``MERCURY_NETWORK_TESTS=1`` is set. Without an opt-in workflow, an
#     upstream provider outage would silently drop a dataset from the
#     headline 75-set benchmark comparison and no human would notice.
#   * Running these on every PR would slam external providers and
#     produce false-positive failures from transient network blips.
#     Nightly is the right cadence.
#
# Failure semantics:
#   * A *single* loader's failure marks this job ``failure`` but does
#     NOT block merges into ``main`` (this workflow is decoupled from
#     ``ci.yml`` for that reason).
#   * Maintainers should treat a sustained failure (>=3 consecutive
#     nights) as a signal to either fix the loader or update the
#     CHANGELOG footnote to remove the dataset from the reproducible-75
#     count.
# ---------------------------------------------------------------------------

on:
  schedule:
    # 04:17 UTC nightly — off-the-hour to avoid the GitHub-Actions
    # ``schedule`` queue's top-of-hour congestion that delays jobs by
    # 20+ minutes.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      include_offline:
        description: 'Also run the offline harness (default true)'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  # One reachability run at a time, no cancel-in-progress so an
  # operator-triggered ``workflow_dispatch`` can't pre-empt the
  # scheduled nightly mid-run.
  group: dataset-reachability
  cancel-in-progress: false

jobs:
  reachability:
    name: Reachability (${{ matrix.lane }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - network
          - offline
    timeout-minutes: 30

    env:
      # Force the harness to exercise the real-data path; the
      # synthetic fallback would defeat the purpose of a reachability
      # probe.
      MERCURY_ALLOW_SYNTHETIC: "0"
      # Opt into the network test lane.  ``tests/conftest.py`` auto-
      # skips ``@pytest.mark.network`` tests unless this env var is
      # set to ``1`` so the default CI lanes don't accidentally hit
      # the internet.  Here we explicitly opt in.
      MERCURY_NETWORK_TESTS: "1"

    steps:
      - name: Checkout repository (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout repository (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout repository (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Mercury + test dependencies
        run: |
          pip install --upgrade "pip>=26.1"
          pip install -e .[dev]
          pip install pytest pytest-cov pytest-asyncio

      # AMA Cryptography is Mercury's mandatory PQC backend and the import gate
      # fails closed with no env-var escape hatch (see src/omni_mercury_engine/
      # _pqc_gate.py: AMA_REQUIRE_REAL_PQC no longer disables it). tests/
      # conftest.py imports the engine at collection time, so the dataset-loader
      # suites below need the native backend built even though their own logic
      # only touches loaders. The composite action exports LD_LIBRARY_PATH for
      # both harness steps.
      - name: Build + install AMA Cryptography (native PQC backend)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      - name: Run offline reachability harness
        if: matrix.lane == 'offline' && (github.event_name != 'workflow_dispatch' || inputs.include_offline == 'true')
        run: |
          # The offline harness exercises constructor + simulated-
          # outage failure paths for all 11 loaders without making
          # any network calls.  Runs in the default-CI lane too
          # (this is a belt-and-braces re-run on the nightly).
          pytest tests/datasets/test_unreachable_loaders_offline.py -v --tb=short --no-cov

      - name: Run network reachability harness
        if: matrix.lane == 'network'
        env:
          # Live-data API keys for the keyed-loader reachability probes.
          # Every value is a repo secret injected only in CI -- never committed
          # or echoed. Where the loader's env var differs from the secret name,
          # BOTH are set to the same secret (documented per line).
          #
          # NASA FIRMS: WildfireLoader reads NASA_FIRMS_MAP_KEY; the repo secret
          # is named FIRMS_MAP_KEY.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          # NASA Open APIs (DONKI + NeoWs) -- space_weather + meteor loaders.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          # FRED (api.stlouisfed.org) -- financial_loader.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # EIA (api.eia.gov) -- energy_loader.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Alpha Vantage market data -- financial market loader.
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          # OpenWeatherMap -- weather loader.
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          # USGS EROS M2M (login-token) needs BOTH the application token and the ERS username.
          USGS_KEY: ${{ secrets.USGS_KEY }}
          EROSERS_USERNAME: ${{ secrets.EROSERS_USERNAME }}
        run: |
          # Opt-in network probes for the 11 unreachable loaders.
          # ``--no-cov`` keeps the run time bounded — coverage is
          # not the goal of this job. ``-s`` surfaces the per-loader
          # REACHABILITY VERDICT lines: a green job otherwise cannot
          # distinguish "reachable" from "loudly unreachable", so a
          # loader quietly becoming downloadable again was invisible.
          pytest -m network tests/datasets/test_unreachable_loaders_network.py -v -s --tb=short --no-cov

      - name: Upload reachability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dataset-reachability-${{ matrix.lane }}-${{ github.run_id }}
          path: |
            .pytest_cache/
            *.log
          retention-days: 14
          if-no-files-found: ignore
