name: Auto-Format

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, feature/* ]
  # Manual dispatch is the recovery path when a push to ``main`` is
  # accidentally suppressed by a ``[skip ci]`` substring in the squash
  # merge commit message (see CONTRIBUTING.md "Squash-merge gotcha").
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Black
        run: pip install "black>=26.3.1,<27.0.0"

      - name: Check formatting with Black
        run: black --check src/ tests/ benchmarks/ scripts/ examples/
