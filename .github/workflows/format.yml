name: Auto-Format

permissions:
  contents: read

concurrency:
  group: format-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, feature/* ]
  # Manual dispatch is the recovery path when a push to ``main`` is
  # accidentally suppressed by a skip-directive substring in the squash
  # merge commit message (see CONTRIBUTING.md "Squash-merge gotcha").
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6.0.2

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6.0.2 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout repository (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v6.0.2

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6.0.2 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout repository (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Black
        run: |
          # Floor pip to >=26.1 to close CVE-2026-6357 (pip arbitrary
          # code execution via malicious wheel).  Every ``pip install``
          # step in every workflow upgrades pip first so a runner image
          # that ships an older pip cannot install a poisoned wheel.
          python -m pip install --upgrade "pip>=26.1"
          # PINNED exactly (not just range-bounded) so the formatter is
          # byte-identical locally and in CI — same parity rationale as the
          # mypy/pydocstyle pins.  Bump in lockstep with pyproject [dev] and
          # the Code Quality job in ci.yml.
          pip install "black==26.3.1"

      - name: Check formatting with Black
        run: black --check src/ tests/ benchmarks/ scripts/ examples/
