name: Docker & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          # Additional cleanup for more disk space
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image to tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          tags: mercury-agent-mercury:latest
          # Cache reading only - cache writing removed to prevent BlobNotFound failures
          # when GitHub Actions cache infrastructure has transient issues
          cache-from: type=gha
          outputs: type=docker,dest=/tmp/mercury-image.tar

      - name: Run Trivy vulnerability scanner on tarball
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/mercury-image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Ignore unfixed vulnerabilities - only report CVEs with available patches
          # This reduces noise from OS-level CVEs that have no fix in Debian bookworm
          ignore-unfixed: true
          # Use .trivyignore for documented risk acceptances
          trivyignores: .trivyignore
          exit-code: 0
          timeout: 10m

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Cleanup tarball
        if: always()
        run: rm -f /tmp/mercury-image.tar
