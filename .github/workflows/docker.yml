name: Docker & Security

on:
  push:
    branches: [ main, neuro-symbolic-v1 ]
  pull_request:
    branches: [ main ]

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: mercury-agent-mercury:latest
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Run Trivy vulnerability scanner in standalone mode
        continue-on-error: true
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mercury-agent-mercury:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Ignore unfixed vulnerabilities - only report CVEs with available patches
          # This reduces noise from OS-level CVEs that have no fix in Debian bookworm
          ignore-unfixed: true
          # Use .trivyignore for documented risk acceptances
          trivyignores: .trivyignore
          exit-code: 0
          timeout: 10m

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
