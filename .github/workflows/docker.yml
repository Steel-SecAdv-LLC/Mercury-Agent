name: Docker & Security

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Manual dispatch is the recovery path when a push to ``main`` is
  # accidentally suppressed by a skip-directive substring in the squash
  # merge commit message (see CONTRIBUTING.md "Squash-merge gotcha").
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          # Additional cleanup for more disk space
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6.0.2

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6.0.2 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v6.0.2

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6.0.2 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image to tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          tags: mercury-agent-mercury:latest
          # Cache reading only - cache writing removed to prevent BlobNotFound failures
          # when GitHub Actions cache infrastructure has transient issues
          cache-from: type=gha
          outputs: type=docker,dest=/tmp/mercury-image.tar

      - name: Run Trivy vulnerability scanner on tarball
        continue-on-error: true
        # Action pinned to the same tagged version as security.yml's
        # and ci.yml's Trivy steps so every workflow that scans the
        # Mercury Agent container runs identical action code
        # (deterministic, supply-chain hardened).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/mercury-image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Ignore unfixed vulnerabilities - only report CVEs with available patches.
          # This reduces noise from OS-level CVEs that have no fix in Debian bookworm
          # and, under the current Dockerfile (`apt-get upgrade` in the runtime stage
          # plus `pip>=26.1` in both stages), leaves zero CRITICAL/HIGH findings —
          # no `.trivyignore` waiver list is needed.
          ignore-unfixed: true
          exit-code: 0
          timeout: 10m

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          # Distinct category so this advisory tarball scan does not
          # collide with security.yml's `trivy-container-scan` SARIF
          # upload (same filename, same image) or with ci.yml's
          # blocking PR-gate Trivy scan.  Without an explicit
          # category each workflow's findings would deduplicate
          # against the others in non-deterministic order.
          category: 'trivy-docker-advisory'

      - name: Cleanup tarball
        if: always()
        run: rm -f /tmp/mercury-image.tar
