name: Docker & Security

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Manual dispatch is the recovery path when a push to ``main`` is
  # accidentally suppressed by a skip-directive substring in the squash
  # merge commit message (see CONTRIBUTING.md "Squash-merge gotcha").
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          # Additional cleanup for more disk space
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          docker system prune -af || true
          docker builder prune -af || true
          df -h

      - name: Checkout (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker buildx create \
                --name mercury-builder \
                --driver docker-container \
                --driver-opt image=moby/buildkit:buildx-stable-1 \
                --use \
              && docker buildx inspect --bootstrap; then
              exit 0
            fi
            delay=$((attempt * 20))
            echo "::warning::Docker Buildx setup attempt ${attempt} failed; retrying in ${delay}s."
            docker buildx rm mercury-builder >/dev/null 2>&1 || true
            sleep "${delay}"
          done
          echo "::error::Docker Buildx setup failed after 3 attempts."
          exit 1

      - name: Build Docker image to tarball
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: false
          tags: mercury-agent-mercury:latest
          # Cache reading only - cache writing removed to prevent BlobNotFound failures
          # when GitHub Actions cache infrastructure has transient issues
          cache-from: type=gha
          outputs: type=docker,dest=/tmp/mercury-image.tar

      - name: Run Trivy vulnerability scanner on tarball
        continue-on-error: true
        # Action pinned to the same tagged version as security.yml's
        # and ci.yml's Trivy steps so every workflow that scans the
        # Mercury Agent container runs identical action code
        # (deterministic, supply-chain hardened).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/mercury-image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Advisory feed (exit-code 0): reports only CVEs with an available
          # patch, as an early fixable-findings signal for the SARIF tab.
          # Unfixed OS CVEs are deliberately out of scope here — the BLOCKING
          # gates in ci.yml/security.yml run `ignore-unfixed: false` and own
          # the accepted-risk posture via the enumerated, expiring repo-root
          # `.trivyignore` ledger (contract in SECURITY.md).
          ignore-unfixed: true
          exit-code: 0
          timeout: 10m

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: trivy-results.sarif
          # Distinct category so this advisory tarball scan does not
          # collide with security.yml's `trivy-container-scan` SARIF
          # upload (same filename, same image) or with ci.yml's
          # blocking PR-gate Trivy scan.  Without an explicit
          # category each workflow's findings would deduplicate
          # against the others in non-deterministic order.
          category: 'trivy-docker-advisory'

      - name: Cleanup tarball
        if: always()
        run: rm -f /tmp/mercury-image.tar
