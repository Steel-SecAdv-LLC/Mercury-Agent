name: Docker & Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Manual dispatch is the recovery path when a push to ``main`` is
  # accidentally suppressed by a skip-directive substring in the squash
  # merge commit message (see CONTRIBUTING.md "Squash-merge gotcha").
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: write

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          # Additional cleanup for more disk space
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          # docker prune exits 0 when there is nothing to prune, so the
          # previous tail-of-line error-swallow shortcuts are unnecessary.
          docker system prune -af
          docker builder prune -af
          df -h

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image to tarball
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          tags: mercury-agent-mercury:latest
          # Cache reading only - cache writing removed to prevent BlobNotFound failures
          # when GitHub Actions cache infrastructure has transient issues
          cache-from: type=gha
          outputs: type=docker,dest=/tmp/mercury-image.tar

      - name: Run Trivy vulnerability scanner on tarball
        # ``exit-code: 0`` makes Trivy emit the SARIF without failing
        # the workflow on findings — the SARIF is the artifact of
        # record and is reviewed via the Security tab. The previous
        # step-level continue-on-error was redundant with ``exit-code: 0``
        # and is removed (v1.6.0 corrective sweep §9).
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/mercury-image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          # Ignore unfixed vulnerabilities - only report CVEs with available patches
          # This reduces noise from OS-level CVEs that have no fix in Debian bookworm
          ignore-unfixed: true
          # Use .trivyignore for documented risk acceptances
          trivyignores: .trivyignore
          exit-code: 0
          timeout: 10m

      - name: Upload Trivy scan results to GitHub Security tab
        # ``if: always()`` runs the upload even when an earlier step
        # failed; the upload itself returning non-zero is genuinely
        # actionable (CodeQL ingestion problem) and should fail the
        # workflow rather than be hidden by ``continue-on-error``.
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      - name: Cleanup tarball
        if: always()
        run: rm -f /tmp/mercury-image.tar
