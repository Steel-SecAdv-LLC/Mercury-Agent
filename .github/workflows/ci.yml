  # ===========================================================================
  # Stage 7.5: Performance Benchmark Gate
  # ===========================================================================
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [core-tests]
    # Run on PRs to main/develop and scheduled runs
    if: |
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop')) ||
      github.event_name == 'schedule'

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android
          sudo apt-get autoremove -y

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e .
          pip install pytest pytest-benchmark

      - name: Run performance benchmarks
        # Performance gate: Detect regressions in key operations
        # Targets: GOSNN detection <100ms, cache hit rate >50%
        run: |
          python -c "
          import time
          import numpy as np
          from omni_mercury_engine.core.gosnn_integration import (
              TTLCache, GOSNNPerformanceMonitor, get_detection_cache
          )
          from omni_mercury_engine.ml.advanced_optimizers import (
              SyntheticGradientPredictor, get_gradient_cache
          )

          print('=' * 60)
          print('MERCURY AGENT PERFORMANCE BENCHMARK')
          print('=' * 60)

          # Test 1: TTLCache performance
          cache = TTLCache(max_size=1000)
          data = np.random.randn(100, 64)

          start = time.time()
          for i in range(1000):
              cache.set(data[i % 100], {'result': i})
          write_time = (time.time() - start) * 1000

          start = time.time()
          hits = 0
          for i in range(1000):
              if cache.get(data[i % 100]) is not None:
                  hits += 1
          read_time = (time.time() - start) * 1000

          print(f'TTLCache Write (1000 ops): {write_time:.2f}ms')
          print(f'TTLCache Read (1000 ops): {read_time:.2f}ms')
          print(f'TTLCache Hit Rate: {hits/1000*100:.1f}%')

          # Test 2: Synthetic Gradient Predictor
          predictor = SyntheticGradientPredictor(input_dim=128, hidden_dim=64)
          get_gradient_cache().clear()

          activations = np.random.randn(32, 128).astype(np.float32)

          start = time.time()
          for _ in range(100):
              predictor.forward(activations, use_cache=True)
          grad_time = (time.time() - start) * 1000

          grad_stats = get_gradient_cache().stats
          print(f'SyntheticGradient (100 ops): {grad_time:.2f}ms')
          print(f'Gradient Cache Hit Rate: {grad_stats[\"hit_rate\"]*100:.1f}%')

          # Performance assertions
          assert write_time < 500, f'TTLCache write too slow: {write_time}ms'
          assert read_time < 100, f'TTLCache read too slow: {read_time}ms'
          assert grad_time < 1000, f'Gradient prediction too slow: {grad_time}ms'

          print('=' * 60)
          print('ALL PERFORMANCE BENCHMARKS PASSED')
          print('=' * 60)
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-benchmark-results
          path: benchmark-results.json
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================================================
  # Stage 8: Docker Build
  # ===========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [core-tests, security-scan]
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' 'temurin-.*' 'ghc.*' 'mysql.*' 'postgresql.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true
          df -h

      - name: Prepare Trivy temp directory on /mnt
        # GitHub-hosted ubuntu runners only ship ~14 GB free on `/`, which
        # is exhausted when Trivy exports the loaded Docker image (the ML
        # image is multi-GB once decompressed) to its default tempdir
        # under /tmp.  /mnt is backed by a much larger ephemeral volume
        # (~70 GB free), so we point Trivy's tempdir + cache there to
        # avoid `no space left on device` during image export without
        # weakening the scan (no skipped paths, no severity reduction).
        run: |
          sudo mkdir -p /mnt/trivy-tmp /mnt/trivy-cache
          sudo chown -R "$USER:$USER" /mnt/trivy-tmp /mnt/trivy-cache
          df -h /mnt /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mercury-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Reclaim disk before Trivy scan
        # The buildx GHA cache export above leaves a sizable copy of the
        # image layers in the buildx builder cache on `/`, on top of the
        # daemon-side image we still need for the scan.  Drop the builder
        # cache (the daemon image survives because it is the scan target)
        # so Trivy has headroom for its image-export step.
        run: |
          docker buildx prune -af || true
          docker builder prune -af || true
          df -h /mnt /

      - name: Install Trivy binary
        # The bundled ``aquasecurity/setup-trivy`` action that
        # ``aquasecurity/trivy-action@v0.36.0`` invokes for us has a
        # known failure mode on PR runs whose ``actions/cache`` entry
        # for ``trivy-binary-v0.70.0-Linux-X64`` is cold: setup-trivy
        # then falls back to a sparse ``actions/checkout`` of the
        # ``aquasecurity/trivy`` repo at the tagged release SHA in
        # order to run the ``contrib/install.sh`` shipped in that
        # tree.  That sparse checkout's sub-object fetch trips
        # ``fatal: could not read Username for 'https://github.com':
        # terminal prompts disabled`` because the GitHub-issued
        # ``GITHUB_TOKEN`` credential helper installed by
        # ``actions/checkout`` is not propagated to the deferred
        # promisor-remote fetch underneath the sparse view.
        #
        # We sidestep that flake at source by installing the same
        # Trivy version directly from the project's documented
        # release-binary install script (which only ever talks to
        # ``github.com/aquasecurity/trivy/releases``, never to the
        # source tree) and then passing ``skip-setup-trivy: true``
        # below so the action consumes our binary instead of
        # attempting its own.  Same Trivy version, same scan policy,
        # deterministic install path — no weakening of the gate.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.70.0
          trivy --version

      - name: Scan Docker image with Trivy
        env:
          TMPDIR: /mnt/trivy-tmp
          TRIVY_TEMP_DIR: /mnt/trivy-tmp
          TRIVY_CACHE_DIR: /mnt/trivy-cache
        # Blocking gate.  Mirrors the standalone security.yml container scan
        # policy: ``ignore-unfixed`` drops Debian-bookworm CVEs that have no
        # available patch (status ``affected`` / ``will_not_fix``), and
        # ``vuln-type: os,library`` scopes the scan to the OS and Python
        # library surfaces this image actually ships.  Combined with the
        # Dockerfile's runtime-stage ``apt-get upgrade`` (which pulls the
        # latest bookworm security patches at build time) and the
        # ``pip>=26.1`` floor (which clears the pip-specific CVEs that used
        # to require a waiver), the scan reports zero CRITICAL/HIGH
        # findings without a separate `.trivyignore` acceptance list.
        # Action pinned to the same tagged version as security.yml's
        # Trivy steps so both workflows run identical action code
        # (deterministic, supply-chain hardened).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mercury-agent:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          vuln-type: 'os,library'
          ignore-unfixed: true
          exit-code: '1'
          timeout: '10m'
          # Use the binary installed in the explicit step above; see
          # that step's comment for the upstream-flake rationale.
          skip-setup-trivy: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          # Distinct category so the ci.yml blocking PR-gate Trivy run
          # does not silently overwrite or merge with security.yml's
          # `trivy-container-scan` upload or docker.yml's advisory
          # tarball scan upload.  All three workflows currently scan
          # the same image surface; the explicit categories let the
          # GitHub Security tab show each workflow's findings under
          # a deterministic key.
          category: 'trivy-ci-blocking'

  # ===========================================================================
  # Stage 9: Documentation Build
  # ===========================================================================
  docs-build:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [code-quality]
    # Run on all pushes and PRs (documentation should be validated on every change)
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install documentation tools
        # ``sphinx_autodoc_typehints`` is intentionally excluded — the docs
        # build never imports the package (see ``docs/conf.py``), so loading
        # the autodoc-typehints extension would only crash with
        # ``Unknown event name: autodoc-process-signature``.
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Build documentation
        # Blocking — Sphinx is the source-of-truth render of the narrative
        # docs (``ARCHITECTURE.md``, ``MATH_SPEC.md``, ``DEPLOYMENT.md``,
        # …).  A docs build that doesn't actually run is silent rot; if it
        # breaks, fix the underlying issue rather than ``continue-on-error``.
        run: |
          cd docs
          sphinx-build -b html . _build/html

  # ===========================================================================
  # Final Status Check
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - workflow-hardening
      - type-checking
      - core-tests
      - neuro-symbolic-tests
      - security-scan
      - integration-tests
      - performance-benchmark
    if: always()

    steps:
      - name: Check all jobs
        run: |
          # Check all blocking jobs.  neuro-symbolic-tests is part of the
          # rollup so the 7-phase cognitive architecture + safeguards
          # cannot regress without failing the CI Success gate.
          #
          # ``cancelled`` is treated as a blocking outcome alongside
          # ``failure`` so a cancelled (e.g. concurrency-cancelled or
          # manually-cancelled) upstream job cannot quietly turn into a
          # green CI Success.  ``skipped`` remains non-blocking because
          # performance-benchmark intentionally skips on push events and
          # would otherwise deadlock main/develop/feature pushes.
          fail=0
          for upstream in \
            "code-quality:${{ needs.code-quality.result }}" \
            "workflow-hardening:${{ needs.workflow-hardening.result }}" \
            "type-checking:${{ needs.type-checking.result }}" \
            "core-tests:${{ needs.core-tests.result }}" \
            "neuro-symbolic-tests:${{ needs.neuro-symbolic-tests.result }}" \
            "security-scan:${{ needs.security-scan.result }}" \
            "integration-tests:${{ needs.integration-tests.result }}" \
            "performance-benchmark:${{ needs.performance-benchmark.result }}"; do
            result="${upstream#*:}"
            case "$result" in
              success|skipped) : ;;
              *) fail=1 ;;
            esac
          done
          if [[ "$fail" -eq 1 ]]; then
            echo "❌ CI Pipeline Failed"
            echo "  code-quality: ${{ needs.code-quality.result }}"
            echo "  workflow-hardening: ${{ needs.workflow-hardening.result }}"
            echo "  type-checking: ${{ needs.type-checking.result }}"
            echo "  core-tests: ${{ needs.core-tests.result }}"
            echo "  neuro-symbolic-tests: ${{ needs.neuro-symbolic-tests.result }}"
            echo "  security-scan: ${{ needs.security-scan.result }}"
            echo "  integration-tests: ${{ needs.integration-tests.result }}"
            echo "  performance-benchmark: ${{ needs.performance-benchmark.result }} (enforced on pull_request and schedule)"
            exit 1
          fi
          echo "✅ CI Pipeline Passed"
          echo "  code-quality: ${{ needs.code-quality.result }}"
          echo "  workflow-hardening: ${{ needs.workflow-hardening.result }}"
          echo "  type-checking: ${{ needs.type-checking.result }}"
          echo "  core-tests: ${{ needs.core-tests.result }}"
          echo "  neuro-symbolic-tests: ${{ needs.neuro-symbolic-tests.result }}"
          echo "  security-scan: ${{ needs.security-scan.result }}"
          echo "  integration-tests: ${{ needs.integration-tests.result }}"
          echo "  performance-benchmark: ${{ needs.performance-benchmark.result }} (enforced on pull_request and schedule)"
