  # ===========================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [core-tests]

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' 'temurin-.*' 'ghc.*' 'mysql.*' 'postgresql.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        # Integration installs the heaviest extra set in the pipeline
        # (``.[ml,api,dev]`` — the torch-backed engine + API server stack).  It
        # was the only heavy lane without this cache — core-tests / type-checking
        # already use it — so
        # it rebuilt the entire torch/dev tree from scratch every run and was
        # tipping past the 30-minute budget before the test step was reached.
        # The broad ``-pip-`` restore-key warms even a cold first run from any
        # sibling lane's cache, so a new cache key never re-downloads the whole
        # tree.  (The native AMA build is intentionally NOT cached: it is a
        # ~few-minute compile, and setup.py re-runs cmake on install, so a
        # multi-hundred-MB artifact cache would be net-neutral at best while
        # adding a regression surface to every AMA-building lane.)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-integration-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        # ``[ml]`` (torch) is required: the integration suite drives the real
        # ``OmniMercuryEngine`` (and the API it powers), which hard-fails import
        # without PyTorch.  ``[api]`` supplies fastapi/uvicorn; matches the
        # engine-exercising ``core-tests`` lane's ``.[ml,dev,api]``.
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml,api,dev]"
          pip install pytest pytest-asyncio httpx fastapi uvicorn

      - name: Build + install AMA Cryptography (native PQC backend)
        # AMA takes a backseat to none: integration imports the API/package
        # surface (and the PQC gate); build real AMA so the lane runs against
        # the native backend, never the soft stubs.
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      - name: Run integration tests
        # Integration tests are a blocking gate.  For an anomaly detection
        # system that talks to external data sources (NASA, NOAA, DART buoys,
        # financial feeds), integration testing is where production breaks
        # surface.  Tests that depend on live external services should use
        # the @pytest.mark.integration marker and mock external calls.
        # Guard: skip cleanly if the directory doesn't exist yet.
        env:
          # Require the real native AMA backend at import (built above).
          AMA_REQUIRE_REAL_PQC: "true"
        run: |
          if [ -d tests/integration ] && [ -n "$(find tests/integration -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/integration/ -v --timeout=60
          else
            echo "No integration tests found — skipping (tests/integration/ does not exist or is empty)"
          fi

