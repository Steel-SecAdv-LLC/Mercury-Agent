name: CI

on:
  push:
    branches: [ main, devin/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov black flake8 mypy fastapi httpx isort sympy
    
    - name: Install package
      run: |
        pip install -e .
    
    - name: Run isort import sorting check
      run: |
        isort --check-only src/ tests/ benchmarks/ tools/ || true
    
    - name: Run Black formatting check
      run: |
        black --check src/ tests/ benchmarks/ tools/ || true
    
    - name: Run Flake8 lint
      run: |
        flake8 src/ tests/ benchmarks/ tools/ --max-line-length=120 --extend-ignore=E203,W503 || true
    
    - name: Run MyPy type checking
      run: |
        mypy src/omni_anomaly_engine/core/three_r_mechanism.py src/omni_anomaly_engine/core/neurosymbolic_engine.py --ignore-missing-imports || true
    
    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=omni_anomaly_engine --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  ethics-audit:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy torch scikit-learn sympy
    
    - name: Run ethics audit
      run: |
        python benchmarks/run_ethics_audit.py || true
