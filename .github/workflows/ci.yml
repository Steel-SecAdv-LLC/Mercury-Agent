  # ===========================================================================
  # Stage 4.5: Neuro-Symbolic Tests (7-Phase Cognitive Architecture Gate)
  # ===========================================================================
  # This job ALWAYS runs on PRs.  It enforces the 7-phase neuro-symbolic
  # architecture documented in README.md (Neural Memory Layer, Symbolic Logic
  # Layer, Neuro-Symbolic Fusion, Enhanced Anomaly Detection, Autonomous
  # Agent, Ethical Bounding, Cognitive Evolution Engine) plus the safeguards
  # and ethics framework.  These tests are intentionally NOT part of the
  # core-tests path (which stays lightweight) and would otherwise only run
  # in ml-tests, which is gated to main/develop pushes.  Without this gate,
  # the cognitive substrate of the AI can regress silently on feature
  # branches.
  #
  # The status check name "Neuro-Symbolic Tests" is required by the
  # repository's branch ruleset.
  neuro-symbolic-tests:
    name: Neuro-Symbolic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [code-quality]

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' 'temurin-.*' 'ghc.*' 'mysql.*' 'postgresql.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-neurosym-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-neurosym-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          # The cognitive stack exercises torch, sklearn, sympy, NetworkX
          # graph reasoning, and the Three-R mechanism, so [ml] extras are
          # required.  [dev] pulls in pytest plugins.
          pip install -e ".[ml,dev]"
          pip install pytest pytest-cov pytest-asyncio pytest-timeout sympy

      - name: Run neuro-symbolic test suite
        # Phase 1-7 cognitive architecture + safeguards + ethics framework.
        # All paths are blocking - there are no continue-on-error escape
        # hatches here.  If the AI's reasoning, alignment, or kill-switch
        # logic fails, the PR fails.
        #
        # ``tests/ethical/`` is the regression suite for the hard
        # ethics-enforcement decision boundary contract documented in
        # ``src/omni_mercury_engine/ethical/__init__.py`` — Phase 2 of the
        # May 2026 audit cure.  It runs here (not in core-tests) because
        # exercising the boundary requires the full neural fusion stack;
        # routing it through this job means a benevolence-threshold
        # regression (e.g. someone reintroducing a ``strict_ethics``
        # opt-out, or downgrading a raise to a logger.warning) cannot
        # merge silently.
        run: |
          pytest \
            tests/cognitive/ \
            tests/safeguards/ \
            tests/ethical/ \
            tests/test_neurosymbolic_integration.py \
            tests/test_neurosymbolic_enhanced.py \
            tests/test_neurosymbolic_extended.py \
            tests/test_three_r.py \
            tests/test_ai_ethics.py \
            tests/test_ethical_framework.py \
            -v \
            --timeout=300 \
            --cov=src/omni_mercury_engine/cognitive \
            --cov=src/omni_mercury_engine/safeguards \
            --cov=src/omni_mercury_engine/ethical \
            --cov=src/omni_mercury_engine/core \
            --cov=src/omni_mercury_engine/models \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload neuro-symbolic coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: neuro-symbolic
          name: codecov-neurosymbolic
          fail_ci_if_error: false

  # ===========================================================================
  # Stage 5: ML Tests (Heavy Dependencies)
  # ===========================================================================
  ml-tests:
    name: ML Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [core-tests]
    # Re-enabled: ML test imports fixed with conditional torch loading
    # Runs on schedule (weekly), manual trigger, or PRs to main/develop
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_ml_tests == 'true') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'develop'))

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' 'temurin-.*' 'ghc.*' 'mysql.*' 'postgresql.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.PIP_CACHE_DIR }}
            ~/.cache/torch
          key: ${{ runner.os }}-pip-ml-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-ml-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[all,dev]"
          pip install pytest pytest-cov pytest-asyncio pytest-xdist pytest-timeout

      - name: Install build toolchain for AMA Cryptography native library
        # ``ml-tests`` collects everything under ``tests/``, including
        # ``tests/security/test_pqc_gate_real_ama.py`` which imports
        # ``ama_cryptography.pqc_backends`` at module scope and would
        # fail collection if the native library were absent.  We build
        # AMA Cryptography v3.2.0 here using the same procedure as
        # ``.github/workflows/pqc-production-check.yml::verify-real-pqc``
        # so the real-AMA tests run against the same dependency in
        # both lanes — no mock, no skip, no silent stub.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config

      - name: Install AMA Cryptography PEP 517 build-system floors
        # AMA Cryptography v3.2.0's ``setup.py`` runs a preflight check
        # against the supply-chain floors declared in
        # ``pyproject.toml [build-system].requires``:
        #   * setuptools>=78.1.1  — PYSEC-2025-49 + GHSA-cx63-2mw6-8hw5
        #                           + closes Debian 68.x install_layout
        #                           regression on bdist_wheel.
        #   * wheel>=0.47.0       — GHSA-8rrh-rw8j-w5fx.
        #   * cmake>=4.3.2        — Dependabot supply-chain floor.
        # The subsequent ``pip install --no-build-isolation .`` step
        # skips PEP 517 build-env creation (so the wheel-build can
        # link against the libama_cryptography.so we just produced
        # above without re-running CMake into a transient isolation
        # dir), which means these floors must instead be present in
        # the active environment.  Without the PyPI cmake shim,
        # setup.py's ``_check_cmake_version()`` falls through to the
        # system cmake (3.31.6 from apt) and aborts with the FATAL
        # preflight error
        #   ``cmake >= 4.3.2 required (found 3.31.6; reason:
        #     Dependabot supply-chain floor)``.
        # Pinning the floors explicitly here (rather than implicitly
        # via ``cmake>=3.16`` and trusting the resolver to pick a
        # 4.x) documents the supply-chain contract in CI itself.
        # AMA_NO_CYTHON=1 in the install step below short-circuits the
        # Cython / numpy floor checks, so they are intentionally not
        # installed in this step.
        run: |
          python -m pip install --upgrade \
            "setuptools>=78.1.1" \
            "wheel>=0.47.0" \
            "cmake>=4.3.2"

      - name: Build AMA Cryptography native C library
        env:
          AMA_REF: v3.2.0
        run: |
          git clone --branch "${AMA_REF}" --depth 1 \
            https://github.com/Steel-SecAdv-LLC/AMA-Cryptography.git /tmp/ama-cryptography
          cd /tmp/ama-cryptography
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_BUILD_SHARED=ON \
            -DAMA_BUILD_STATIC=ON \
            -DAMA_BUILD_TESTS=OFF \
            -DAMA_BUILD_EXAMPLES=OFF
          cmake --build build -j "$(nproc)"

      - name: Install AMA Cryptography Python package
        run: |
          cd /tmp/ama-cryptography
          AMA_NO_CYTHON=1 pip install --no-build-isolation .
          {
            echo "LD_LIBRARY_PATH=/tmp/ama-cryptography/build/lib:/tmp/ama-cryptography/build:${LD_LIBRARY_PATH:-}"
            echo "AMA_NO_CYTHON=1"
          } >> "$GITHUB_ENV"

      - name: Run full test suite with parallelization
        env:
          TORCH_HOME: ~/.cache/torch
          MERCURY_PQC_REAL_AMA: "1"
        run: |
          # Run tests in parallel with 4 workers, 300s timeout per test
          # Coverage threshold enforced to ensure production readiness
          pytest tests/ \
            -v \
            -n 4 \
            --timeout=300 \
            --cov=src/omni_mercury_engine \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=${{ env.COVERAGE_THRESHOLD_FULL }} \
            --dist=loadgroup

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: ml-tests
          name: codecov-ml
          fail_ci_if_error: false

