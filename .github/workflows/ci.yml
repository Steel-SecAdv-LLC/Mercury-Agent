# Mercury-Agent Comprehensive CI/CD Pipeline
# Implements multi-stage testing, security scanning, and quality checks
# Copyright (C) 2025 Steel Security Advisors LLC

name: CI/CD Pipeline

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_ml_tests:
        description: 'Run ML tests (heavy dependencies)'
        required: false
        default: 'false'
        type: boolean
      run_security_scan:
        description: 'Run full security scan'
        required: false
        default: 'true'
        type: boolean
  schedule:
    # Weekly ML tests on Sunday at midnight UTC
    - cron: '0 0 * * 0'

env:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: ~/.cache/pip
  # ---------------------------------------------------------------------
  # Coverage thresholds.
  #
  # Measured baseline (full suite, 2026-05-17 CI run #1182 on main @
  # a1e189d): 59.84% lines covered on the ML/full lane and 16.62% on
  # the core lane. The previous 10/10 floor was MyPy-era scaffolding;
  # the target quality bar in `pyproject.toml [tool.coverage.report]`
  # is `fail_under = 85`.
  #
  # Floors graduated 2026-07-21 (steel/maint1/2-coverage) after
  # re-measurement on the round's head:
  #   COVERAGE_THRESHOLD_CORE: 33  (core subset; was 30, 25, before that 15)
  #   COVERAGE_THRESHOLD_FULL: 62  (full suite; was 55, before that 50)
  # Measured combined stmt+branch FULL baseline (CI-identical
  # invocation, [all,dev] + native AMA, 12,818 passing tests):
  # 68.95% — up from 68.05% at the round's start after ~660 new
  # behavioral tests across twelve previously weak or untested
  # modules (see docs/MAINT1_2_COVERAGE_REMEDIATION.md §5).  The 62
  # floor keeps the established "~7-point cushion below measured"
  # policy.  CORE re-measured 2026-07-21 (engineering-pass round) after
  # adding tests/biometric/ + tests/quantum_computing/ to the core-lane
  # selection: 40.57% combined stmt+branch (CI-identical invocation,
  # native AMA, 5,487 passing tests; up from 38.30% pre-expansion), so
  # the floor graduates 30 -> 33, holding the same ~7-point cushion (see
  # docs/ENGINEERING_PASS_REMEDIATION.md §6).
  # Do not lower either floor to unblock unrelated work — the floors
  # document a non-regression guarantee, not a preference.
  #
  # The 85-point pyproject target stays in place as the strict
  # aspirational nightly bar.
  # ---------------------------------------------------------------------
  COVERAGE_THRESHOLD_CORE: 33
  COVERAGE_THRESHOLD_FULL: 62

jobs:
  # ===========================================================================
  # Stage 1: Code Quality Checks (Fast)
  # ===========================================================================
  code-quality:
    name: Code Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-quality-

      - name: Install quality tools
        run: |
          python -m pip install --upgrade "pip>=26.1"
          # mypy + pydocstyle are PINNED (mirrored in pyproject [ml]/[dev] and
          # the Type Checking job) so the type-ignore set and the docstring
          # ruleset are identical locally and in CI.  An unpinned mypy flips
          # datasets/mitbih.py:105/109 between "needed" and "unused-ignore"
          # (1.19 vs 2.x); an unpinned pydocstyle could change the enforced
          # google-convention docstring codes out from under a green commit.
          # ruff is PINNED for the same reason (mirrored in pyproject [dev]):
          # the unpinned install picked up 0.16.0 the day it released and
          # turned 237 pre-existing PLR0917 (too-many-positional-arguments)
          # findings into a repo-wide Code Quality red on diffs that touched
          # none of the flagged files. 0.16.0 is now adopted deliberately —
          # PLR0917 joined the curated ignore list next to PLR0913 (the
          # arg-count-ceiling policy) — and future bumps stay deliberate
          # (tree-wide `ruff check` first), never resolver drift.
          # flake8 is PINNED for the same reason again: it was the last
          # floating linter here (pre-commit had 7.0.0, CI resolved latest),
          # the exact drift class the ruff incident demonstrated.  All six
          # lint/format/type pins are cross-checked by
          # scripts/check_pinned_tool_versions.py in Workflow Hardening.
          pip install "black==26.5.1" flake8==7.3.0 mypy==2.3.0 ruff==0.16.0 pydocstyle==6.3.0

      - name: Run Black (formatting)
        run: black --check --diff src/ tests/

      - name: Run Ruff (fast linting)
        # Ruff linting is now blocking - codebase has been cleaned up.
        # ``scripts/`` is in scope: operator tooling lives there and must
        # meet the same linting bar as src/ and tests/.  Per-file
        # acceptances (e.g. S310 for GitHub-API-only urllib usage) are
        # documented in ``pyproject.toml [tool.ruff.lint.per-file-ignores]``.
        # ``tools/`` is also in scope: the CLI primitives in that directory
        # ship as part of Mercury's operator surface and must lint clean.
        run: ruff check src/ tests/ scripts/ tools/ --output-format=github

      - name: Run Flake8 (linting)
        # Flake8 linting is now blocking - codebase has been cleaned up
        # Ignoring E402 (module level import not at top), E501 (line too long, handled by Black)
        # F841 (unused variable) is handled by ruff which respects underscore convention
        run: flake8 src/ tests/ scripts/ tools/ --max-line-length=100 --extend-ignore=E203,W503,E402,E501,F841

      - name: Run canonical header/content check
        run: python scripts/normalize_headers.py --check

      - name: Verify changed-file docstring retention
        shell: bash
        run: |
          git fetch --depth=1 origin 623198811845f9a57b199446c83f2667f3089d58
          python - <<'PY'
          import difflib
          import subprocess
          import sys
          from pathlib import Path

          import scripts.normalize_headers as headers

          base_ref = "623198811845f9a57b199446c83f2667f3089d58"
          targets = (
              "src",
              "tests",
              "scripts",
              "tools",
              "research",
              "benchmarks",
              "examples",
              "assets",
          )
          changed = subprocess.run(
              ["git", "diff", "--name-only", "--diff-filter=ACMRT", base_ref, "--", *targets],
              text=True,
              capture_output=True,
              check=True,
          ).stdout.splitlines()

          errors = []
          for rel in changed:
              if not rel.endswith(".py"):
                  continue
              path = Path(rel)
              if not path.exists():
                  continue
              base = subprocess.run(
                  ["git", "show", f"{base_ref}:{rel}"],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if base.returncode != 0:
                  continue
              base_docstring = headers.module_docstring(path, base.stdout)
              current_docstring = headers.module_docstring(path, path.read_text(encoding="utf-8"))
              base_compact = headers.squashed(base_docstring)
              current_compact = headers.squashed(current_docstring)
              # Retention floor rather than a strict no-shrink rule: legitimate
              # tightening/clarifying/error-fixing routinely reduces length while
              # improving the docstring, and a monotone char-count gate blocks all
              # of it. Only fail when a docstring is GUTTED -- removed entirely, or
              # reduced below RETENTION_FLOOR of the base compacted length -- which
              # still catches accidental deletion without penalising transparent edits.
              # (A base with no meaningful docstring imposes no floor.)
              retention_floor = 0.60
              if not base_compact:
                  continue
              if current_compact and len(current_compact) >= retention_floor * len(base_compact):
                  continue
              diff = "".join(
                  difflib.unified_diff(
                      [f"{line}\n" for line in base_docstring.splitlines()],
                      [f"{line}\n" for line in current_docstring.splitlines()],
                      fromfile=f"{rel} ({base_ref} license-stripped docstring)",
                      tofile=f"{rel} (current docstring)",
                  )
              )
              errors.append(
                  f"{rel}: module docstring was gutted vs the license-stripped "
                  f"{base_ref} description -- retained {len(current_compact)} of "
                  f"{len(base_compact)} chars, below the {retention_floor:.0%} floor\n{diff}"
              )

          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print("Changed-file module docstrings retain license-stripped base length.")
          PY

      - name: Prove canonical header/content gate rejects malformed file
        shell: bash
        run: |
          tmp_file="$(mktemp /tmp/mercury-bad-header.XXXXXX.py)"
          printf '# Copyright (C) 2025 Steel Security Advisors LLC\n"""any later version."""\n' > "${tmp_file}"
          if python scripts/normalize_headers.py --check "${tmp_file}"; then
            echo "ERROR: canonical header/content gate accepted malformed fixture"
            exit 1
          fi

      - name: Verify Mercury math-arrest pathway
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path("src/omni_mercury_engine/detectors/math_arrest")
          offenders = []
          for path in root.rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and (node.module or "").startswith("sklearn"):
                      offenders.append(str(path))
                  elif isinstance(node, ast.Import):
                      if any(alias.name.startswith("sklearn") for alias in node.names):
                          offenders.append(str(path))

          arrest_tree = ast.parse((root / "arrest.py").read_text(encoding="utf-8"))
          probe_count = 0
          for node in ast.walk(arrest_tree):
              if isinstance(node, ast.Assign):
                  if any(isinstance(target, ast.Name) and target.id == "_PROBE_REGISTRY" for target in node.targets):
                      if isinstance(node.value, ast.Dict):
                          probe_count = len(node.value.keys)
              elif isinstance(node, ast.AnnAssign):
                  if isinstance(node.target, ast.Name) and node.target.id == "_PROBE_REGISTRY":
                      if isinstance(node.value, ast.Dict):
                          probe_count = len(node.value.keys)

          if offenders:
              raise SystemExit("ERROR: non-Mercury detector import in math_arrest: " + ", ".join(sorted(set(offenders))))
          if probe_count < 20:
              raise SystemExit(f"ERROR: Mercury math-arrest probe registry unexpectedly small: {probe_count}")
          PY

      - name: Neural-submodule coverage gate (WS-E/F, dep-free)
        # docs/NEURAL_SUBMODULE_COVERAGE.md is generated from the registry in
        # scripts/neural_coverage.py. Fails if the doc is out of sync or if any
        # referenced module / test file / committed artifact is missing, so the
        # coverage table cannot silently rot. Regenerate: --update.
        run: |
          python scripts/neural_coverage.py --check

      - name: Run pydocstyle (docstring checks)
        # Blocking — the docstring contract is part of the source-of-truth API
        # surface and we do not allow it to drift silently.
        run: |
          pydocstyle src/omni_mercury_engine/ --convention=google

  # ===========================================================================
  # Stage 1.5: Workflow and Suppression Hygiene
  # ===========================================================================
  workflow-hardening:
    name: Workflow Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: Install workflow security linters
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install "zizmor==1.24.1"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install package for λ drift gate import
        # The Lyapunov λ drift gate
        # (scripts/check_readme_lyapunov.py) IMPORTS the canonical
        # constants from the package — by design, so that the
        # documentation gate cannot disagree with the runtime value.
        # We install the package (and its runtime deps, notably numpy
        # which double_helix_engine.py imports at module load) here so
        # the gate has both LAMBDA_CONVERGENCE and LAMBDA_DECAY in
        # scope.  An editable install is fine for the workflow-hardening
        # lane; it does not need [ml]/[api] extras.
        run: pip install -e .

      - name: Build + install AMA Cryptography (native PQC backend)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      - name: Run actionlint
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            -ignore 'SC2086' \
            -ignore 'SC2129' \
            -color

      - name: Run zizmor high-signal audits
        # Advisory for now: this surfaces unpinned-action and permission
        # findings without blocking every PR before the repository-wide SHA
        # pinning migration lands. Blocking workflow invariants are enforced
        # by scripts/check_workflow_hardening.py in the next step.
        run: zizmor --no-progress --format=plain --min-severity high --no-exit-codes .github/workflows

      - name: Run repository workflow hardening checks
        run: python scripts/check_workflow_hardening.py

      - name: Run suppression hygiene checks
        run: python scripts/check_suppression_hygiene.py

      - name: Run torch.load safety gate
        # Security breaker: forbids any raw torch.load( in src/ outside the
        # sanctioned safe_torch_load wrapper, which hard-pins weights_only=True.
        # A raw torch.load with the pre-2.6 default runs the full pickle VM and
        # executes arbitrary code embedded in a checkpoint (RCE). Static
        # tokenize scan -- no ML deps, runs on every PR at the hardening stage
        # alongside the other security gates.
        run: python scripts/check_torch_load_safety.py

      - name: Run pinned dev-tool version parity gate
        # Dependency-free structural gate: black/mypy/types-requests/
        # pydocstyle/ruff/flake8 are pinned *exactly* for byte-identical
        # behaviour local<->CI.  Each tool is pinned in a subset of
        # pyproject.toml, this file, format.yml and .pre-commit-config.yaml
        # (black in all four; the others fewer), and the gate cross-checks
        # each wherever it is pinned.  Dependabot's pip ecosystem only
        # rewrites pyproject.toml and cannot reach the inline
        # ``pip install black==X`` strings here, so without this gate a bump
        # silently diverges the surfaces (ruff and flake8 joined the registry
        # after exactly that: pre-commit ran ruff 0.15.15 against CI's
        # 0.16.0, and flake8 floated in CI against pre-commit's 7.0.0).
        # Co-located with the other hygiene gates so a pin-drift regression
        # is caught at the same stage as a workflow-permissions one.
        run: python scripts/check_pinned_tool_versions.py

      - name: Run Lyapunov λ documentation drift gate
        # Import-based λ drift gate: imports
        # LyapunovConstants.LAMBDA_CONVERGENCE and
        # double_helix_engine.LAMBDA_DECAY from the package and
        # asserts every documented numeric in README.md and
        # docs/MATH_SPEC.md matches.  Each check carries its own
        # ``min_occurrences`` floor so silently deleting every
        # documented mention cannot achieve a vacuous-green pass.
        # Co-located with the suppression/workflow hygiene gates so a
        # docs-drift regression is caught at the same stage as a
        # workflow-permissions regression.
        env:
          AMA_REQUIRE_REAL_PQC: "true"
        run: python scripts/check_readme_lyapunov.py

      - name: Run codebase-scale documentation drift gate
        # Measures src files / LOC / true subpackages / detector & loader
        # classes / test files / workflows from disk and asserts the
        # README "Codebase Scale" block (between the SCALE:START/END
        # markers) matches.  Dependency-free, so it runs in the same
        # minimal code-quality job as the other docs-drift gates.  If
        # this fails, run `python scripts/measure_codebase_scale.py
        # --update README.md` and commit the regenerated block.
        run: python scripts/measure_codebase_scale.py --check README.md

      - name: Run benchmark-integrity gate (ROADMAP row 17 offline fallback)
        # Dependency-free, no-network structural + recomputation gate over
        # benchmarks/mercury_benchmark_results.json and the README benchmark
        # block: total == successful + failed, the per-dataset error count
        # matches `failed`, the headline mean/median AUC + oracle-F1
        # RECOMPUTE from the genuine-labelled per_dataset rows (not just
        # restate the summary), and the README block matches the JSON.  This
        # is the offline CI-gated fallback for the deferred, network-blocked
        # live benchmark refresh (docs/ROADMAP.md row 17): while the fuller
        # refresh of the 9 failed corpora is deferred, the committed headline
        # cannot silently rot or be fabricated.  Fix a real drift with
        # `python scripts/update_readme_benchmarks.py`; do not loosen the gate.
        run: python scripts/check_benchmark_integrity.py

  # ===========================================================================
  # Stage 2: Type Checking
  # ===========================================================================
  type-checking:
    name: Type Checking (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The native AMA Cryptography (PQC) build below is the variable cost here —
    # the same build core-tests budgets 30 min for. mypy itself is fast, but on
    # a slow GitHub-hosted runner the build+mypy can exceed a tight cap and
    # cancel a leg whose type-check has already passed (observed: one leg hit
    # the old 15-min cap seconds after "Success: no issues found"). 25 min gives
    # that build headroom; it masks nothing — a genuine hang still times out and
    # a real type error still fails immediately.
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-types-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-types-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          # [ml] needed for torch type stubs used by mypy.
          # pytest (and its plugins) installed explicitly so mypy can
          # consume pytest's bundled ``py.typed`` stubs when checking
          # tests/.  Without pytest on sys.path the strict lane below
          # cannot see fixture/mark decorator signatures and flags every
          # ``@pytest.fixture`` / ``@pytest.mark.parametrize`` as
          # ``[untyped-decorator]`` even though the stubs are correct.
          pip install -e ".[ml]"
          # mypy + types-requests are PINNED (mirrored in pyproject [ml]/[dev]
          # and the Code Quality job) so the ``# type: ignore[...]`` set is
          # byte-identical locally and in CI.  Without the pin a newer
          # mypy/types-requests marks datasets/mitbih.py:105/109 as
          # ``unused-ignore`` in one place while the other still needs them.
          # hypothesis mirrors the pytest rationale above: the strict test
          # lane checks tests/ethical/, whose property/fuzz suite decorates
          # tests with ``@given`` / ``@settings``.  hypothesis ships
          # ``py.typed``, so installing it lets mypy resolve the decorator
          # signatures; without it the [[tool.mypy.overrides]] boundary turns
          # them into ``Any`` and the strict lane flags [untyped-decorator].
          pip install mypy==2.3.0 types-requests==2.33.0.20260712 \
            "pytest>=9.0.3" pytest-asyncio pytest-mock "hypothesis>=6.0.0"

      - name: Build + install AMA Cryptography (native PQC backend)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      - name: Run MyPy
        # MyPy reads strict config from pyproject.toml automatically.
        # Boundaries for un-stubbed third-party libraries are declared
        # per-module in pyproject.toml under [[tool.mypy.overrides]];
        # the global --ignore-missing-imports flag was removed so any new
        # un-declared import surfaces as a hard error instead of being
        # silently silenced.
        run: |
          mypy src/omni_mercury_engine/ \
            --show-error-codes \
            --pretty

      - name: Run MyPy on critical tests
        # Incremental test typing: gated on the **entire** ``tests/``
        # tree.  ``--ignore-missing-imports`` is **not** present --
        # third-party boundaries are declared in pyproject.toml
        # [[tool.mypy.overrides]], so any new un-declared import in
        # test code fails the gate instead of being silenced.
        #
        # The two remaining relaxations are:
        #
        # * ``--allow-untyped-defs`` / ``--allow-untyped-calls`` -- a
        #   test function with no parameter annotations at all is
        #   accepted, matching the historical pytest idiom.  Parameter
        #   annotations are tracked at the source (``: Any`` is the
        #   stopgap), so partial annotation is still a hard error --
        #   ``--allow-incomplete-defs`` is **not** present.
        # * ``--disable-error-code untyped-decorator`` -- pytest's
        #   ``@pytest.fixture`` / ``@parametrize`` decorators return
        #   ``Any`` from the public stubs, which would otherwise flag
        #   every decorated test as ``[untyped-decorator]``.
        #
        # ``--allow-subclassing-any`` matches the global pyproject
        # setting and lets test mocks subclass ``torch.nn.Module``,
        # ``pydantic.BaseModel``, etc.  ``[misc]`` errors from
        # deliberately writing to read-only properties are pinned with
        # per-line ``# type: ignore[misc]`` so the suppression is
        # visible at the source rather than at the gate.
        run: |
          mypy tests/ \
            --allow-untyped-defs \
            --allow-untyped-calls \
            --allow-subclassing-any \
            --disable-error-code untyped-decorator \
            --show-error-codes \
            --pretty \
            --no-warn-unused-configs

      - name: Run MyPy strict on graduated test directories (no test-debt disables)
        # ---- v1.7.0: incremental test-debt removal ----
        # Newly-authored or refactored test directories opt into the
        # strict mypy gate (no ``--allow-untyped-defs``, no
        # ``--allow-subclassing-any``, no decorator disable) once
        # they are clean.  Every test file under the directories
        # listed below is fully annotated (verified by the run below)
        # so the historical test-debt relaxations no longer apply
        # there.
        #
        # The mechanism is intentionally additive: directories that
        # are not yet clean stay on the relaxed lane above, and
        # individual directories graduate to the strict lane one
        # commit at a time.  When a directory graduates, add it to
        # the list below.  See the strengthening plan §5 P0
        # ("Re-lift the test-debt mypy disables") for the long-term
        # goal of emptying the relaxed lane.
        #
        # Graduated (strict, no test-debt disables):
        # * tests/datasets/      -- v1.7.0
        # * tests/ethical/       -- v1.7.0 follow-up
        # * tests/safeguards/    -- v1.7.0 follow-up
        # * tests/tools/         -- operator-tooling hardening PR (#239)
        #                            + ISO hardening Lyapunov validator (#238)
        # * tests/loaders/       -- ISO hardening (already clean) (#238)
        # * tests/narrative/     -- ISO hardening (already clean) (#238)
        # * tests/fairness/      -- intersectional fairness metrics
        #                            (ROADMAP row 6 closure; authored clean)
        # * tests/scripts/       -- engineering-pass graduation (this round)
        # * tests/cyber/         -- engineering-pass graduation (this round)
        # * tests/decision/      -- engineering-pass graduation (this round)
        # * tests/distributed/   -- engineering-pass graduation (this round)
        # * tests/emergent/      -- engineering-pass graduation (this round)
        # * tests/evaluation/    -- engineering-pass graduation (this round)
        # * tests/federated/     -- engineering-pass graduation (this round)
        # * tests/medical/       -- engineering-pass graduation (this round)
        # * tests/metrics/       -- engineering-pass graduation (this round)
        # * tests/proofs/        -- engineering-pass graduation (this round)
        # * tests/reasoning/     -- engineering-pass graduation (this round)
        # * tests/research/      -- engineering-pass graduation (this round)
        # * tests/truth_decipher/ -- engineering-pass graduation (this round)
        # * tests/utils/         -- engineering-pass graduation (this round)
        #
        # This round's engineering pass graduated the 14 test directories
        # that were ALREADY fully annotated (measured 0 strict errors each;
        # 131 files clean in the combined invocation).  The ordered
        # dir-by-dir plan for the remaining relaxed-lane debt (automl 2 ...
        # detectors 51) and the exact per-dir error counts live in
        # docs/MYPY_TEST_STRICT_MIGRATION.md.  When a directory graduates,
        # add it here and strike it from that plan in the same commit.
        run: |
          mypy tests/datasets/ tests/ethical/ tests/safeguards/ tests/tools/ \
            tests/loaders/ tests/narrative/ tests/fairness/ tests/scripts/ \
            tests/cyber/ tests/decision/ tests/distributed/ tests/emergent/ \
            tests/evaluation/ tests/federated/ tests/medical/ tests/metrics/ \
            tests/proofs/ tests/reasoning/ tests/research/ tests/truth_decipher/ \
            tests/utils/ \
            --disallow-subclassing-any \
            --show-error-codes \
            --pretty \
            --no-warn-unused-configs

      - name: Run MyPy on shipped-artifact scripts
        # ---- scripts/ blind-spot closure (PR #344 review) ----
        # The src/ and tests/ lanes never covered scripts/, so type
        # errors in the build-time pipeline scripts that REGENERATE
        # shipped artifacts (σ_Immutable baseline + weights + corpus,
        # the SW-eng metrics overlay, the weapons-gate calibration)
        # went uncaught.  This lane pins those scripts under the same
        # strict pyproject config as src/.
        #
        # Intentionally additive, mirroring the graduated-test-dirs
        # mechanism above.  2026-07-21: the remaining scripts/ debt (42
        # errors across 9 files, counted 2026-07-20 after the four
        # original lane files were cleaned) is CLEARED — all nine files
        # were cleaned with real typing fixes (no blanket ignores) and
        # graduate below, together with the new sigma mutation-gate
        # harness (authored clean).  Every file in scripts/ is now on
        # the gate; a new script must be added here when created.
        run: |
          mypy scripts/harvest_sigma_baseline.py \
            scripts/train_sigma_immutable.py \
            scripts/collect_sw_eng_metrics.py \
            scripts/fit_weapons_gate_calibration.py \
            scripts/train_gosnn_fusion.py \
            scripts/sweep_fusion_capacity.py \
            scripts/generate_docs_images.py \
            scripts/generate_calibration_visuals.py \
            scripts/measure_codebase_scale.py \
            scripts/update_readme_benchmarks.py \
            scripts/run_api.py \
            scripts/normalize_headers.py \
            scripts/generate_anomaly_panel.py \
            scripts/run_sigma_mutation_gate.py \
            scripts/check_benchmark_integrity.py \
            scripts/check_torch_load_safety.py \
            scripts/ci_gate_watchdog.py \
            --show-error-codes \
            --pretty

      - name: Pin numpy to the declared floor (regression guard)
        # The steps above type-check against whatever numpy ``pip`` resolves
        # (currently 2.4.6).  pyproject declares ``numpy>=2.4.0`` as the
        # supported minimum, so the strict mypy contract must also hold at
        # that floor -- numpy's ``ndarray`` typing changed across minor
        # releases (2.3.5 still emits ``disallow_any_generics``/``assignment``
        # errors that 2.4.0 fixes).  Pinning the exact floor and re-running the
        # gate below stops the declared minimum from silently drifting away
        # from what actually type-checks.
        run: pip install "numpy==2.4.0"

      - name: Run MyPy at the numpy floor (src + tests)
        run: |
          mypy src/omni_mercury_engine/ \
            --show-error-codes \
            --pretty
          mypy tests/ \
            --allow-untyped-defs \
            --allow-untyped-calls \
            --allow-subclassing-any \
            --disable-error-code untyped-decorator \
            --show-error-codes \
            --pretty \
            --no-warn-unused-configs
          mypy tests/datasets/ tests/ethical/ tests/safeguards/ tests/tools/ \
            tests/loaders/ tests/narrative/ \
            --disallow-subclassing-any \
            --show-error-codes \
            --pretty \
            --no-warn-unused-configs
          mypy scripts/harvest_sigma_baseline.py \
            scripts/train_sigma_immutable.py \
            scripts/collect_sw_eng_metrics.py \
            scripts/fit_weapons_gate_calibration.py \
            --show-error-codes \
            --pretty

  # ===========================================================================
  # Stage 3: Security Scanning
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.run_security_scan != 'false'

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        # Pin upgrade target liberally — if the runner already ships a
        # newer pip, ``--upgrade`` is a no-op.  Failure here means a
        # genuine network / index issue and should fail the job.
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Build + install AMA Cryptography (native PQC backend)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      - name: Install bandit / safety / pip-audit (audit-tool layer)
        # Audit tools live in the *runner's* default Python and are
        # never installed into Mercury's environment.  This keeps
        # the audit-tool transitives (``nltk``, ``joblib``, etc.)
        # OUT of the scanned surface — they belong to the auditor,
        # not to Mercury.  Removing them from the audit scope is
        # the architectural remediation for the historical
        # ``--ignore-vuln`` posture (tracked under the 2026-05-20
        # security entries in ``CHANGELOG.md`` — "Permanent supply-
        # chain remediations"): Mercury does not ship those packages,
        # so they must not appear in Mercury's vulnerability report
        # regardless of advisory state.
        #
        # ``click>=8.2`` is re-pinned at the **runner** level (not
        # just inside the Mercury audit venv): the ``safety`` CLI
        # bundles ``typer>=0.20``, whose ``_types.py`` uses
        # ``click.Choice[ParamTypeValue]`` (PEP 695 generic
        # subscripting added in click 8.2).  Without the re-pin the
        # GHA hosted Python 3.12 image ships a click version that
        # raises ``TypeError: type 'Choice' is not subscriptable``
        # the moment ``safety`` imports ``typer``, breaking the
        # Safety dep-CVE gate before any vulnerability check runs.
        run: pip install bandit safety pip-audit "click>=8.2"

      - name: Install Semgrep (isolated venv)
        # Semgrep is heavier (~76MB manylinux wheel including
        # ``semgrep-core``).  Blocking — if it cannot be installed,
        # the security gate would be silently weaker, so we fail
        # explicitly rather than ``|| true``.  Using a separate step
        # keeps the failure mode self-evident in the GHA UI.
        #
        # Semgrep pins ``click~=8.1.8`` (i.e. ``<8.2``), which is
        # incompatible with ``safety``'s bundled ``typer>=0.20``
        # that requires ``click>=8.2`` for PEP 695 ``click.Choice[...]``
        # subscripting.  Installing semgrep into the runner's default
        # Python would silently downgrade click and crash safety on
        # import.  Installing semgrep into its own venv lets each
        # tool keep the click version it actually needs.  Verified
        # locally against semgrep ``Requires-Dist: click~=8.1.8`` and
        # safety 3.7.0 ``Requires-Dist: click>=8.0.2`` + typer 0.25.1.
        run: |
          python -m venv /tmp/semgrep-env
          /tmp/semgrep-env/bin/pip install --upgrade "pip>=26.1"
          /tmp/semgrep-env/bin/pip install semgrep
          # Expose semgrep on PATH for the scan step below without
          # contaminating the runner's site-packages.
          ln -sf /tmp/semgrep-env/bin/semgrep /usr/local/bin/semgrep

      - name: Create isolated Mercury install (audit target)
        # Install Mercury into a dedicated venv so the dependency
        # audits below see ONLY Mercury's declared deps + their
        # transitives — NOT the transitives of the audit tools
        # themselves.  This is the architectural fix that lets us
        # delete every previous ``--ignore-vuln`` flag: nltk and
        # joblib appear in safety/bandit/pip-audit's own dependency
        # graph but not in Mercury's, so isolation removes them
        # from the audit surface entirely.  The frozen requirements
        # list is emitted to a Job-Summary group so reviewers can
        # see exactly what surface was audited.
        #
        # ``click>=8.2`` + ``typer>=0.20`` re-pin: the GHA hosted
        # Python ships an older ``typer`` whose ``__types.py`` uses
        # ``click.Choice[ParamTypeValue]`` (PEP 695 generic
        # subscripting added in click 8.2); without the re-pin the
        # ``pip install -e ".[api]"`` resolver downgrades click and
        # breaks typer's import.  Diagnosed on PR #148 (commits
        # 6cc4bbd / 1952eb7 / 63ae1dc); fixed in commit ae7ad84.
        run: |
          python -m venv /tmp/mercury-audit-env
          /tmp/mercury-audit-env/bin/pip install --upgrade "pip>=26.1"
          /tmp/mercury-audit-env/bin/pip install -e ".[api]" \
            --upgrade "click>=8.2" "typer>=0.20"
          /tmp/mercury-audit-env/bin/pip install --upgrade \
            "setuptools>=78.1.1" "wheel>=0.47.0" "cmake>=4.3.2"
          AMA_NO_CYTHON=1 /tmp/mercury-audit-env/bin/pip install --no-build-isolation /tmp/ama-cryptography
          /tmp/mercury-audit-env/bin/pip list --format=freeze \
            > /tmp/mercury-audit-env/requirements.txt
          {
            echo "## Audit-target environment (Mercury install only)"
            echo
            echo '```'
            cat /tmp/mercury-audit-env/requirements.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Run Bandit (security linter)
        # Bandit security scan is blocking - fails on medium+ severity issues.
        run: |
          bandit -r src/omni_mercury_engine/ \
            -c pyproject.toml \
            -f json \
            -o bandit-report.json \
            --severity-level medium

      - name: Run Safety (dependency vulnerabilities — BLOCKING)
        # Hard-blocking dep-CVE gate, scoped to the isolated Mercury
        # install via ``-r``.  The audit-tool venv is intentionally
        # NOT scanned — auditor-internal packages are not Mercury's
        # supply chain.
        #
        # ``--policy-file .safety-policy-v2.yml`` is required to
        # override Safety's auto-discovery of ``.safety-policy.yml``
        # (which is in v3 format and rejected by ``check``'s legacy
        # parser).  The v2 file is a no-op shim — per-CVE risk
        # acceptance via ``--ignore`` is intentionally NOT used: any
        # new finding in Mercury's own surface fails the gate.
        run: |
          set +e
          safety check \
            -r /tmp/mercury-audit-env/requirements.txt \
            --policy-file .safety-policy-v2.yml \
            --output json > safety-report.json
          rc=$?
          # On any non-zero exit, surface each finding as a GHA
          # ::error:: annotation (visible in the Checks tab UI without
          # log access) and as a Job Summary table.
          jq -r '.vulnerabilities[]? | "::error title=Safety dep CVE::\(.package_name) \(.analyzed_version) — vuln-id \(.vulnerability_id) (\(.CVE // "no-cve"))"' safety-report.json 2>/dev/null \
            | sort -u || true
          {
            echo "## Safety report (exit=$rc)"
            echo
            echo '```'
            jq -r '.vulnerabilities[]? | "\(.package_name) \(.analyzed_version) — \(.vulnerability_id) (\(.CVE // "no-cve"))"' safety-report.json 2>/dev/null \
              | sort -u || true
            echo '```'
            echo
            echo "Total vulns: $(jq '(.vulnerabilities // []) | length' safety-report.json 2>/dev/null || echo '?')"
            echo "Packages scanned: $(jq '.report_meta.packages_found // "?"' safety-report.json 2>/dev/null)"
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$rc"

      - name: Run pip-audit (PyPI/OSV advisories — BLOCKING)
        # Hard-blocking, parity with Safety above.  ``--path`` scopes
        # pip-audit to Mercury's isolated install; the runner-level
        # audit-tool transitives are excluded by construction.  No
        # ``--ignore-vuln`` entries: any finding in Mercury's own
        # supply chain fails the gate.
        run: |
          pip-audit \
            --path /tmp/mercury-audit-env/lib/python${{ env.PYTHON_VERSION }}/site-packages \
            --skip-editable \
            --format json --output pip-audit-report.json

      - name: Run Semgrep (SAST — BLOCKING)
        # Semgrep static-analysis security scan.  Blocking on
        # findings.  If semgrep is somehow unavailable on the runner,
        # fail explicitly rather than silently passing the gate —
        # missing tools must not look the same as a clean scan.
        run: |
          if ! command -v semgrep &> /dev/null; then
            echo "Semgrep is not installed — failing rather than silently skipping."
            exit 1
          fi
          semgrep scan \
            --config "p/python" \
            --config "p/security-audit" \
            --json \
            --output semgrep-report.json \
            src/

      - name: Upload security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
            semgrep-report.json
          retention-days: 30

  # ===========================================================================
  # Stage 4: Core Tests (Lightweight)
  # ===========================================================================
  core-tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [code-quality]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-core-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-core-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          # [ml] provides torch/sklearn (moved out of core deps to keep
          # `pip install mercury-agent` lightweight).  Core tests exercise
          # engine, fusion, and detector code that needs the ML stack.
          # [api] supplies python-multipart + fastapi/uvicorn so the
          # API-surface tests added to the expanded core lane (see
          # ``Run core tests`` below) collect cleanly.
          pip install -e ".[ml,dev,api]"
          pip install pytest pytest-cov pytest-asyncio sympy

      - name: Build + install AMA Cryptography (native PQC backend)
        # AMA takes a backseat to none: every test lane now runs against the
        # real native AMA backend; non-native PQC execution is not a CI mode.
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      - name: Run core tests with coverage
        env:
          # Declare the [ml] contract to ``tests/conftest.py``'s
          # ``pytest_sessionstart`` gate.  This lane installs the
          # ``[ml,dev,api]`` extras above; the gate verifies torch is
          # actually importable before any collection runs and aborts
          # the session with a single loud error if not — replacing
          # the historical ~30 class-level ``skipif(not _HAS_TORCH)``
          # decorators that would have silently turned red tests into
          # green skips.
          MERCURY_REQUIRES_ML: "1"
          # Require the real native AMA backend at package import (the build
          # step above provisions it). Fails the lane closed if AMA cannot
          # load.
          AMA_REQUIRE_REAL_PQC: "true"
        run: |
          # Core-lane test selection, expanded in v1.7.x for the
          # COVERAGE_THRESHOLD_CORE 15 -> 25 graduation (raised again to
          # 30 on the 2026-07-18 re-measurement: 37.94% on this
          # selection).  Measured combined stmt+branch coverage on this
          # selection (without tests/security/) is well above the floor.
          #
          # tests/security/ stays OUT of this lane even though AMA is now
          # built here: its heavy KAT suite (NIST ACVP byte-exact vectors)
          # would run three times across the core python matrix for no added
          # signal. tests/security/ is covered once in ml-tests and again in
          # the dedicated always-on ``PQC Production Readiness`` gate. The
          # AMA build above still ensures THIS lane's package imports resolve
          # to the real backend (AMA_REQUIRE_REAL_PQC=true), not soft stubs.
          #
          # When adding a directory below, prefer the directory form
          # (e.g. ``tests/ml/``) over listing individual files so the
          # lane picks up new tests automatically.  Files that depend
          # on packages NOT in the ``[ml,dev,api]`` install set above
          # must NOT be added here.
          pytest tests/test_cli.py tests/core/ \
            tests/test_federation.py \
            tests/test_cap_alerting.py \
            tests/test_streaming_detector.py \
            tests/test_domain_loaders.py \
            tests/test_domain_benchmarks.py \
            tests/detectors/ \
            tests/ml/ \
            tests/datasets/ \
            tests/api/ \
            tests/automl/ \
            tests/fairness/ \
            tests/tools/ \
            tests/biometric/ \
            tests/quantum_computing/ \
            tests/scripts/test_run_ablation.py \
            tests/scripts/test_check_readme_lyapunov.py \
            tests/scripts/test_run_hardware_benchmark.py \
            tests/test_adaptive_detector.py \
            tests/test_acceleration_dynamics.py \
            tests/test_advanced_ml_capabilities.py \
            tests/test_disaster_precursor.py \
            tests/test_spectral_vibration.py \
            tests/test_uiux_anomaly.py \
            tests/test_detectors.py \
            tests/test_anomaly_metrics.py \
            tests/test_three_r.py \
            tests/test_data_sources.py \
            tests/test_calibration_wiring.py \
            tests/test_api.py \
            tests/test_session3_enhancements.py \
            -v \
            --cov=src/omni_mercury_engine \
            --cov-report=xml \
            --cov-report=term-missing \
