# Mercury-Agent Comprehensive CI/CD Pipeline
# Implements multi-stage testing, security scanning, and quality checks
# Copyright (C) 2025 Steel Security Advisors LLC

name: CI/CD Pipeline

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_ml_tests:
        description: 'Run ML tests (heavy dependencies)'
        required: false
        default: 'false'
        type: boolean
      run_security_scan:
        description: 'Run full security scan'
        required: false
        default: 'true'
        type: boolean
  schedule:
    # Weekly ML tests on Sunday at midnight UTC
    - cron: '0 0 * * 0'

env:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: ~/.cache/pip
  # ---------------------------------------------------------------------
  # Coverage thresholds.
  #
  # Measured baseline (full suite, 2026-05-17 CI run #1182 on main @
  # a1e189d): 59.84% lines covered on the ML/full lane and 16.62% on
  # the core lane. The previous 10/10 floor was MyPy-era scaffolding;
  # the target quality bar in `pyproject.toml [tool.coverage.report]`
  # is `fail_under = 85`.
  #
  # v1.7.x floors (strengthening plan §5):
  #   COVERAGE_THRESHOLD_CORE: 25  (core subset, was 15)
  #   COVERAGE_THRESHOLD_FULL: 50  (full suite)
  # FULL = 50 is "do not regress more than ~10 points below the measured
  # 59.84% baseline" — a deliberate cushion for CI noise / dataset
  # availability flakes.  CORE graduated from 15 to 25 once the core
  # lane was expanded to include the high-LOC modules (detectors/, ml/,
  # datasets/, api/, automl/, security/ plus a curated set of root-level
  # `test_*.py` files) — measured baseline on the expanded lane is
  # 31.87% combined stmt+branch coverage, giving ~7 points of cushion
  # above the floor.  Do not lower either floor back toward 10/15 to
  # unblock unrelated work — the floors document a non-regression
  # guarantee, not a preference.
  #
  # The 85-point pyproject target stays in place as the strict
  # aspirational nightly bar.
  # ---------------------------------------------------------------------
  COVERAGE_THRESHOLD_CORE: 25
  COVERAGE_THRESHOLD_FULL: 50

jobs:
  # ===========================================================================
  # Stage 1: Code Quality Checks (Fast)
  # ===========================================================================
  code-quality:
    name: Code Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-quality-

      - name: Install quality tools
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install "black>=26.3.1,<27.0.0" flake8 mypy ruff pydocstyle

      - name: Run Black (formatting)
        run: black --check --diff src/ tests/

      - name: Run Ruff (fast linting)
        # Ruff linting is now blocking - codebase has been cleaned up
        run: ruff check src/ tests/ --output-format=github

      - name: Run Flake8 (linting)
        # Flake8 linting is now blocking - codebase has been cleaned up
        # Ignoring E402 (module level import not at top), E501 (line too long, handled by Black)
        # F841 (unused variable) is handled by ruff which respects underscore convention
        run: flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503,E402,E501,F841

      - name: Verify IsolationForest removed from detection path
        run: |
          if grep -rn "from sklearn.ensemble import IsolationForest" \
              src/omni_mercury_engine/detectors/math_arrest/; then
            echo "ERROR: IsolationForest still present in math_arrest"
            exit 1
          fi

      - name: Run pydocstyle (docstring checks)
        # Blocking — the docstring contract is part of the source-of-truth API
        # surface and we do not allow it to drift silently.  ``[tool.pydocstyle]``
        # in ``pyproject.toml`` configures the Google convention plus the
        # project's whitelisted exclusions; we re-pass the exclusions on the
        # command line so behaviour is identical regardless of whether the
        # tool is run under tomli-aware (3.11+) or non-aware shells.
        run: |
          pydocstyle src/omni_mercury_engine/ \
            --convention=google \
            --add-ignore=D100,D104,D105,D107,D212,D415

  # ===========================================================================
  # Stage 1.5: Workflow and Suppression Hygiene
  # ===========================================================================
  workflow-hardening:
    name: Workflow Hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go for actionlint
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Install workflow security linters
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install "zizmor==1.24.1"
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Run actionlint
        run: |
          "$(go env GOPATH)/bin/actionlint" \
            -ignore 'SC2086' \
            -ignore 'SC2129' \
            -color

      - name: Run zizmor high-signal audits
        # Advisory for now: this surfaces unpinned-action and permission
        # findings without blocking every PR before the repository-wide SHA
        # pinning migration lands. Blocking workflow invariants are enforced
        # by scripts/check_workflow_hardening.py in the next step.
        run: zizmor --no-progress --format=plain --min-severity high --no-exit-codes .github/workflows

      - name: Run repository workflow hardening checks
        run: python scripts/check_workflow_hardening.py

      - name: Run suppression hygiene checks
        run: python scripts/check_suppression_hygiene.py

  # ===========================================================================
  # Stage 2: Type Checking
  # ===========================================================================
  type-checking:
    name: Type Checking (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-types-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-types-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          # [ml] needed for torch type stubs used by mypy.
          # pytest (and its plugins) installed explicitly so mypy can
          # consume pytest's bundled ``py.typed`` stubs when checking
          # tests/.  Without pytest on sys.path the strict lane below
          # cannot see fixture/mark decorator signatures and flags every
          # ``@pytest.fixture`` / ``@pytest.mark.parametrize`` as
          # ``[untyped-decorator]`` even though the stubs are correct.
          pip install -e ".[ml]"
          pip install mypy types-requests \
            "pytest>=9.0.3" pytest-asyncio pytest-mock

      - name: Run MyPy
        # MyPy reads strict config from pyproject.toml automatically.
        # Boundaries for un-stubbed third-party libraries are declared
        # per-module in pyproject.toml under [[tool.mypy.overrides]];
        # the global --ignore-missing-imports flag was removed so any new
        # un-declared import surfaces as a hard error instead of being
        # silently silenced.
        run: |
          mypy src/omni_mercury_engine/ \
            --show-error-codes \
            --pretty

      - name: Run MyPy on critical tests
        # Incremental test typing: gated on the **entire** ``tests/``
        # tree.  ``--ignore-missing-imports`` is **not** present --
        # third-party boundaries are declared in pyproject.toml
        # [[tool.mypy.overrides]], so any new un-declared import in
        # test code fails the gate instead of being silenced.
        #
        # The two remaining relaxations are:
        #
        # * ``--allow-untyped-defs`` / ``--allow-untyped-calls`` -- a
        #   test function with no parameter annotations at all is
        #   accepted, matching the historical pytest idiom.  Parameter
        #   annotations are tracked at the source (``: Any`` is the
        #   stopgap), so partial annotation is still a hard error --
        #   ``--allow-incomplete-defs`` is **not** present.
        # * ``--disable-error-code untyped-decorator`` -- pytest's
        #   ``@pytest.fixture`` / ``@parametrize`` decorators return
        #   ``Any`` from the public stubs, which would otherwise flag
        #   every decorated test as ``[untyped-decorator]``.
        #
        # ``--allow-subclassing-any`` matches the global pyproject
        # setting and lets test mocks subclass ``torch.nn.Module``,
        # ``pydantic.BaseModel``, etc.  ``[misc]`` errors from
        # deliberately writing to read-only properties are pinned with
        # per-line ``# type: ignore[misc]`` so the suppression is
        # visible at the source rather than at the gate.
        run: |
          mypy tests/ \
            --allow-untyped-defs \
            --allow-untyped-calls \
            --allow-subclassing-any \
            --disable-error-code untyped-decorator \
            --show-error-codes \
            --pretty \
            --no-warn-unused-configs

      - name: Run MyPy strict on graduated test directories (no test-debt disables)
        # ---- v1.7.0: incremental test-debt removal ----
        # Newly-authored or refactored test directories opt into the
        # strict mypy gate (no ``--allow-untyped-defs``, no
        # ``--allow-subclassing-any``, no decorator disable) once
        # they are clean.  Every test file under the directories
        # listed below is fully annotated (verified by the run below)
        # so the historical test-debt relaxations no longer apply
        # there.
        #
        # The mechanism is intentionally additive: directories that
        # are not yet clean stay on the relaxed lane above, and
        # individual directories graduate to the strict lane one
        # commit at a time.  When a directory graduates, add it to
        # the list below.  See the strengthening plan §5 P0
        # ("Re-lift the test-debt mypy disables") for the long-term
        # goal of emptying the relaxed lane.
        #
        # Graduated (strict, no test-debt disables):
        # * tests/datasets/      -- v1.7.0
        # * tests/ethical/       -- v1.7.0 follow-up
        # * tests/safeguards/    -- v1.7.0 follow-up
        # * tests/tools/         -- operator-tooling hardening PR
        run: |
          mypy tests/datasets/ tests/ethical/ tests/safeguards/ tests/tools/ \
            --disallow-subclassing-any \
            --show-error-codes \
            --pretty \
            --no-warn-unused-configs

  # ===========================================================================
  # Stage 3: Security Scanning
  # ===========================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.run_security_scan != 'false'

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        # Pin upgrade target liberally — if the runner already ships a
        # newer pip, ``--upgrade`` is a no-op.  Failure here means a
        # genuine network / index issue and should fail the job.
        run: python -m pip install --upgrade "pip>=26.1"

      - name: Install bandit / safety / pip-audit (audit-tool layer)
        # Audit tools live in the *runner's* default Python and are
        # never installed into Mercury's environment.  This keeps
        # the audit-tool transitives (``nltk``, ``joblib``, etc.)
        # OUT of the scanned surface — they belong to the auditor,
        # not to Mercury.  Removing them from the audit scope is
        # the architectural remediation for the
        # ``--ignore-vuln`` history previously documented in
        # ``docs/SECURITY.md``: Mercury does not ship
        # those packages, so they must not appear in Mercury's
        # vulnerability report regardless of advisory state.
        #
        # ``click>=8.2`` is re-pinned at the **runner** level (not
        # just inside the Mercury audit venv): the ``safety`` CLI
        # bundles ``typer>=0.20``, whose ``_types.py`` uses
        # ``click.Choice[ParamTypeValue]`` (PEP 695 generic
        # subscripting added in click 8.2).  Without the re-pin the
        # GHA hosted Python 3.12 image ships a click version that
        # raises ``TypeError: type 'Choice' is not subscriptable``
        # the moment ``safety`` imports ``typer``, breaking the
        # Safety dep-CVE gate before any vulnerability check runs.
        run: pip install bandit safety pip-audit "click>=8.2"

      - name: Install Semgrep (isolated venv)
        # Semgrep is heavier (~76MB manylinux wheel including
        # ``semgrep-core``).  Blocking — if it cannot be installed,
        # the security gate would be silently weaker, so we fail
        # explicitly rather than ``|| true``.  Using a separate step
        # keeps the failure mode self-evident in the GHA UI.
        #
        # Semgrep pins ``click~=8.1.8`` (i.e. ``<8.2``), which is
        # incompatible with ``safety``'s bundled ``typer>=0.20``
        # that requires ``click>=8.2`` for PEP 695 ``click.Choice[...]``
        # subscripting.  Installing semgrep into the runner's default
        # Python would silently downgrade click and crash safety on
        # import.  Installing semgrep into its own venv lets each
        # tool keep the click version it actually needs.  Verified
        # locally against semgrep ``Requires-Dist: click~=8.1.8`` and
        # safety 3.7.0 ``Requires-Dist: click>=8.0.2`` + typer 0.25.1.
        run: |
          python -m venv /tmp/semgrep-env
          /tmp/semgrep-env/bin/pip install --upgrade "pip>=26.1"
          /tmp/semgrep-env/bin/pip install semgrep
          # Expose semgrep on PATH for the scan step below without
          # contaminating the runner's site-packages.
          ln -sf /tmp/semgrep-env/bin/semgrep /usr/local/bin/semgrep

      - name: Create isolated Mercury install (audit target)
        # Install Mercury into a dedicated venv so the dependency
        # audits below see ONLY Mercury's declared deps + their
        # transitives — NOT the transitives of the audit tools
        # themselves.  This is the architectural fix that lets us
        # delete every previous ``--ignore-vuln`` flag: nltk and
        # joblib appear in safety/bandit/pip-audit's own dependency
        # graph but not in Mercury's, so isolation removes them
        # from the audit surface entirely.  The frozen requirements
        # list is emitted to a Job-Summary group so reviewers can
        # see exactly what surface was audited.
        #
        # ``click>=8.2`` + ``typer>=0.20`` re-pin: the GHA hosted
        # Python ships an older ``typer`` whose ``__types.py`` uses
        # ``click.Choice[ParamTypeValue]`` (PEP 695 generic
        # subscripting added in click 8.2); without the re-pin the
        # ``pip install -e ".[api]"`` resolver downgrades click and
        # breaks typer's import.  Diagnosed on PR #148 (commits
        # 6cc4bbd / 1952eb7 / 63ae1dc); fixed in commit ae7ad84.
        run: |
          python -m venv /tmp/mercury-audit-env
          /tmp/mercury-audit-env/bin/pip install --upgrade "pip>=26.1"
          /tmp/mercury-audit-env/bin/pip install -e ".[api]" \
            --upgrade "click>=8.2" "typer>=0.20"
          /tmp/mercury-audit-env/bin/pip list --format=freeze \
            > /tmp/mercury-audit-env/requirements.txt
          {
            echo "## Audit-target environment (Mercury install only)"
            echo
            echo '```'
            cat /tmp/mercury-audit-env/requirements.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Run Bandit (security linter)
        # Bandit security scan is blocking - fails on medium+ severity issues.
        run: |
          bandit -r src/omni_mercury_engine/ \
            -c pyproject.toml \
            -f json \
            -o bandit-report.json \
            --severity-level medium

      - name: Run Safety (dependency vulnerabilities — BLOCKING)
        # Hard-blocking dep-CVE gate, scoped to the isolated Mercury
        # install via ``-r``.  The audit-tool venv is intentionally
        # NOT scanned — auditor-internal packages are not Mercury's
        # supply chain.
        #
        # ``--policy-file .safety-policy-v2.yml`` is required to
        # override Safety's auto-discovery of ``.safety-policy.yml``
        # (which is in v3 format and rejected by ``check``'s legacy
        # parser).  The v2 file is a no-op shim — per-CVE risk
        # acceptance via ``--ignore`` is intentionally NOT used: any
        # new finding in Mercury's own surface fails the gate.
        run: |
          set +e
          safety check \
            -r /tmp/mercury-audit-env/requirements.txt \
            --policy-file .safety-policy-v2.yml \
            --output json > safety-report.json
          rc=$?
          # On any non-zero exit, surface each finding as a GHA
          # ::error:: annotation (visible in the Checks tab UI without
          # log access) and as a Job Summary table.
          jq -r '.vulnerabilities[]? | "::error title=Safety dep CVE::\(.package_name) \(.analyzed_version) — vuln-id \(.vulnerability_id) (\(.CVE // "no-cve"))"' safety-report.json 2>/dev/null \
            | sort -u || true
          {
            echo "## Safety report (exit=$rc)"
            echo
            echo '```'
            jq -r '.vulnerabilities[]? | "\(.package_name) \(.analyzed_version) — \(.vulnerability_id) (\(.CVE // "no-cve"))"' safety-report.json 2>/dev/null \
              | sort -u || true
            echo '```'
            echo
            echo "Total vulns: $(jq '(.vulnerabilities // []) | length' safety-report.json 2>/dev/null || echo '?')"
            echo "Packages scanned: $(jq '.report_meta.packages_found // "?"' safety-report.json 2>/dev/null)"
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$rc"

      - name: Run pip-audit (PyPI/OSV advisories — BLOCKING)
        # Hard-blocking, parity with Safety above.  ``--path`` scopes
        # pip-audit to Mercury's isolated install; the runner-level
        # audit-tool transitives are excluded by construction.  No
        # ``--ignore-vuln`` entries: any finding in Mercury's own
        # supply chain fails the gate.
        run: |
          pip-audit \
            --path /tmp/mercury-audit-env/lib/python${{ env.PYTHON_VERSION }}/site-packages \
            --skip-editable \
            --format json --output pip-audit-report.json

      - name: Run Semgrep (SAST — BLOCKING)
        # Semgrep static-analysis security scan.  Blocking on
        # findings.  If semgrep is somehow unavailable on the runner,
        # fail explicitly rather than silently passing the gate —
        # missing tools must not look the same as a clean scan.
        run: |
          if ! command -v semgrep &> /dev/null; then
            echo "Semgrep is not installed — failing rather than silently skipping."
            exit 1
          fi
          semgrep scan \
            --config "p/python" \
            --config "p/security-audit" \
            --json \
            --output semgrep-report.json \
            src/

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            pip-audit-report.json
            semgrep-report.json
          retention-days: 30

  # ===========================================================================
  # Stage 4: Core Tests (Lightweight)
  # ===========================================================================
  core-tests:
    name: Core Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [code-quality]
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-core-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-core-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          # [ml] provides torch/sklearn (moved out of core deps to keep
          # `pip install mercury-agent` lightweight).  Core tests exercise
          # engine, fusion, and detector code that needs the ML stack.
          # [api] supplies python-multipart + fastapi/uvicorn so the
          # API-surface tests added to the expanded core lane (see
          # ``Run core tests`` below) collect cleanly.
          pip install -e ".[ml,dev,api]"
          pip install pytest pytest-cov pytest-asyncio sympy

      - name: Run core tests with coverage
        run: |
          # Core-lane test selection, expanded in v1.7.x for the
          # COVERAGE_THRESHOLD_CORE 15 -> 25 graduation.  Measured
          # combined stmt+branch coverage on this selection (without
          # tests/security/) is well above the 25 floor.
          #
          # tests/security/ is intentionally NOT in this lane:
          # tests/security/conftest.py runs a pytest_configure hook
          # that hard-fails any CI session unless MERCURY_PQC_REAL_AMA
          # is set, which in turn requires the heavyweight AMA
          # Cryptography native build that ml-tests provisions.  The
          # core lane is intentionally lightweight; tests/security/
          # is covered by ml-tests (which DOES build the AMA library)
          # and Neuro-Symbolic Tests.  Adding it here without the
          # AMA build would either fail at collection or weaken the
          # MERCURY_PQC_REAL_AMA safeguard — neither acceptable.
          #
          # When adding a directory below, prefer the directory form
          # (e.g. ``tests/ml/``) over listing individual files so the
          # lane picks up new tests automatically.  Files that depend
          # on packages NOT in the ``[ml,dev,api]`` install set above
          # must NOT be added here.
          pytest tests/test_cli.py tests/core/ \
            tests/test_federation.py \
            tests/test_cap_alerting.py \
