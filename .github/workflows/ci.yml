  # ===========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [core-tests, security-scan]
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Free up disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' 'temurin-.*' 'ghc.*' 'mysql.*' 'postgresql.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true
          df -h

      - name: Prepare Trivy temp directory on /mnt
        # GitHub-hosted ubuntu runners only ship ~14 GB free on `/`, which
        # is exhausted when Trivy exports the loaded Docker image (the ML
        # image is multi-GB once decompressed) to its default tempdir
        # under /tmp.  /mnt is backed by a much larger ephemeral volume
        # (~70 GB free), so we point Trivy's tempdir + cache there to
        # avoid `no space left on device` during image export without
        # weakening the scan (no skipped paths, no severity reduction).
        run: |
          sudo mkdir -p /mnt/trivy-tmp /mnt/trivy-cache
          sudo chown -R "$USER:$USER" /mnt/trivy-tmp /mnt/trivy-cache
          df -h /mnt /

      # Set up Docker Buildx with the same 3-attempt retry the checkout step
      # above uses. Booting the buildkit container pulls
      # ``moby/buildkit:buildx-stable-1`` from ``registry-1.docker.io``, which
      # intermittently times out on GitHub-hosted runners ("Client.Timeout
      # exceeded while awaiting headers" while booting buildkit). That is a
      # transient Docker Hub blip, not a build defect, and must not fail the
      # gate — but the final attempt has no ``continue-on-error``, so a genuine
      # registry outage still surfaces as a job failure (nothing is masked).
      - name: Set up Docker Buildx (attempt 1)
        id: buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Pause before Buildx retry 1 (transient registry flake stabilisation)
        if: steps.buildx.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::docker/setup-buildx-action@v4 attempt 1 failed (likely a transient registry-1.docker.io timeout booting the buildkit container). Sleeping 15s before retry."
          sleep 15

      - name: Set up Docker Buildx (attempt 2, runs only on attempt-1 failure)
        id: buildx2
        if: steps.buildx.outcome == 'failure'
        continue-on-error: true
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Pause before Buildx retry 2 (extended backoff)
        if: steps.buildx.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::docker/setup-buildx-action@v4 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Set up Docker Buildx (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.buildx.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mercury-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Reclaim disk before Trivy scan
        # The buildx GHA cache export above leaves a sizable copy of the
        # image layers in the buildx builder cache on `/`, on top of the
        # daemon-side image we still need for the scan.  Drop the builder
        # cache (the daemon image survives because it is the scan target)
        # so Trivy has headroom for its image-export step.
        run: |
          docker buildx prune -af || true
          docker builder prune -af || true
          df -h /mnt /

      - name: Install Trivy binary
        # The bundled ``aquasecurity/setup-trivy`` action that
        # ``aquasecurity/trivy-action@v0.36.0`` invokes for us has a
        # known failure mode on PR runs whose ``actions/cache`` entry
        # for ``trivy-binary-v0.70.0-Linux-X64`` is cold: setup-trivy
        # then falls back to a sparse ``actions/checkout`` of the
        # ``aquasecurity/trivy`` repo at the tagged release SHA in
        # order to run the ``contrib/install.sh`` shipped in that
        # tree.  That sparse checkout's sub-object fetch trips
        # ``fatal: could not read Username for 'https://github.com':
        # terminal prompts disabled`` because the GitHub-issued
        # ``GITHUB_TOKEN`` credential helper installed by
        # ``actions/checkout`` is not propagated to the deferred
        # promisor-remote fetch underneath the sparse view.
        #
        # We sidestep that flake at source by installing the same
        # Trivy version directly from the project's documented
        # release-binary install script (which only ever talks to
        # ``github.com/aquasecurity/trivy/releases``, never to the
        # source tree) and then passing ``skip-setup-trivy: true``
        # below so the action consumes our binary instead of
        # attempting its own.  Same Trivy version, same scan policy,
        # deterministic install path — no weakening of the gate.
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin v0.70.0
          trivy --version

      - name: Scan Docker image with Trivy
        env:
          TMPDIR: /mnt/trivy-tmp
          TRIVY_TEMP_DIR: /mnt/trivy-tmp
          TRIVY_CACHE_DIR: /mnt/trivy-cache
        # Blocking gate.  Mirrors the standalone security.yml container scan
        # policy. ``ignore-unfixed: false`` + the repo-root ``.trivyignore``
        # replace the previous blanket unfixed-CVE waiver with an
        # enumerated, expiring, owner-reviewable acceptance ledger: a NEW
        # unfixed CRITICAL/HIGH finding now fails this gate instead of
        # passing silently, and an expired ledger entry fails it until
        # re-reviewed.  ``vuln-type: os,library`` scopes the scan to the
        # OS and Python library surfaces this image actually ships.
        # Fixable CVEs never enter the ledger — the Dockerfile's
        # runtime-stage ``apt-get upgrade`` (latest trixie security
        # patches at build time) and the ``pip>=26.1`` floor are the fix
        # path for those.
        # Action pinned to the same tagged version as security.yml's
        # Trivy steps so both workflows run identical action code
        # (deterministic, supply-chain hardened).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mercury-agent:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: true
          vuln-type: 'os,library'
          ignore-unfixed: false
          trivyignores: '.trivyignore'
          exit-code: '1'
          timeout: '10m'
          # Use the binary installed in the explicit step above; see
          # that step's comment for the upstream-flake rationale.
          skip-setup-trivy: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: 'trivy-results.sarif'
          # Distinct category so the ci.yml blocking PR-gate Trivy run
          # does not silently overwrite or merge with security.yml's
          # `trivy-container-scan` upload or docker.yml's advisory
          # tarball scan upload.  All three workflows currently scan
          # the same image surface; the explicit categories let the
          # GitHub Security tab show each workflow's findings under
          # a deterministic key.
          category: 'trivy-ci-blocking'

  # ===========================================================================
  # Stage 9: Documentation Build
  # ===========================================================================
  docs-build:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [code-quality]
    # Run on all pushes and PRs (documentation should be validated on every change)
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install documentation tools
        # ``sphinx_autodoc_typehints`` is intentionally excluded — the docs
        # build never imports the package (see ``docs/conf.py``), so loading
        # the autodoc-typehints extension would only crash with
        # ``Unknown event name: autodoc-process-signature``.
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install sphinx sphinx-rtd-theme myst-parser

      - name: Build documentation
        # Blocking — Sphinx is the source-of-truth render of the narrative
        # docs (``ARCHITECTURE.md``, ``MATH_SPEC.md``, ``DEPLOYMENT.md``,
        # …).  A docs build that doesn't actually run is silent rot; if it
        # breaks, fix the underlying issue rather than ``continue-on-error``.
        run: |
          cd docs
          sphinx-build -b html . _build/html

  # ===========================================================================
  # Final Status Check
  # ===========================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - code-quality
      - workflow-hardening
      - type-checking
      - core-tests
      - neuro-symbolic-tests
      - security-scan
      - integration-tests
      - ethics-audit
      - ml-tests
      - performance-benchmark
      - docker-build
      - docs-build
    if: always()

    steps:
      - name: Check all jobs
        run: |
          # Aggregate gate. Every blocking job feeds this rollup so none of
          # them can fail while CI Success stays green (the pre-fix rollup
          # omitted ml-tests / ethics-audit / docker-build / docs-build, so
          # their failures were invisible to the aggregate).
          #
          # Two result policies:
          #
          #  * SPINE jobs have NO legitimate skip on any trigger — they run on
          #    every push/PR/schedule. A ``skipped`` spine job therefore means
          #    an UPSTREAM gate failed and this validation never ran. That is a
          #    distinct, non-passing state: we fail on it instead of treating
          #    it as green. (``core-tests`` is in the spine, so any downstream
          #    skip it induces is caught at the root as well.)
          #  * CONDITIONAL jobs legitimately skip on some triggers
          #    (performance-benchmark on push; ml-tests off main/develop PRs;
          #    docker-build on schedule; docs-build on schedule; security-scan
          #    when the dispatch input disables it). For these ``skipped`` is
          #    allowed, but ``failure``/``cancelled`` still blocks.
          #
          # ``cancelled`` is blocking for every job so a concurrency- or
          # timeout-cancelled gate can never turn into a green CI Success.
          declare -A RESULT=(
            [code-quality]="${{ needs.code-quality.result }}"
            [workflow-hardening]="${{ needs.workflow-hardening.result }}"
            [type-checking]="${{ needs.type-checking.result }}"
            [core-tests]="${{ needs.core-tests.result }}"
            [neuro-symbolic-tests]="${{ needs.neuro-symbolic-tests.result }}"
            [integration-tests]="${{ needs.integration-tests.result }}"
            [ethics-audit]="${{ needs.ethics-audit.result }}"
            [security-scan]="${{ needs.security-scan.result }}"
            [performance-benchmark]="${{ needs.performance-benchmark.result }}"
            [ml-tests]="${{ needs.ml-tests.result }}"
            [docker-build]="${{ needs.docker-build.result }}"
            [docs-build]="${{ needs.docs-build.result }}"
          )
          SPINE="code-quality workflow-hardening type-checking core-tests neuro-symbolic-tests integration-tests ethics-audit"
          CONDITIONAL="security-scan performance-benchmark ml-tests docker-build docs-build"

          fail=0
          for job in $SPINE; do
            case "${RESULT[$job]}" in
              success) : ;;
              skipped)
                echo "::error::${job} was SKIPPED — a required gate did not run (upstream failure); this is a non-passing state, not a green skip."
                fail=1 ;;
              *) echo "::error::${job} = ${RESULT[$job]}"; fail=1 ;;
            esac
          done
          for job in $CONDITIONAL; do
            case "${RESULT[$job]}" in
              success|skipped) : ;;
              *) echo "::error::${job} = ${RESULT[$job]}"; fail=1 ;;
            esac
          done

          echo "---- job results ----"
          for job in $SPINE $CONDITIONAL; do
            printf '  %-22s %s\n' "${job}:" "${RESULT[$job]}"
          done

          if [[ "$fail" -eq 1 ]]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ CI Pipeline Passed"
