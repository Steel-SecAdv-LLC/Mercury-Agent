            tests/test_domain_loaders.py \
            tests/test_domain_benchmarks.py \
            tests/detectors/ \
            tests/ml/ \
            tests/datasets/ \
            tests/api/ \
            tests/automl/ \
            tests/test_adaptive_detector.py \
            tests/test_acceleration_dynamics.py \
            tests/test_advanced_ml_capabilities.py \
            tests/test_disaster_precursor.py \
            tests/test_spectral_vibration.py \
            tests/test_uiux_anomaly.py \
            tests/test_detectors.py \
            tests/test_anomaly_metrics.py \
            tests/test_three_r.py \
            tests/test_data_sources.py \
            tests/test_calibration_wiring.py \
            tests/test_api.py \
