# Mercury Agent — ISO Hardening CI
#
# Two independent jobs that the strengthening plan calls out as
# missing gates:
#
#   * examples-parity: every shippable `examples/*.py` script must
#     exit 0 and emit the expected completion marker.  Catches the
#     class of regressions where an example silently breaks because
#     of an internal API change.
#
#   * load-tests: stand up the Mercury Agent API in the background
#     and run `k6` in smoke mode and `locust` headless mode against
#     it, failing the job if SLO thresholds are violated.
#
# Both jobs run on PRs and on pushes to main/develop so regressions
# are caught at PR time, not after merge.  They are intentionally
# separate from `.github/workflows/ci.yml` to keep the existing
# carefully-tuned CI surface untouched.

name: ISO Hardening

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lambda-drift:
    name: Docs λ Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Lyapunov λ consistency in docs
        run: |
          # No third-party dependency: the script is stdlib-only.
          python scripts/check_readme_lyapunov.py

  examples-parity:
    name: Examples Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # CVE-2026-6357: floor pip before any other pip install in this job.
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"

      - name: Run humanitarian_demo end-to-end
        run: |
          set -euo pipefail
          out=$(python examples/humanitarian_demo.py --module cyber)
          echo "$out"
          # Deterministic markers the demo must always emit on success.
          echo "$out" | grep -q "CYBER FORTRESS"
          echo "$out" | grep -q "HUMANITARIAN IMPACT"

      - name: Run live_anomaly_demo end-to-end (quiet, 5 samples)
        run: |
          set -euo pipefail
          out=$(python examples/live_anomaly_demo.py \
            --domain security --samples 5 --delay 1 --quiet)
          echo "$out"
          echo "$out" | grep -q "Demo complete"

      - name: Run physics_detectors_demo end-to-end (spectral)
        run: |
          set -euo pipefail
          out=$(python examples/physics_detectors_demo.py --module spectral)
          echo "$out"
          echo "$out" | grep -q "PHYSICS-INSPIRED DETECTORS"

  load-tests:
    name: Load Tests (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [examples-parity]
    env:
      MERCURY_API_HOST: http://127.0.0.1:8000
      # The k6 file flips its threshold envelope on this var; smoke mode
      # uses the cold-start-tolerant bounds documented in the JS file's
      # ``THRESHOLDS_SMOKE`` block.
      MERCURY_LOAD_MODE: smoke
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install API server + load tooling only
        run: |
          set -euo pipefail
          # CVE-2026-6357: floor pip before any other pip install in this job.
          python -m pip install --upgrade "pip>=26.1"
          # We deliberately do NOT install the ``[ml]`` extra here.
          # The /health and /api/v1/detect/* endpoints exercised by the
          # smoke run depend only on numpy + fastapi + pydantic, which
          # ``[api]`` already pulls. Installing torch (2 GB+),
          # torchvision, pytorch-lightning, timm, and opencv-headless
          # to run a 30-second smoke test was the root cause of the
          # original load-tests timeout / disk-pressure failure mode:
          # the GitHub-hosted runner spent its budget downloading
          # wheels and occasionally exhausted /tmp before uvicorn ever
          # imported anything.
          pip install -e ".[api]"
          pip install "locust>=2.31.0"

      - name: Install k6 (signed Grafana repo)
        run: |
          set -euo pipefail
          # Use the official Grafana repository (signed package) so we
          # never download arbitrary binaries from GitHub releases.
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6 jq

      - name: Start API server (detached)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Detach via ``setsid`` + ``nohup`` so the server survives the
          # end of this step's shell (otherwise the GitHub Actions
          # runner's per-step process-group cleanup can collect it
          # before the smoke-test steps run).  Stdout/stderr go to a
          # file so a startup crash is recoverable from the uploaded
          # artifacts.
          OMNI_RATE_LIMIT_ENABLED=false \
          MERCURY_AGENT_ENV=development \
          AMA_REQUIRE_REAL_PQC= \
          AMA_REQUIRE_CONSTANT_TIME= \
          JWT_SECRET_KEY=ci-smoke-test-key-do-not-use-in-prod \
            setsid nohup python -m uvicorn omni_mercury_engine.api.server:app \
              --host 127.0.0.1 --port 8000 --log-level info \
              > artifacts/api.log 2>&1 < /dev/null &
          echo $! > artifacts/api.pid
          # Detach from this shell explicitly.
          disown || true
          echo "Started uvicorn with PID $(cat artifacts/api.pid)"

      - name: Wait for /health (90 s budget, no early-exit)
        run: |
          set -euo pipefail
          # Separate step so the previous step has fully exited and the
          # detached uvicorn is now an orphan owned by init — which is
          # exactly what we want for it to survive subsequent steps.
          for i in $(seq 1 90); do
            if curl -fsS "$MERCURY_API_HOST/health" > /dev/null 2>&1; then
              echo "API ready after ${i}s"
              curl -fsS "$MERCURY_API_HOST/health" | head -c 500
              echo
              exit 0
            fi
            sleep 1
          done
          echo "::error::API failed to respond on /health within 90s"
          echo "--- last 200 lines of uvicorn log ---" >&2
          tail -n 200 artifacts/api.log >&2 || true
          echo "--- /proc evidence (is uvicorn still alive?) ---" >&2
          if [ -f artifacts/api.pid ]; then
            PID="$(cat artifacts/api.pid)"
            if [ -d "/proc/${PID}" ]; then
              echo "uvicorn PID ${PID} is still alive" >&2
              cat "/proc/${PID}/status" 2>/dev/null | head -20 >&2 || true
            else
              echo "uvicorn PID ${PID} has exited (crashed during startup)" >&2
            fi
          fi
          exit 1

      - name: Run k6 smoke test
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Smoke envelope: 1 VU for 30 s, MODE=smoke selects the
          # cold-start-tolerant threshold set inside the JS file.
          MODE=smoke k6 run \
            --vus 1 \
            --duration 30s \
            --summary-export=artifacts/k6_summary.json \
            tests/load/k6_load_test.js

      - name: Assert k6 SLO thresholds
        run: |
          set -euo pipefail
          test -s artifacts/k6_summary.json
          # k6 sets ``thresholds.*.ok = false`` when a threshold is
          # breached; the previous step already exits non-zero in that
          # case, but we double-check the JSON here so a future k6 CLI
          # behaviour change cannot silently pass a broken smoke run.
          python - <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path("artifacts/k6_summary.json").read_text())
          metrics = data.get("metrics", {})
          breaches: list[str] = []
          checked = 0
          for name, m in metrics.items():
              thresholds = m.get("thresholds") or {}
              for t, info in thresholds.items():
                  checked += 1
                  if info.get("ok") is False:
                      breaches.append(f"{name}: {t}")
          if breaches:
              print("k6 threshold breaches:", *breaches, sep="\n  ")
              sys.exit(1)
          print(f"OK: {checked} k6 thresholds satisfied")
          PY

      - name: Run locust smoke test
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Headless: 5 users, 1 spawn/sec, 30s.  ``--exit-code-on-error 1``
          # makes locust propagate a non-zero exit when any request
          # fails (default would mask request failures).  Smoke mode
          # uses the locustfile's own SLO assertion path which is
          # tolerant of cold-start (mirrors the k6 smoke envelope).
          MERCURY_LOAD_MODE=smoke locust -f tests/load/locustfile.py \
            --host "$MERCURY_API_HOST" \
            --headless --users 5 --spawn-rate 1 --run-time 30s \
            --csv artifacts/locust \
            --exit-code-on-error 1 \
            --only-summary

      - name: Assert locust SLO thresholds
        run: |
          set -euo pipefail
          test -s artifacts/locust_stats.csv
          # Locust's CSV column names have varied across releases
          # (``95%`` vs ``95%ile``, ``Failure Count`` vs ``Num Failures``).
          # Probe both rather than picking one and silently parsing 0.
          python - <<'PY'
          import csv
          import os
          import pathlib
          import sys

          stats = list(csv.DictReader(pathlib.Path("artifacts/locust_stats.csv").open()))
          if not stats:
              print("locust_stats.csv is empty", file=sys.stderr)
              sys.exit(1)

          aggregated = next(
              (r for r in stats if (r.get("Name") or "").strip() == "Aggregated"),
              None,
          )
          if aggregated is None:
              print("locust produced no Aggregated row; columns were:",
                    list(stats[0].keys()), file=sys.stderr)
              sys.exit(1)

          def num(row: dict[str, str], *keys: str, default: float = 0.0) -> float:
              for k in keys:
                  v = row.get(k)
                  if v not in (None, ""):
                      try:
                          return float(v)
                      except ValueError:
                          continue
              return default

          p95 = num(aggregated, "95%", "95%ile", "p95")
          requests = num(aggregated, "Request Count", "# requests", "num_requests")
          failures = num(aggregated, "Failure Count", "# failures", "num_failures")
          failure_rate = failures / requests if requests > 0 else 0.0

          mode = os.environ.get("MERCURY_LOAD_MODE", "full").lower()
          if mode == "smoke":
              # Same justification as k6 THRESHOLDS_SMOKE: tiny sample,
              # cold-start dominates p95; still refuse a *broken* API.
              p95_floor, failure_floor = 3000.0, 0.05
          else:
              p95_floor, failure_floor = 500.0, 0.01

          breaches: list[str] = []
          if p95 > p95_floor:
              breaches.append(f"p95 latency {p95:.1f}ms > {p95_floor}ms SLO")
          if failure_rate > failure_floor:
              breaches.append(
                  f"failure rate {failure_rate:.4f} > {failure_floor:.4f} SLO"
              )
          if requests <= 0:
              breaches.append("locust completed with 0 requests")
          if breaches:
              print("locust SLO breaches:", *breaches, sep="\n  ")
              sys.exit(1)
          print(
              f"OK: locust mode={mode} requests={int(requests)} "
              f"p95={p95:.1f}ms failure_rate={failure_rate:.4f}"
          )
          PY

      - name: Stop API server
        if: always()
        run: |
          # ``kill -TERM`` first, then ``-KILL`` if the process is still
          # alive after a grace period.  Suppress errors so this step
          # never masks a real failure in a preceding step.
          if [ -f artifacts/api.pid ]; then
            PID="$(cat artifacts/api.pid)"
            if [ -n "${PID}" ] && [ -d "/proc/${PID}" ]; then
              # Negative PID targets the whole process group (we
              # ``setsid`` launched the parent, so the group is intact).
              kill -TERM "-${PID}" 2>/dev/null || kill -TERM "${PID}" 2>/dev/null || true
              for _ in $(seq 1 10); do
                [ -d "/proc/${PID}" ] || break
                sleep 1
              done
              if [ -d "/proc/${PID}" ]; then
                kill -KILL "-${PID}" 2>/dev/null || kill -KILL "${PID}" 2>/dev/null || true
              fi
            fi
          fi

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-artifacts
          path: artifacts/
          retention-days: 7
