# Mercury Agent — ISO Hardening CI
#
# Three independent gates that the strengthening plan called out as
# missing or incomplete:
#
#   * docs-lambda-drift: scan README.md and docs/MATH_SPEC.md for any
#     Lyapunov-context λ claim that disagrees with the canonical value
#     in `LyapunovConstants.LAMBDA_CONVERGENCE` /
#     `configs/lyapunov_canonical.yaml`.  Catches documentation rot
#     where someone updates one but forgets the other.
#
#   * examples-parity: every shippable `examples/*.py` script must
#     exit 0 and emit the expected completion marker.  Catches the
#     class of regressions where an example silently breaks because
#     of an internal API change.
#
#   * load-tests: stand up the Mercury Agent API in the background
#     and run `k6` in smoke mode and `locust` headless mode against
#     it, failing the job if SLO thresholds are violated.
#
# A final `iso-hardening-success` rollup aggregates the three sub-jobs
# into a single required status check so branch protection has one
# stable name to gate on; cancelled jobs are treated as failures so a
# concurrency-cancelled upstream cannot silently turn the rollup green.
#
# All jobs run on PRs and on pushes to main/develop so regressions are
# caught at PR time, not after merge.  This workflow is intentionally
# separate from `.github/workflows/ci.yml` to keep the existing
# carefully-tuned CI surface untouched.

name: ISO Hardening

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-lambda-drift:
    name: Docs λ Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check Lyapunov λ consistency in docs
        run: |
          # No third-party dependency: the script is stdlib-only.
          python scripts/check_readme_lyapunov.py

  examples-parity:
    name: Examples Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # CVE-2026-6357: floor pip before any other pip install in this job.
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"

      - name: Run humanitarian_demo end-to-end
        run: |
          set -euo pipefail
          out=$(python examples/humanitarian_demo.py --module cyber)
          echo "$out"
          # Deterministic markers the demo must always emit on success.
          echo "$out" | grep -q "CYBER FORTRESS"
          echo "$out" | grep -q "HUMANITARIAN IMPACT"

      - name: Run live_anomaly_demo end-to-end (quiet, 5 samples)
        run: |
          set -euo pipefail
          out=$(python examples/live_anomaly_demo.py \
            --domain security --samples 5 --delay 1 --quiet)
          echo "$out"
          echo "$out" | grep -q "Demo complete"

      - name: Run physics_detectors_demo end-to-end (spectral)
        run: |
          set -euo pipefail
          out=$(python examples/physics_detectors_demo.py --module spectral)
          echo "$out"
          echo "$out" | grep -q "PHYSICS-INSPIRED DETECTORS"

  load-tests:
    name: Load Tests (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [examples-parity]
    env:
      MERCURY_API_HOST: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies (api + ml + load tooling)
        run: |
          # CVE-2026-6357: floor pip once for the whole job.
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[api,ml]"
          pip install "locust>=2.31.0"

      - name: Install k6
        run: |
          set -euo pipefail
          # Use the official Grafana repository (signed package);
          # avoids downloading arbitrary binaries from GitHub releases.
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6 jq

      - name: Verify API import surface (fail fast before backgrounding)
        # Validate that ``omni_mercury_engine.api.server:app`` actually
        # imports BEFORE we put uvicorn in the background.  An import
        # failure in the backgrounded process would otherwise look like
        # a 120-second curl timeout with the real ``Traceback`` buried
        # in api.log; this step surfaces the traceback inline so the
        # GHA UI shows the root cause without an artifact download.
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib
          mod = importlib.import_module("omni_mercury_engine.api.server")
          app = getattr(mod, "app", None)
          if app is None:
              raise SystemExit("FATAL: omni_mercury_engine.api.server has no `app` attribute")
          print(f"OK: API app imported ({type(app).__name__})")
          PY

      - name: Start API server in background
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Start the API; rate-limit disabled so smoke traffic doesn't
          # trip 429s and corrupt the SLO measurement.
          OMNI_RATE_LIMIT_ENABLED=false \
          MERCURY_AGENT_ENV=development \
            python -m uvicorn omni_mercury_engine.api.server:app \
              --host 127.0.0.1 --port 8000 --log-level info \
              > artifacts/api.log 2>&1 &
          echo $! > artifacts/api.pid
          # Wait for /health to respond (120 s budget; raised from 60 s
          # because the GitHub-hosted runner cold-start of the full
          # ``[api,ml]`` import chain -- torch + sklearn + AMA stubs --
          # has been observed to take 70-90 s on the smaller runner
          # SKUs).  Emit a heartbeat every 10 s so a hung curl is
          # visible in the live log instead of looking like a stuck
          # job.
          for i in $(seq 1 120); do
            if curl -fsS "$MERCURY_API_HOST/health" > /dev/null; then
              echo "API ready after ${i}s"
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "  ...still waiting for API (${i}s elapsed)"
              # Surface the most recent log lines on each heartbeat so
              # the failure mode (import error, port collision, etc.)
              # is visible in the GHA live tail without waiting for
              # the artifact upload.
              tail -n 20 artifacts/api.log >&2 || true
            fi
            sleep 1
          done
          echo "API failed to come up within 120s" >&2
          echo "===== api.log (last 200 lines) =====" >&2
          tail -n 200 artifacts/api.log >&2 || true
          echo "===== uvicorn process status =====" >&2
          if [ -f artifacts/api.pid ] && kill -0 "$(cat artifacts/api.pid)" 2>/dev/null; then
              echo "uvicorn PID $(cat artifacts/api.pid) is still running but /health never responded" >&2
              ps -fp "$(cat artifacts/api.pid)" >&2 || true
          else
              echo "uvicorn process exited before /health responded" >&2
          fi
          exit 1

      - name: Warm up API endpoints before load measurement
        # The FastAPI lifespan hook in ``omni_mercury_engine.api.server``
        # already drives an in-process detection round before /health
        # returns 200, but that warmup runs synchronously inside the
        # same uvicorn worker that just imported torch + sklearn.  On
        # GHA's ``ubuntu-latest`` SKUs the first *out-of-process* POST
        # (Python validator → numpy SIMD dispatch resolution → Pydantic
        # response serialization → uvicorn JSON encode) still incurs
        # a one-time 200-400 ms tail because the cold-start cost is
        # shared between the lifespan hook and the first external
        # caller.  Running 5 detection + 5 health round-trips here
        # before k6 starts measuring guarantees the smoke-run sample
        # window only contains warm requests, which is the right
        # behaviour for an SLO regression gate: we are measuring
        # steady-state latency, not first-call cold-start.
        #
        # Each call is silenced (-fsS) so a non-200 response surfaces
        # via curl's exit code rather than being swallowed.  The
        # heredoc emits a deterministic 16-sample series so the
        # warmup is reproducible across runs.
        run: |
          set -euo pipefail
          warmup_payload='{"data": [1.0, 2.1, 1.5, 1.9, 2.3, 1.7, 2.0, 1.8, 2.2, 1.6, 1.9, 2.4, 1.5, 2.1, 1.8, 2.0], "sensitivity": 0.5}'
          for i in 1 2 3 4 5; do
            curl -fsS "$MERCURY_API_HOST/health" > /dev/null
            curl -fsS -X POST \
              -H "Content-Type: application/json" \
              -d "$warmup_payload" \
              "$MERCURY_API_HOST/api/v1/detect/univariate" > /dev/null
          done
          echo "Warmup complete: 5 health + 5 univariate-detect round-trips"

      - name: Run k6 smoke test
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Override the scenarios in the file with a CI-sized smoke
          # run (constant 1 VU for 30 s); the in-file thresholds still
          # apply and k6 exits non-zero when they are breached.
          #
          # ``--quiet`` suppresses k6's progress bar so the GHA log
          # stays diff-friendly across reruns.  ``--summary-export``
          # is still the supported way to emit a machine-readable
          # summary in k6 0.5x; the deprecation warning printed to
          # stderr is informational.
          k6 run \
            --vus 1 \
            --duration 30s \
            --quiet \
            --summary-export=artifacts/k6_summary.json \
            tests/load/k6_load_test.js

      - name: Assert k6 SLO thresholds
        run: |
          set -euo pipefail
          test -s artifacts/k6_summary.json
          # k6 sets thresholds.*.ok = false when a threshold is breached;
          # the previous step already exits non-zero in that case, but
          # we double-check the JSON here so a future k6 CLI behaviour
          # change cannot silently pass a broken smoke run.
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("artifacts/k6_summary.json").read_text())
          metrics = data.get("metrics", {})
          breaches = []
          for name, m in metrics.items():
              thresholds = m.get("thresholds") or {}
              for t, info in thresholds.items():
                  if info.get("ok") is False:
                      breaches.append(f"{name}: {t}")
          if breaches:
              print("k6 threshold breaches:", *breaches, sep="\n  ")
              sys.exit(1)
          print(f"OK: {sum(len((m.get('thresholds') or {})) for m in metrics.values())} k6 thresholds satisfied")
          PY

      - name: Run locust smoke test
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Headless: 5 users, 1 spawn/sec, 30s.  --exit-code-on-error 1
          # makes locust propagate a non-zero exit when any request
          # fails (default would mask request failures).
          locust -f tests/load/locustfile.py \
            --host "$MERCURY_API_HOST" \
            --headless --users 5 --spawn-rate 1 --run-time 30s \
            --csv artifacts/locust \
            --exit-code-on-error 1 \
            --only-summary

      - name: Assert locust SLO thresholds
        run: |
          set -euo pipefail
          test -s artifacts/locust_stats.csv
          python - <<'PY'
          import csv, pathlib, sys
          stats = list(csv.DictReader(
              pathlib.Path("artifacts/locust_stats.csv").open()
          ))
          aggregated = next(
              (r for r in stats if r.get("Name") == "Aggregated"),
              None,
          )
          if aggregated is None:
              print("locust produced no aggregated row", file=sys.stderr)
              sys.exit(1)
          # Mirrors the SLO constants documented inside
          # tests/load/locustfile.py (SLO_P95_MS = 500).
          p95 = float(aggregated.get("95%", "0") or 0)
          failure_rate = (
              float(aggregated.get("Failure Count", 0) or 0)
              / max(float(aggregated.get("Request Count", 0) or 0), 1.0)
          )
          breaches = []
          if p95 > 500:
              breaches.append(f"p95 latency {p95}ms > 500ms SLO")
          if failure_rate > 0.01:
              breaches.append(f"failure rate {failure_rate:.4f} > 1% SLO")
          if breaches:
              print("locust SLO breaches:", *breaches, sep="\n  ")
              sys.exit(1)
          print(f"OK: locust p95={p95}ms, failure_rate={failure_rate:.4f}")
          PY

      - name: Stop API server
        if: always()
        run: |
          if [ -f artifacts/api.pid ]; then
            kill "$(cat artifacts/api.pid)" 2>/dev/null || true
          fi

      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-artifacts
          path: artifacts/
          retention-days: 7

  # =========================================================================
  # Rollup status check
  # =========================================================================
  # A single required status check that aggregates the three sub-jobs
  # above.  Branch protection should require ONLY this rollup; the
  # individual jobs remain visible in the Checks tab for triage.
  # ``cancelled`` is treated as a blocking outcome alongside ``failure``
  # so a concurrency-cancelled upstream cannot silently turn this green.
  iso-hardening-success:
    name: ISO Hardening Success
    runs-on: ubuntu-latest
    needs: [docs-lambda-drift, examples-parity, load-tests]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Aggregate sub-job outcomes
        env:
          DRIFT_RESULT: ${{ needs.docs-lambda-drift.result }}
          EXAMPLES_RESULT: ${{ needs.examples-parity.result }}
          LOAD_RESULT: ${{ needs.load-tests.result }}
        run: |
          set -euo pipefail
          fail=0
          for entry in \
              "docs-lambda-drift:${DRIFT_RESULT}" \
              "examples-parity:${EXAMPLES_RESULT}" \
              "load-tests:${LOAD_RESULT}"; do
            name="${entry%%:*}"
            result="${entry##*:}"
            case "$result" in
              success) printf 'OK   %s: %s\n' "$name" "$result" ;;
              skipped) printf 'SKIP %s: %s\n' "$name" "$result" ;;
              *)       printf 'FAIL %s: %s\n' "$name" "$result"; fail=1 ;;
            esac
          done
          if [ "$fail" -ne 0 ]; then
            echo "ISO Hardening rollup FAILED" >&2
            exit 1
          fi
          echo "ISO Hardening rollup PASSED"
