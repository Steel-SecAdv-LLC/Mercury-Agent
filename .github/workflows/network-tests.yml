name: network-tests

# Runs the @pytest.mark.network suite weekly so external-endpoint
# schema drift (Dexcom v3, FHIR R4 Observation, eCFR Title-29, NIST CSF
# Reference Tool) is caught within seven days even though these tests
# auto-skip on every per-PR run.

on:
  schedule:
    - cron: "0 13 * * 1"  # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Cancel a prior weekly run if a manual ``workflow_dispatch`` is fired
# while one is still in flight.  Required by
# ``scripts/check_workflow_hardening.py`` and keeps the network-drift
# signal from queueing on top of itself.
concurrency:
  group: network-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v7

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout repository (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v7

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v7 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout repository (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Mercury Agent with compliance + dev + ml extras
        run: |
          # Floor pip to >=26.1 to close CVE-2026-6357 (pip arbitrary
          # code execution via malicious wheel).
          python -m pip install --upgrade "pip>=26.1"
          # [ml] is required here: the hazard detect_live round-trip smokes
          # (tests/test_live_wiring_network.py) importorskip torch, so
          # without the ML stack the five detector round-trips silently
          # skip every week and live-wiring drift goes unwatched.
          pip install -e ".[compliance,dev,ml]"

      # Prove the injected data-source secrets DELIVER real data (not merely
      # exist). Import-light (requests only, no engine/AMA), so it runs before
      # the native-crypto build and its per-source verdict is visible directly
      # in the log. Secrets are step-scoped; this lane is schedule/dispatch only
      # (never a fork-PR trigger). An absent key reports SKIP; a present-but-
      # failing key fails the step. USGS EROS/EarthExplorer authenticates a
      # username with an application token (USGS_KEY) or password.
      - name: Verify data-source credential delivery
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          EROSERS_USERNAME: ${{ secrets.EROSERS_USERNAME }}
          EROSERS_PASSWORD: ${{ secrets.EROSERS_PASSWORD }}
          USGS_KEY: ${{ secrets.USGS_KEY }}
        run: python scripts/verify_data_credentials.py

      # AMA Cryptography is Mercury's mandatory PQC backend: importing
      # omni_mercury_engine runs the fail-closed _enforce_pqc_production_gate(),
      # and tests/conftest.py imports the engine at collection time -- so even
      # the network suite aborts at import without the native backend. The
      # composite action exports LD_LIBRARY_PATH for the pytest step below.
      - name: Build + install AMA Cryptography (native PQC backend)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v3.3.0

      - name: Run @pytest.mark.network suite
        env:
          MERCURY_NETWORK_TESTS: "1"
          # Live-data API keys for the keyed loaders. Every value is a repo
          # secret injected only into this schedule/workflow_dispatch step (never
          # a fork-PR trigger, so never exposed to untrusted pull requests) --
          # never committed, echoed, or written to any artifact. An absent secret
          # resolves to an empty string and the loader skips/fail-softs. Where the
          # loader's env var differs from the secret name, BOTH are set to the
          # same secret (documented per line).
          #
          # NASA FIRMS: WildfireLoader reads NASA_FIRMS_MAP_KEY; the repo secret
          # is named FIRMS_MAP_KEY. Checkpoint training uses the keyless yearly
          # country archives and does not need this.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          NASA_FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          # NASA Open APIs (DONKI space weather + NeoWs) -- space_weather_loader
          # and meteor_loader read NASA_API_KEY (fall back to DEMO_KEY unkeyed).
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          # FRED (api.stlouisfed.org) -- financial_loader reads FRED_API_KEY.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # EIA (api.eia.gov) -- energy_loader reads EIA_API_KEY.
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          # Alpha Vantage market data -- financial market loader reads
          # ALPHA_VANTAGE_API_KEY.
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          # OpenWeatherMap -- weather loader reads OPENWEATHERMAP_API_KEY.
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          # USGS EROS M2M (login-token) needs BOTH the application token and the
          # ERS username (and optional password).
          USGS_KEY: ${{ secrets.USGS_KEY }}
          EROSERS_USERNAME: ${{ secrets.EROSERS_USERNAME }}
          EROSERS_PASSWORD: ${{ secrets.EROSERS_PASSWORD }}
        run: |
          pytest -m network -v --tb=short
