name: PQC Production Readiness

permissions:
  contents: read

concurrency:
  group: pqc-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    paths:
      - 'src/omni_mercury_engine/security/**'
      - 'src/omni_mercury_engine/integrations/mercury_amacrypto.py'
      - '.github/workflows/pqc-production-check.yml'
  pull_request:
    paths:
      - 'src/omni_mercury_engine/security/**'
      - 'src/omni_mercury_engine/integrations/mercury_amacrypto.py'
      - '.github/workflows/pqc-production-check.yml'
  # Manual dispatch is the recovery path when a push to ``main`` is
  # accidentally suppressed by a skip-directive substring in the squash
  # merge commit message (see CONTRIBUTING.md "Squash-merge gotcha").
  workflow_dispatch:

jobs:
  verify-real-pqc:
    runs-on: ubuntu-latest
    env:
      # All steps in this job collect from tests/security/, which loads
      # conftest.py's CI safeguard.  Setting at job level ensures the
      # PQC gate env var is visible to every step (pytest, coverage run,
      # KAT), not just the main security-tests step.
      MERCURY_PQC_REAL_AMA: "1"
    steps:
      - name: Checkout repository (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6

      - name: Pause before checkout retry (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout repository (attempt 2, runs only on first-attempt failure)
        if: steps.checkout.outcome == 'failure'
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build toolchain for AMA Cryptography native library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          # AMA Cryptography v3.2.0's ``setup.py`` preflight enforces
          # the supply-chain floors declared in
          # ``pyproject.toml [build-system].requires``:
          #   setuptools>=78.1.1  (PYSEC-2025-49 + GHSA-cx63-2mw6-8hw5)
          #   wheel>=0.47.0       (GHSA-8rrh-rw8j-w5fx)
          #   cmake>=4.3.2        (Dependabot supply-chain floor; the
          #                        PyPI cmake shim's ``__version__`` is
          #                        what setup.py's ``_check_cmake_version``
          #                        Path A reads — must not be < 4.3.2 or
          #                        the metadata-generation step fails).
          # Floors are pinned explicitly (rather than relying on the
          # resolver to upgrade an under-pinned ``cmake>=3.16`` to a
          # 4.x) so the supply-chain contract is documented in CI.
          # AMA_NO_CYTHON=1 below short-circuits the Cython / numpy
          # preflight, so those are intentionally absent here.
          python -m pip install --upgrade \
            "setuptools>=78.1.1" \
            "wheel>=0.47.0" \
            "cmake>=4.3.2"
          # The verify-real-pqc job exercises the security suite end-to-end,
          # which includes ``tests/security/test_jwt_auth.py`` and
          # ``tests/security/test_audit_improvements.py``. Both reach the
          # FastAPI-backed ``omni_mercury_engine.api.auth`` module at import
          # time. ``[dev]`` alone yields a ``ModuleNotFoundError: fastapi``
          # collection error on those files, so install the ``[api]`` extra
          # alongside ``[dev]`` to satisfy the ``api/auth.py`` runtime
          # contract under CI.
          pip install -e ".[dev,api]"

      - name: Build AMA Cryptography native C library
        env:
          # FIPS 204/205 KAT pinning (Phase 2): the byte-exact NIST ACVP
          # reproduction in ``tests/security/test_nist_fips_kat.py`` requires
          # the AMA v3.2.0 surface (``dilithium_sign_ctx`` for FIPS 204 §5.2
          # ctx-aware ML-DSA-65 sign + ``slhdsa_sign_deterministic`` /
          # ``slhdsa_verify`` for FIPS 205 SLH-DSA-SHAKE-128s NIST L1) plus
          # the FIPS 204 §6.2 Algorithm 7 line 3 fix that pins
          # ``rnd = 0^256`` in deterministic mode.
          #
          # AMA Cryptography PR #290 (merge commit 24c7fc7) landed on
          # ``main`` on 2026-05-04 and was tagged ``v3.1.0`` from that
          # same commit. ``v3.2.0`` (this pin) extends ``v3.1.0`` with
          # the native HMAC-SHA-256 Python bindings
          # (``native_hmac_sha256`` / ``native_hmac_sha256_2``) that
          # Mercury's ``native_jwt`` HS256 path consumes. The tag ships
          # the FIPS 204 §6.2 Algorithm 7
          # rnd fix, the FIPS 204 §5.2 ctx-aware ``dilithium_sign_ctx``
          # surface, the FIPS 205 NIST L1 SLH-DSA-SHAKE-128s public
          # surface, the POST verify-only KAT against pinned NIST
          # ACVP-Server tcId=342, INVARIANT-6 SK-wipe, no-alloc
          # ``sha2_HT``, and the refreshed integrity digest. Pinning
          # this CI job to the immutable tag (rather than the moving
          # ``main`` branch) gives the byte-exact NIST ACVP
          # reproduction in ``tests/security/test_nist_fips_kat.py``
          # a stable reproducibility anchor.
          AMA_REF: v3.2.0
        run: |
          # Clone and build the native C library explicitly via cmake so the
          # compiled shared objects are available before the Python install.
          # This satisfies INVARIANT-7 (native HMAC/HKDF/SHA3 backends required)
          # which is enforced by ama_cryptography.crypto_api at import time.
          git clone --branch "${AMA_REF}" --depth 1 \
            https://github.com/Steel-SecAdv-LLC/AMA-Cryptography.git /tmp/ama-cryptography
          cd /tmp/ama-cryptography
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAMA_USE_NATIVE_PQC=ON \
            -DAMA_BUILD_SHARED=ON \
            -DAMA_BUILD_STATIC=ON \
            -DAMA_BUILD_TESTS=OFF \
            -DAMA_BUILD_EXAMPLES=OFF
          cmake --build build -j "$(nproc)"

      - name: Install AMA Cryptography Python package
        run: |
          # Install the Python package against the prebuilt native library.
          # ``AMA_NO_CYTHON=1`` skips the optional Cython binding compilation
          # because it is independent of the native C library and currently
          # has an upstream syntax issue in ed25519_binding.pyx. The Python
          # API loads ``libama_cryptography.so`` directly via ctypes/cffi at
          # runtime, so the native HMAC/HKDF/SHA3 backends remain wired up
          # and INVARIANT-7 is satisfied.
          cd /tmp/ama-cryptography
          AMA_NO_CYTHON=1 pip install --no-build-isolation .
          # Surface the freshly built shared library on the loader search path
          # so the ``ama_cryptography`` Python module can find it at import.
          {
            echo "LD_LIBRARY_PATH=/tmp/ama-cryptography/build/lib:/tmp/ama-cryptography/build:${LD_LIBRARY_PATH:-}"
            echo "AMA_NO_CYTHON=1"
          } >> "$GITHUB_ENV"

      - name: Verify backend hierarchy
        run: |
          python -c "
          from omni_mercury_engine.security.pqc_backends import get_active_backend
          backend = get_active_backend()
          print(f'Active PQC backend: {backend.value}')
          print(f'SUCCESS: Using AMA Cryptography as sole PQC backend')
          "

      - name: Assert Mercury Agent sees the real AMA Cryptography backend
        # Now that the previous step actually builds + installs the native
        # C library, the integration adapter MUST report the real backend.
        # If this assertion fails, something has regressed — either the
        # build broke or the import contract drifted. Fail loudly rather
        # than silently degrading to stub PQC.
        run: |
          python -c "
          from omni_mercury_engine.integrations.mercury_amacrypto import (
              _PQC_BACKEND_SOURCE,
              AMA_CRYPTOGRAPHY_AVAILABLE,
              DILITHIUM_AVAILABLE,
              KYBER_AVAILABLE,
          )
          print(f'_PQC_BACKEND_SOURCE = {_PQC_BACKEND_SOURCE!r}')
          print(f'AMA_CRYPTOGRAPHY_AVAILABLE = {AMA_CRYPTOGRAPHY_AVAILABLE}')
          print(f'DILITHIUM_AVAILABLE = {DILITHIUM_AVAILABLE}')
          print(f'KYBER_AVAILABLE = {KYBER_AVAILABLE}')
          assert _PQC_BACKEND_SOURCE == 'ama_cryptography', (
              f'Expected backend source ama_cryptography, got {_PQC_BACKEND_SOURCE!r} — '
              'CMake build / pip install of ama-cryptography did not succeed'
          )
          assert AMA_CRYPTOGRAPHY_AVAILABLE, 'AMA_CRYPTOGRAPHY_AVAILABLE must be True'
          assert DILITHIUM_AVAILABLE, 'DILITHIUM_AVAILABLE must be True with the native lib'
          assert KYBER_AVAILABLE, 'KYBER_AVAILABLE must be True with the native lib'
          print('OK: Mercury Agent is running against the real ama_cryptography backend.')
          "

      - name: Run security tests with real PQC requirement
        env:
          AMA_REQUIRE_REAL_PQC: "true"
          MERCURY_PQC_REAL_AMA: "1"
        # Blocking — the previous ``|| echo "Some tests may fail without
        # AMA native C library"`` was a silent escape hatch.  By the time
        # this step runs, the workflow has already:
        #   - cloned and built AMA Cryptography (``v3.2.0`` tag),
        #   - exported ``LD_LIBRARY_PATH`` to the AMA build/lib,
        #   - sanity-checked that ``DILITHIUM_AVAILABLE``, ``SPHINCS_AVAILABLE``
        #     and ``KYBER_AVAILABLE`` are all ``True`` against the real
        #     backend (see the previous step).
        # If the security suite still fails after all of that, the failure
        # is real and the gate must trip.
        run: |
          pytest tests/security/ -v --tb=short

      - name: Run AMA Cryptography Known-Answer Tests (KAT)
        # Phase 2 audit cure.  The KAT suites pin:
        #   - Ed25519 RFC 8032 §7.1 vectors (always run)
        #   - ML-DSA-65 / Kyber-1024 / SPHINCS+ round-trip
        #   - Deterministic-seed reproducibility for ML-DSA signing
        #   - NIST FIPS 203/204/205 ACVP-Server reference vectors
        #     (bit-for-bit sigGen, decapsulation checks)
        # A regression in any KAT is a build-time failure.
        run: |
          pytest tests/security/test_ama_kat.py tests/security/test_nist_fips_kat.py -v --tb=short

      - name: Publish PQC coverage number for the README badge
        # Generates the coverage figure cited in the README PQC section
        # so the published number is measured-and-published evidence
        # rather than "unaudited" framing. Coverage is scoped to the
        # crypto*.py + pqc*.py surface via a dedicated ``.coveragerc``
        # written inline below.
        #
        # We deliberately invoke ``coverage run -m pytest`` rather than
        # ``pytest --cov`` because pytest-cov 7.x + numpy 2.x together
        # race on numpy's "cannot load module more than once per
        # process" guard when pytest-cov pre-imports the configured
        # source modules during ``pytest_configure`` while
        # ``tests/conftest.py`` is also importing numpy at collection
        # time. ``coverage run`` initialises tracing before pytest is
        # imported, which avoids the pre-import path entirely.
        #
        # The config uses ``source = src/omni_mercury_engine/security``
        # (directory) plus ``include = .../crypto_api.py``,
        # ``.../pqc_backends.py``, ``.../pqc_guards.py`` to scope the
        # report to the three crypto modules without tripping
        # coverage's "module-not-imported" path-resolution mismatch
        # that ``source = <dotted-module>`` produces under editable
        # installs (the ``pip install -e`` package import maps to
        # ``src/`` paths in ``__file__`` but coverage's source resolver
        # only resolves dotted names against ``site-packages``).
        run: |
          {
            printf '[run]\n'
            printf 'source =\n'
            printf '    src/omni_mercury_engine/security\n'
            printf 'branch = true\n'
            printf '\n'
            printf '[report]\n'
            printf 'precision = 2\n'
            printf 'show_missing = true\n'
            printf 'fail_under = 0\n'
            printf 'include =\n'
            printf '    src/omni_mercury_engine/security/crypto_api.py\n'
            printf '    src/omni_mercury_engine/security/pqc_backends.py\n'
            printf '    src/omni_mercury_engine/security/pqc_guards.py\n'
          } > /tmp/pqc-coveragerc
          coverage erase --rcfile=/tmp/pqc-coveragerc
          coverage run --rcfile=/tmp/pqc-coveragerc -m pytest \
            tests/security/test_ama_kat.py \
            tests/security/test_nist_fips_kat.py \
            tests/security/test_crypto_api.py \
            -q
          coverage report --rcfile=/tmp/pqc-coveragerc
          coverage xml --rcfile=/tmp/pqc-coveragerc -o pqc-coverage.xml

      - name: Upload PQC coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: pqc-coverage
          path: pqc-coverage.xml
          if-no-files-found: warn

      - name: Verify PQC production readiness
        run: |
          python -c "
          import sys
          try:
              from omni_mercury_engine.security.pqc_guards import check_pqc_production_readiness
              from omni_mercury_engine.security.pqc_backends import get_active_backend, PQCBackend

              # Check backend hierarchy
              backend = get_active_backend()
              print(f'Active PQC backend: {backend.value}')

              # Check production readiness
              results = check_pqc_production_readiness()
              print(f'Backend details: {results}')

              if results.get('ama_cryptography'):
                  print('SUCCESS: Using AMA Cryptography — all PQC algorithms supported')
              else:
                  print('WARNING: AMA Cryptography native C library not built')
                  print('This is acceptable for CI testing but NOT for production deployments')
                  print('Production deployments MUST install: pip install ama-cryptography')

              # CI passes regardless - production enforcement is in assert_no_simulation_in_production()
              sys.exit(0)
          except ImportError as e:
              print(f'PQC guards not available: {e}')
              sys.exit(1)  # Fail CI if PQC module not available
          "
