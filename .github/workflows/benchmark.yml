# Mercury-Agent Benchmark CI/CD Pipeline
# Gates on mercury_benchmark.py (Mercury detector in isolation); empirical runs as comparison only
# Copyright (C) 2025 Steel Security Advisors LLC

name: Benchmark Pipeline

# Permissions required for PR comments, artifact uploads, and (on main only)
# auto-committing the latest benchmark JSON + README "Latest Benchmark Results"
# block back to the repository so the most recent live-data run is permanent
# instead of expiring with the 90-day artifact retention.
permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    # Push trigger is ``main``-only by design.
    #
    # The ``main`` branch runs unfiltered so every merge into main
    # refreshes the README "Latest Benchmark Results" block via the
    # persistence steps below.  An earlier ``paths:`` filter on main
    # (only ``benchmarks/**`` or ``src/omni_mercury_engine/**``) made
    # docs-only merges never trigger a refresh, leaving the README
    # stuck on ``_pending first auto-commit_``.  The cost on main is
    # acceptable because the persistence steps actually publish new
    # numbers.
    #
    # ``develop`` is intentionally absent: the persistence steps are
    # all gated to ``refs/heads/main``, so a develop push would burn
    # 30-120 minutes of CI without producing any published artefact.
    # Develop branches are still validated through the
    # ``pull_request`` trigger below when they open a PR into ``main``
    # or ``develop``.
    branches: [main]
  pull_request:
    # No path filter: every PR runs the regression gate so we never miss
    # a regression introduced by docs/config/CI changes that touch the
    # data path indirectly.  Per project policy: benchmark every PR.
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include_time_series:
        description: 'Include time-series datasets (SMD, SMAP, MSL, SWaT)'
        required: false
        default: 'true'
        type: boolean
      include_sota:
        description: 'Include SOTA models (TranAD, MAAT)'
        required: false
        default: 'true'
        type: boolean
      n_folds:
        description: 'Number of K-fold cross-validation folds'
        required: false
        default: '5'
        type: string
  schedule:
    # Weekly benchmark runs on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

env:
  PYTHON_VERSION: "3.12"
  PIP_CACHE_DIR: ~/.cache/pip
  # Coarse headline backstop floors - fail CI if the genuine-label headline
  # falls below these. Honest post-de-leak baseline (e9feeec, #261): mean
  # AUC 0.8259, mean F1 0.6046 (genuine labels only; see
  # docs/ANOMALY_REGRESSION_WS_A.md). AUC floor 0.75 keeps a ~9% margin under
  # 0.8259 (AUC is stable enough across runs to hold a tight floor). F1 floor
  # is held at 0.55 (~9% margin) NOT 0.60: the headline F1 (0.6046) averages
  # over whichever genuine datasets load that run, so a 0.60 floor would flap
  # on normal load-availability variance. Fine-grained, tight regression
  # protection is the deterministic per-dataset guard
  # (anomaly_regression_guard.py), not these coarse floors.
  MIN_ROC_AUC: "0.75"
  MIN_F1: "0.55"
  # Prevent silent synthetic data fallbacks in CI
  MERCURY_ALLOW_SYNTHETIC: "false"
  # CI-optimized benchmark settings to stay under 120 min timeout
  # Reduce sample sizes for faster CI runs without sacrificing statistical validity
  MERCURY_CI_MODE: "true"
  MERCURY_CI_SAMPLES: "1500"
  MERCURY_CI_FOLDS: "3"
  MERCURY_SMD_MACHINES: "5"

jobs:
  # ===========================================================================
  # Benchmark Suite
  # ===========================================================================
  benchmark:
    name: Run Mercury Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Defence-in-depth self-trigger guard.  GitHub already honours
    # ``[skip ci]`` in commit messages (see the auto-commit step at the
    # bottom of this file), but `paths`-filtered ``push`` triggers can
    # still race the skip-token check, so we additionally refuse to run
    # when the head commit was written by *this* workflow.  Both
    # markers — ``[skip benchmark]`` and the
    # ``ci(benchmark): persist latest run`` subject prefix — are
    # produced exclusively by the auto-commit step below.
    if: >-
      github.event_name != 'push' ||
      (
        !contains(github.event.head_commit.message, '[skip benchmark]') &&
        !startsWith(github.event.head_commit.message, 'ci(benchmark): persist latest run')
      )

    steps:
      - name: Checkout code (attempt 1)
        id: checkout
        continue-on-error: true
        uses: actions/checkout@v6.0.2

      - name: Pause before checkout retry 1 (transient flake stabilisation)
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6.0.2 attempt 1 failed (likely transient token-injection flake on GitHub-hosted runner). Sleeping 15s before retry."
          sleep 15

      - name: Checkout code (attempt 2, runs only on attempt-1 failure)
        id: checkout2
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        uses: actions/checkout@v6.0.2

      - name: Pause before checkout retry 2 (extended backoff)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::actions/checkout@v6.0.2 attempts 1 and 2 both failed. Sleeping 60s before final retry."
          sleep 60

      - name: Checkout code (attempt 3, final; runs only on attempts 1+2 failure)
        if: steps.checkout.outcome == 'failure' && steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v6.0.2

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' 'temurin-.*' 'ghc.*' 'mysql.*' 'postgresql.*' || true
          sudo apt-get autoremove -y
          docker system prune -af --volumes || true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-benchmark-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-benchmark-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[all,dev]"
          pip install pytest pytest-cov

      - name: Build + install AMA Cryptography (native PQC backend)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v3.2.0

      - name: Label-provenance leak gate (WS-A, repo-wide)
        # Canonical circular-label detector. Fails if any dataset loader
        # manufactures anomaly labels (feature threshold / synthetic) yet is
        # counted as genuine in the supervised headline -- the exact leak class
        # PR #255/#262 de-leaked. Closes the silent base-class default
        # (LABEL_SOURCE="ground_truth") so no future PR can reintroduce a
        # circular dataset. Context: docs/ANOMALY_REGRESSION_WS_A.md.
        env:
          AMA_REQUIRE_REAL_PQC: "true"
        run: |
          python -m omni_mercury_engine.datasets.label_provenance --check

      - name: Anomaly regression guard (fast deterministic gate, WS-A)
        # Per-dataset metric floors on a fixed genuine-label ADBench subset
        # (seed 42), pinned in benchmarks/anomaly_regression_baseline.json.
        # Fails fast (~20s) on a real detector regression before the heavy run.
        # Context: docs/ANOMALY_REGRESSION_WS_A.md (the #261 "drop" was the
        # #255 eval-honesty de-leak, not a detector regression).
        env:
          AMA_REQUIRE_REAL_PQC: "true"
        run: |
          python benchmarks/anomaly_regression_guard.py --check

      - name: Run mercury benchmark (gating)
        id: benchmark
        env:
          AMA_REQUIRE_REAL_PQC: "true"
        run: |
          python benchmarks/mercury_benchmark.py

          python -c "
          import json, sys, os

          with open('benchmarks/mercury_benchmark_results.json') as f:
              data = json.load(f)

          mean_auc = data['summary']['mean_auc']
          mean_f1 = data['summary']['mean_oracle_f1']
          n_success = data['summary']['successful']

          print(f'Datasets: {n_success} successful')
          print(f'Mean ROC-AUC: {mean_auc:.4f}')
          print(f'Mean Oracle F1: {mean_f1:.4f}')

          # Write metrics to GitHub output
          github_output = os.environ.get('GITHUB_OUTPUT', '/dev/null')
          with open(github_output, 'a') as f:
              f.write(f'roc_auc={mean_auc:.4f}\n')
              f.write(f'f1={mean_f1:.4f}\n')

          # Check thresholds — fail CI on regression
          min_roc_auc = float('${{ env.MIN_ROC_AUC }}')
          min_f1 = float('${{ env.MIN_F1 }}')

          failed = False
          if mean_auc < min_roc_auc:
              print(f'REGRESSION: ROC-AUC {mean_auc:.4f} below threshold {min_roc_auc}')
              failed = True
          if mean_f1 < min_f1:
              print(f'REGRESSION: F1 {mean_f1:.4f} below threshold {min_f1}')
              failed = True

          if failed:
              sys.exit(1)
          else:
              print('All regression gates passed.')
          "

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmarks/mercury_benchmark_results.json
          retention-days: 90

      # ---------------------------------------------------------------
      # Persist the latest mercury run + regenerated README block to
      # ``main`` via a PR with API-signed commits.
      #
      # Why a PR (not direct push):  ``main``'s branch protection
      # ruleset rejects direct pushes from ``github-actions[bot]`` for
      # four reasons (1) PR-required, (2) 22 status checks expected,
      # (3) CodeQL must finish, (4) commits must be verified-signed.
      # ``scripts/persist_benchmark_to_pr.py`` uses the GitHub Git
      # Database API to commit on a feature branch.  Rule 4 is
      # satisfied externally: GitHub auto-signs commits made via the
      # Git Database API on behalf of ``github-actions[bot]`` with
      # its web-flow signing key, **only when the call is
      # authenticated with the workflow's own ``GITHUB_TOKEN``** (or
      # a GitHub App installation token allowed to act as the bot).
      # A PR is opened against ``main`` (rule 1 satisfied); status
      # checks (rule 2 / 3) run on the PR.
      #
      # Caveat:  PRs whose head was pushed by the default
      # ``GITHUB_TOKEN`` do NOT trigger downstream workflows by
      # design (GitHub's loop-prevention).  The PR therefore lands
      # with all required checks pending; a maintainer must re-run
      # the CI workflow on the PR head (or push an empty commit on
      # the persistence branch) to unblock them.
      #
      # Do NOT swap ``GITHUB_TOKEN`` for a Personal Access Token
      # to break the loop-prevention.  The persister does not submit
      # a detached commit signature, so PAT-authenticated Git
      # Database commits land ``Unverified`` and fail rule 4 of the
      # protection ruleset.  The persister steps below export
      # ``GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}`` unconditionally
      # for that reason.  An earlier iteration of this file used a
      # ``secrets.BENCHMARK_BOT_TOKEN || secrets.GITHUB_TOKEN``
      # expression to leave room for a future GitHub App installation
      # token, but the expression cannot distinguish a PAT from an
      # App token by inspecting the secret name — so the fallback
      # was removed.  Wiring an installation token in the future
      # requires a separately named secret (e.g.
      # ``BENCHMARK_BOT_APP_TOKEN``) and is a focused-PR job.
      #
      # Order matters: this step runs immediately after the gating
      # mercury benchmark + artifact upload, BEFORE the supplementary
      # empirical and seven-axis steps.  That way the README block
      # reflects the gating mercury numbers in a focused single PR.
      #
      # Pull-request runs are intentionally skipped: PRs from forks
      # cannot push, and even from the same repo we want the merged
      # commit (not a transient PR head) to be the source of truth.
      # ---------------------------------------------------------------
      # Persistence steps below only run when the workflow is anchored
      # to ``refs/heads/main`` — for ``push`` events that is enforced by
      # ``github.ref``, for ``workflow_dispatch`` and ``schedule`` we
      # additionally check it explicitly.  Without that guard, manually
      # dispatching this workflow from ``develop`` or a feature branch
      # would benchmark *that* ref and then open a
      # ``ci/benchmark-results -> main`` PR containing non-main numbers,
      # silently rewriting ``main``'s headline benchmark block from a
      # different code state than ``main`` actually carries.
      - name: Update README "Latest Benchmark Results" block
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          python scripts/update_readme_benchmarks.py \
            --results benchmarks/mercury_benchmark_results.json \
            --readme README.md \
            --commit-sha "${{ github.sha }}"

      - name: Open PR with mercury results + README block (API-signed)
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          # Use the workflow's GITHUB_TOKEN unconditionally so commits made
          # via the Git Database API are auto-signed by GitHub's web-flow
          # signing key on behalf of github-actions[bot].  A previous
          # iteration of this file used ``secrets.BENCHMARK_BOT_TOKEN ||
          # secrets.GITHUB_TOKEN``, but that expression cannot distinguish
          # a GitHub App installation token from a Personal Access Token
          # — and a PAT in BENCHMARK_BOT_TOKEN would produce *unverified*
          # commits that fail rule 4 of the protection ruleset.  Wiring
          # an installation token requires a separate well-named secret
          # (e.g. BENCHMARK_BOT_APP_TOKEN) and should be done in a
          # focused PR, not as a silent fallback here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mean_auc=$(python -c "import json; print(f\"{json.load(open('benchmarks/mercury_benchmark_results.json'))['summary']['mean_auc']:.4f}\")")
          mean_f1=$(python -c "import json; print(f\"{json.load(open('benchmarks/mercury_benchmark_results.json'))['summary']['mean_oracle_f1']:.4f}\")")

          python scripts/persist_benchmark_to_pr.py \
            --base main \
            --branch ci/benchmark-results \
            --commit-message "ci(benchmark): persist latest run (AUC=${mean_auc}, F1=${mean_f1}) [skip benchmark]" \
            --pr-title "ci(benchmark): auto-update Latest Benchmark Results (AUC=${mean_auc}, F1=${mean_f1})" \
            --pr-body "Auto-generated by .github/workflows/benchmark.yml from ${GITHUB_SHA}.

          Mercury benchmark mean ROC-AUC: **${mean_auc}**
          Mercury benchmark mean Oracle F1: **${mean_f1}**

          See \`benchmarks/mercury_benchmark_results.json\` for the full
          per-dataset breakdown and \`README.md\` for the rendered
          \"Latest Benchmark Results\" block.

          Required status checks are triggered automatically by the
          *Re-trigger required checks* step below, which dispatches the
          CI workflow against this branch via \`workflow_dispatch\`.
          Unlike \`push\`/\`pull_request\` events, \`workflow_dispatch\`
          events **are** delivered even when created by the default
          \`GITHUB_TOKEN\`, so the checks run and post to this head SHA
          without needing a Personal Access Token.  (A PAT is still
          undesirable here: \`scripts/persist_benchmark_to_pr.py\` relies
          on GitHub auto-signing Git Database commits as
          \`github-actions[bot]\`; PAT commits land \`Unverified\` and
          fail the protection ruleset.)  If the dispatch step is skipped,
          re-run CI manually against this branch.

          [skip ci]" \
            --files benchmarks/mercury_benchmark_results.json README.md

      - name: Re-trigger required checks on the benchmark PR (workflow_dispatch)
        # ROOT CAUSE FIX for PRs like #261 that sit forever with pending
        # checks: GitHub does not run workflows for push/pull_request events
        # created by the default GITHUB_TOKEN (loop-prevention).  But
        # workflow_dispatch and repository_dispatch are explicit exceptions —
        # they fire even from GITHUB_TOKEN.  Dispatching ci.yml against the
        # benchmark branch runs the required jobs on this branch's head SHA,
        # which is what branch protection evaluates, so the PR becomes
        # mergeable without a PAT.  Requires ci.yml to expose
        # ``on: workflow_dispatch`` (it does) and its required-check jobs to
        # run on that event.
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Give the just-created branch a moment to be visible to the API.
          for attempt in 1 2 3; do
            if gh workflow run ci.yml --ref ci/benchmark-results; then
              echo "Dispatched ci.yml against ci/benchmark-results."
              exit 0
            fi
            echo "dispatch attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          # Fallback to the raw REST dispatch endpoint.
          gh api -X POST \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
            -f ref=ci/benchmark-results

      # Empirical comparison baselines run on schedule / workflow_dispatch.
      # The previous `continue-on-error: true` swallowed failures from
      # broken external data loaders.  The runner is invoked under a
      # strict policy: it MUST succeed on the reproducible-loader subset
      # (MERCURY_ALLOW_SYNTHETIC=false above already prevents synthetic
      # fallbacks).  Failures here are real regressions and gate the
      # workflow as a whole — but they no longer block the mercury
      # auto-commit above, which has already run by this point.
      - name: Run empirical benchmarks (comparison)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cd benchmarks
          python -c "
          import sys
          sys.path.insert(0, '..')
          from benchmarks.empirical_benchmark import run_full_benchmark, save_results

          results = run_full_benchmark(
              use_kfold=True,
              n_folds=3,
              include_time_series=False,
              include_sota=False,
          )
          save_results(results, 'empirical_benchmark_results.json')
          print('Empirical benchmark complete.')
          "

      - name: Upload empirical results (comparison)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: empirical-results-${{ github.sha }}
          path: benchmarks/empirical_benchmark_results.json
          retention-days: 90

      # Seven-axis evaluation matrix (Generalization, Scalability, Data
      # Efficiency, Reasoning, Robustness, Transferability, Interpretability).
      # Deterministic for a fixed seed on every axis except Scalability,
      # which inherently measures wall-clock. The runner emits a JSON
      # report which is uploaded as a CI artifact; the corresponding
      # markdown section in docs/BENCHMARKS.md is regenerated locally
      # by contributors via `--regenerate-docs` (the markers
      # ## Seven-Axis Evaluation Matrix … <!-- end seven-axis-section -->
      # guarantee the section was produced by the runner, not hand-edited).
      - name: Run seven-axis evaluation matrix
        run: |
          python -m benchmarks.seven_axis_runner \
            --json benchmarks/seven_axis_results.json

      - name: Upload seven-axis results
        uses: actions/upload-artifact@v7
        with:
          name: seven-axis-results-${{ github.sha }}
          path: benchmarks/seven_axis_results.json
          retention-days: 90

      # Follow-up PR / branch update for seven-axis JSON.  Runs only
      # on push-main / schedule / workflow_dispatch (same gate as the
      # mercury PR step above) AND only if the seven-axis JSON was
      # actually produced; if the seven-axis runner crashed the
      # mercury PR will already exist via the earlier step.  Re-uses
      # the same ``ci/benchmark-results`` branch — the API persister
      # script force-updates the branch ref, so the existing PR
      # picks up the seven-axis file as a follow-up commit on the
      # same head SHA without opening a second PR.
      - name: Add seven-axis results to benchmark PR (API-signed)
        if: |
          always() && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'schedule' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
          )
        env:
          # Use the workflow's GITHUB_TOKEN unconditionally so commits made
          # via the Git Database API are auto-signed by GitHub's web-flow
          # signing key on behalf of github-actions[bot].  A previous
          # iteration of this file used ``secrets.BENCHMARK_BOT_TOKEN ||
          # secrets.GITHUB_TOKEN``, but that expression cannot distinguish
          # a GitHub App installation token from a Personal Access Token
          # — and a PAT in BENCHMARK_BOT_TOKEN would produce *unverified*
          # commits that fail rule 4 of the protection ruleset.  Wiring
          # an installation token requires a separate well-named secret
          # (e.g. BENCHMARK_BOT_APP_TOKEN) and should be done in a
          # focused PR, not as a silent fallback here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ ! -f benchmarks/seven_axis_results.json ]; then
            echo "Seven-axis JSON not produced this run; nothing to add."
            exit 0
          fi

          # ``--no-pr-metadata-update`` is critical here: the earlier
          # "Open PR with mercury results" step already set a metric-rich
          # title (with AUC/F1) and a body containing CI-unblock
          # instructions.  Without this flag, the persister would PATCH
          # the PR title/body to the generic seven-axis text below,
          # erasing the metrics on every successful run.  We only want
          # this step to *append a commit* to the existing PR.
          python scripts/persist_benchmark_to_pr.py \
            --base main \
            --branch ci/benchmark-results \
            --commit-message "ci(benchmark): add seven-axis results [skip benchmark]" \
            --pr-title "ci(benchmark): auto-update Latest Benchmark Results" \
            --pr-body "Seven-axis JSON appended by .github/workflows/benchmark.yml from ${GITHUB_SHA}." \
            --no-pr-metadata-update \
            --files \
              benchmarks/mercury_benchmark_results.json \
              benchmarks/seven_axis_results.json \
              README.md

  # ===========================================================================
  # Performance Regression Check
  # ===========================================================================
  regression-check:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: [benchmark]
    if: github.event_name == 'pull_request'

    steps:
      - name: Download current benchmark results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.sha }}
          path: current

      - name: Check for performance regression
        run: |
          python -c "
          import json
          import sys

          with open('current/mercury_benchmark_results.json') as f:
              data = json.load(f)

          mean_auc = data['summary']['mean_auc']
          mean_f1 = data['summary']['mean_oracle_f1']

          min_roc_auc = float('${{ env.MIN_ROC_AUC }}')
          min_f1 = float('${{ env.MIN_F1 }}')

          print(f'Current ROC-AUC: {mean_auc:.4f} (threshold: {min_roc_auc})')
          print(f'Current F1: {mean_f1:.4f} (threshold: {min_f1})')

          regression = False
          if mean_auc < min_roc_auc:
              print(f'REGRESSION: ROC-AUC below threshold')
              regression = True
          if mean_f1 < min_f1:
              print(f'REGRESSION: F1 below threshold')
              regression = True

          if regression:
              print('Performance regression detected!')
              sys.exit(1)
          else:
              print('No performance regression detected')
          "

  # ===========================================================================
  # Benchmark Success Gate
  # ===========================================================================
  benchmark-success:
    name: Benchmark Success
    runs-on: ubuntu-latest
    needs: [benchmark]
    if: always()

    steps:
      - name: Check benchmark status
        run: |
          if [[ "${{ needs.benchmark.result }}" == "failure" ]]; then
            echo "Benchmark pipeline failed"
            exit 1
          fi
          echo "Benchmark pipeline succeeded"
