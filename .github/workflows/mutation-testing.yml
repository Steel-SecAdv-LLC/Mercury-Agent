# Mercury-Agent Sigma-Immutable Mutation Gate (ROADMAP row 8)
# Mutates security/sigma_immutable_gate.py + sigma_immutable_corpus.py one
# operator at a time and fails CI when the sigma-focused test subset cannot
# kill enough mutants. A surviving mutant is a change to the ethical-gate
# hot path that the suite cannot detect — the exact silent-weakening class
# the sigma_Immutable contract must be immune to.
# Copyright (C) 2025 Steel Security Advisors LLC

name: Sigma-Immutable Mutation Gate

permissions:
  contents: read

concurrency:
  group: mutation-testing-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # cancel-in-progress is FALSE (was true-on-PR): a full mutation run is
  # ~minutes of parallel work, and cancelling it on every push meant the
  # blocking gate never reached a verdict on an actively-pushed PR (it was
  # cancelled on #348's original head every time). Let each run finish; a
  # superseded run's verdict is still recorded against its commit.
  cancel-in-progress: false

on:
  # Runs on EVERY PR to main/develop (no path filter): the cheap sample lane
  # below catches an assertion regression immediately even when the change is
  # indirect (a test refactor that weakens sigma coverage without touching the
  # gate source). The exhaustive lane still runs when the hot path itself
  # changes, and weekly.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC.
    - cron: "0 4 * * 1"

env:
  PYTHON_VERSION: "3.12"
  # Fail closed: the sigma discrimination tests exercise the trained
  # classifier, which requires the ML extra.
  MERCURY_REQUIRES_ML: "1"
  AMA_REQUIRE_REAL_PQC: "true"

jobs:
  changes:
    name: Detect sigma hot-path changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hotpath: ${{ steps.detect.outputs.hotpath }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect whether the mutated surface or gate changed
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Non-PR events (schedule / manual dispatch) always take the full lane.
          if [ "$EVENT" != "pull_request" ]; then
            echo "hotpath=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT): full mutation lane."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          echo "changed files:"; echo "$changed"
          # The mutated surface, the harness, the gate's own tests, and this
          # workflow. A change to any of these takes the exhaustive lane.
          if echo "$changed" | grep -qE '^(src/omni_mercury_engine/security/sigma_immutable_(gate|corpus)\.py|scripts/run_sigma_mutation_gate\.py|tests/scripts/test_run_sigma_mutation_gate\.py|tests/security/test_sigma_immutable_[a-z_]+\.py|tests/test_sigma_immutable_discrimination\.py|\.github/workflows/mutation-testing\.yml)$'; then
            echo "hotpath=true" >> "$GITHUB_OUTPUT"
            echo "sigma hot path changed: full mutation lane."
          else
            echo "hotpath=false" >> "$GITHUB_OUTPUT"
            echo "sigma hot path unchanged: cheap sample lane."
          fi

  mutation-sample:
    name: Sigma mutation cheap sample (every PR)
    needs: changes
    # Every PR that does NOT touch the hot path gets a bounded, parallel
    # sample so an assertion regression is caught immediately. Hot-path PRs go
    # straight to the exhaustive lane below instead (no redundant run).
    if: github.event_name == 'pull_request' && needs.changes.outputs.hotpath == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mercury [ml] + test tooling
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"
          pip install pytest pytest-asyncio pytest-timeout hypothesis

      - name: Build AMA Cryptography (native PQC)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      - name: Mutation-harness unit tests
        run: pytest tests/scripts/test_run_sigma_mutation_gate.py -q

      # Bounded + parallel: 24 stride-sampled mutants across 4 workers keeps
      # this well under the job timeout (structural bound, not a tuned
      # per-mutant budget). The floor is the same 90 the full lane enforces —
      # a sampled regression that drops the kill rate still fails the PR.
      - name: Sigma-Immutable mutation sample
        run: |
          python scripts/run_sigma_mutation_gate.py \
            --max-mutants 24 \
            --jobs 4 \
            --fail-under 90 \
            --report mutation_sample_report.json

      - name: Upload mutation sample report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sigma-mutation-sample-report
          path: mutation_sample_report.json
          if-no-files-found: ignore

  mutation-gate-full:
    name: Sigma hot-path mutation kill-rate floor
    needs: changes
    # Exhaustive run: on schedule / manual dispatch, and on any PR that touches
    # the hot path. Parallel workers keep the full ~120-mutant run to minutes.
    if: github.event_name != 'pull_request' || needs.changes.outputs.hotpath == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Mercury [ml] + test tooling
        run: |
          python -m pip install --upgrade "pip>=26.1"
          pip install -e ".[ml]"
          pip install pytest pytest-asyncio pytest-timeout hypothesis

      # AMA Cryptography is the mandatory PQC backend; the package fails
      # closed at import without it, and every mutant test run imports the
      # package, so the native backend must exist before the gate starts.
      - name: Build AMA Cryptography (native PQC)
        uses: ./.github/actions/build-ama-cryptography
        with:
          ama-ref: v4.0.0

      # Fast: pins the harness's own semantics (enumeration determinism,
      # byte-exact restoration, red-baseline abort, kill/survive
      # classification, parallel-vs-serial agreement) against a fixture module
      # before trusting its verdict on the real hot path.
      - name: Mutation-harness unit tests
        run: pytest tests/scripts/test_run_sigma_mutation_gate.py -q

      # The real measurement: every enumerated mutant of the sigma hot path
      # runs against the sigma-focused test subset, across 4 parallel workers
      # (isolated repo copy each). Floor calibration (2026-07-21, local, native
      # AMA v4.0.0): 119/120 mutants killed — 99.2% — after the two *_semantics
      # suites landed (the first honest measurement with the interface-level
      # subset alone was 9.7%). The single survivor is the exc_info=True flip
      # inside a diagnostic logger.warning (log verbosity, zero behavioral
      # effect), documented in docs/MAINT1_2_COVERAGE_REMEDIATION.md §3. The
      # floor sits at 90 so legitimate new mutation sites and environment
      # variance don't flake the lane while any real weakening (several new
      # survivors) fails it. Raising the floor requires a fresh measured
      # justification; lowering it is a gate-weakening change.
      - name: Sigma-Immutable mutation gate
        run: |
          python scripts/run_sigma_mutation_gate.py \
            --jobs 4 \
            --fail-under 90 \
            --report mutation_report.json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sigma-mutation-report
          path: mutation_report.json
          if-no-files-found: ignore
