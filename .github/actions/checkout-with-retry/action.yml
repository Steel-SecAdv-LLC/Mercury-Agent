# Mercury Agent — checkout-with-retry composite action.
#
# Wraps ``actions/checkout@v6`` with one automatic retry to harden CI
# against a recurring GitHub-hosted-runner failure mode where the
# action's internal token-injection step intermittently fails with
# ``fatal: could not read Username for 'https://github.com': terminal
# prompts disabled``.  The failure is observable from
# ``actions/checkout``'s own progress log: the ``git init`` succeeds,
# but the subsequent ``Setting up auth`` / ``git -c http.extraheader=...
# fetch`` either cannot resolve the GITHUB_TOKEN that the runner is
# supposed to inject, or hits a transient credential-helper race on
# the freshly-provisioned runner volume.  ``actions/checkout`` already
# retries internally three times -- so when all three retries fail
# back-to-back the cause is on the GitHub Actions infrastructure side,
# not the workflow's.
#
# Rather than wait for GitHub to fix the upstream issue (or invoke a
# manual rerun from the UI, which Devin's session token cannot
# trigger), this composite gives every checkout call site a deterministic
# second chance with a 15 s pause to let the runner's credential
# pipeline stabilise.  If the first attempt succeeds, the retry step
# is skipped (zero added latency on the happy path).  If both attempts
# fail, the job fails as it would have before -- this is NOT a
# silent-success workaround.
#
# This composite is *not* a third-party action; it lives in the repo
# under ``.github/actions/checkout-with-retry/``.  Every input is
# forwarded verbatim to ``actions/checkout@v6`` so callers can swap
# ``uses: actions/checkout@v6`` for ``uses: ./.github/actions/checkout-with-retry``
# with no behavioural drift on success.
#
# Inputs mirror the upstream ``actions/checkout@v6`` surface (only the
# subset the workflows in this repo actually use is declared
# explicitly -- additional inputs can be plumbed through as needed).

name: "Checkout with retry"
description: >
  ``actions/checkout@v6`` wrapped with one automatic retry on
  transient token-injection failures (the recurring "could not read
  Username for 'https://github.com'" flake observed on GitHub-hosted
  runners).  Forwards every input verbatim to the upstream action.

inputs:
  repository:
    description: "Repository name with owner.  Forwarded to actions/checkout."
    required: false
    default: ${{ github.repository }}
  ref:
    description: "Branch, tag or SHA to checkout.  Forwarded to actions/checkout."
    required: false
    default: ""
  token:
    description: "Auth token for the checkout.  Forwarded to actions/checkout."
    required: false
    default: ${{ github.token }}
  ssh-key:
    description: "SSH key for the checkout.  Forwarded to actions/checkout."
    required: false
    default: ""
  ssh-strict:
    description: "SSH strict host-key checking.  Forwarded to actions/checkout."
    required: false
    default: "true"
  persist-credentials:
    description: "Persist credentials on the runner.  Forwarded to actions/checkout."
    required: false
    default: "true"
  path:
    description: "Relative path under $GITHUB_WORKSPACE to place the repository."
    required: false
    default: ""
  clean:
    description: "Run ``git clean -ffdx``.  Forwarded to actions/checkout."
    required: false
    default: "true"
  fetch-depth:
    description: "Number of commits to fetch (0 = full history).  Forwarded."
    required: false
    default: "1"
  fetch-tags:
    description: "Whether to fetch tags.  Forwarded to actions/checkout."
    required: false
    default: "false"
  lfs:
    description: "Whether to download Git-LFS files.  Forwarded."
    required: false
    default: "false"
  submodules:
    description: "Whether (and how) to checkout submodules.  Forwarded."
    required: false
    default: "false"
  set-safe-directory:
    description: "Add the workspace as a safe directory.  Forwarded."
    required: false
    default: "true"
  sparse-checkout:
    description: "Sparse-checkout pattern list.  Forwarded to actions/checkout."
    required: false
    default: ""
  sparse-checkout-cone-mode:
    description: "Sparse-checkout cone mode.  Forwarded to actions/checkout."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Checkout (attempt 1)
      id: checkout_attempt_1
      # ``continue-on-error: true`` here is the ENTIRE point of the
      # composite: it suppresses a failure from the first attempt so
      # the retry step can fire.  The retry step does NOT carry this
      # flag -- its failure WILL bubble up and fail the job, exactly
      # as a bare ``actions/checkout@v6`` would today.
      continue-on-error: true
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        ssh-key: ${{ inputs.ssh-key }}
        ssh-strict: ${{ inputs.ssh-strict }}
        persist-credentials: ${{ inputs.persist-credentials }}
        path: ${{ inputs.path }}
        clean: ${{ inputs.clean }}
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        lfs: ${{ inputs.lfs }}
        submodules: ${{ inputs.submodules }}
        set-safe-directory: ${{ inputs.set-safe-directory }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}

    - name: Pause before retry (transient flake stabilisation)
      if: steps.checkout_attempt_1.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::actions/checkout@v6 first attempt failed (likely transient token-injection flake on GitHub-hosted runner).  Sleeping 15s before retry."
        sleep 15

    - name: Checkout (attempt 2 -- retry on first-attempt failure only)
      if: steps.checkout_attempt_1.outcome == 'failure'
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        ssh-key: ${{ inputs.ssh-key }}
        ssh-strict: ${{ inputs.ssh-strict }}
        persist-credentials: ${{ inputs.persist-credentials }}
        path: ${{ inputs.path }}
        clean: ${{ inputs.clean }}
        fetch-depth: ${{ inputs.fetch-depth }}
        fetch-tags: ${{ inputs.fetch-tags }}
        lfs: ${{ inputs.lfs }}
        submodules: ${{ inputs.submodules }}
        set-safe-directory: ${{ inputs.set-safe-directory }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        sparse-checkout-cone-mode: ${{ inputs.sparse-checkout-cone-mode }}
