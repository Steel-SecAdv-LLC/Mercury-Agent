name: Build AMA Cryptography
description: >-
  Clone, build, and install the AMA Cryptography native C library + Python
  package at a pinned, immutable tag, then export LD_LIBRARY_PATH /
  AMA_NO_CYTHON so ``ama_cryptography`` loads the real native backend at
  import time. AMA is Mercury's sole PQC backend — there is no soft-stub
  fallback once this action has run; a build failure fails the job loudly
  rather than silently degrading to simulated PQC.

inputs:
  ama-ref:
    description: >-
      AMA Cryptography git tag/ref to build. Pin to an immutable tag (not a
      moving branch) so KAT reproducibility has a stable anchor.
    required: false
    default: v4.0.0

runs:
  using: composite
  steps:
    - name: Install build toolchain for AMA Cryptography native library
      shell: bash
      run: |
        # GitHub-hosted runners preinstall Microsoft apt repositories
        # (packages.microsoft.com: azure-cli + prod) that periodically return
        # 403 / "no longer signed". They are irrelevant here — the AMA native
        # library only needs Ubuntu-archive packages — but while present a
        # Microsoft-side outage makes `apt-get update` exit non-zero and fails
        # the whole job before any test runs. Drop them so the toolchain
        # install depends only on what it uses; a genuine failure to reach the
        # Ubuntu archives or install the packages below still fails loudly.
        sudo grep -rlZ --include='*.list' --include='*.sources' \
          'packages\.microsoft\.com' /etc/apt/sources.list.d/ 2>/dev/null \
          | sudo xargs -0r rm -f || true
        # Bounded retry tolerates a transient archive hiccup without masking a
        # persistent outage (still exits non-zero after the final attempt).
        for attempt in 1 2 3; do
          sudo apt-get update && break
          if [ "${attempt}" -eq 3 ]; then
            echo "apt-get update failed after ${attempt} attempts" >&2
            exit 1
          fi
          echo "apt-get update failed (attempt ${attempt}); retrying in 5s" >&2
          sleep 5
        done
        sudo apt-get install -y --no-install-recommends \
          build-essential gcc-12 g++-12 cmake ninja-build pkg-config

    - name: Install AMA Cryptography PEP 517 build-system floors
      # AMA's ``setup.py`` preflight enforces the supply-chain floors declared
      # in its ``pyproject.toml [build-system].requires``:
      #   setuptools>=78.1.1  — PYSEC-2025-49 + GHSA-cx63-2mw6-8hw5
      #   wheel>=0.47.0       — GHSA-8rrh-rw8j-w5fx
      #   cmake>=4.3.2        — Dependabot supply-chain floor (the PyPI cmake
      #                          shim's ``__version__`` is what setup.py's
      #                          ``_check_cmake_version`` reads; the system
      #                          apt cmake is older and trips the preflight).
      # ``pip install --no-build-isolation`` below skips PEP 517 build-env
      # creation, so these floors must be present in the active environment.
      # ``AMA_NO_CYTHON=1`` short-circuits the Cython/numpy floor, so those
      # are intentionally absent here.
      shell: bash
      run: |
        python -m pip install --upgrade \
          "setuptools>=78.1.1" \
          "wheel>=0.47.0" \
          "cmake>=4.3.2"

    - name: Build AMA Cryptography native C library
      shell: bash
      env:
        AMA_REF: ${{ inputs.ama-ref }}
      run: |
        # Build the native C library explicitly via cmake so the compiled
        # shared objects exist before the Python install. This satisfies
        # INVARIANT-7 (native HMAC/HKDF/SHA3 backends required), enforced by
        # ama_cryptography.crypto_api at import time.
        git clone --branch "${AMA_REF}" --depth 1 \
          https://github.com/Steel-SecAdv-LLC/AMA-Cryptography.git /tmp/ama-cryptography
        cd /tmp/ama-cryptography
        CC=/usr/bin/gcc-12 CXX=/usr/bin/g++-12 cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DAMA_USE_NATIVE_PQC=ON \
          -DAMA_BUILD_SHARED=ON \
          -DAMA_BUILD_STATIC=ON \
          -DAMA_BUILD_TESTS=OFF \
          -DAMA_BUILD_EXAMPLES=OFF
        cmake --build build -j "$(nproc)"

    - name: Install AMA Cryptography Python package
      # ``--no-build-isolation`` links the wheel against the libama_cryptography.so
      # just produced rather than re-running cmake into a transient isolation dir.
      # ``AMA_NO_CYTHON=1`` skips the optional Cython bindings (independent of the
      # native C library; the Python API loads the .so via ctypes/cffi at runtime).
      # LD_LIBRARY_PATH is exported to GITHUB_ENV so the freshly built .so is on
      # the loader search path for every subsequent step in the calling job.
      shell: bash
      run: |
        cd /tmp/ama-cryptography
        AMA_NO_CYTHON=1 pip install --no-build-isolation .
        export AMA_LD_LIBRARY_PATH="/tmp/ama-cryptography/build/lib:/tmp/ama-cryptography/build:${LD_LIBRARY_PATH:-}"
        export LD_LIBRARY_PATH="$AMA_LD_LIBRARY_PATH"
        {
          echo "LD_LIBRARY_PATH=$AMA_LD_LIBRARY_PATH"
          echo "AMA_NO_CYTHON=1"
        } >> "$GITHUB_ENV"
        python - <<'PY'
        from ama_cryptography.pqc_backends import get_pqc_backend_info

        info = get_pqc_backend_info()
        # Match the engine's import-time PQC gate (omni_mercury_engine._pqc_gate
        # ._PQC_HARD_REQUIRED): Mercury exposes ML-DSA + Kyber + SPHINCS+, so a
        # partial (e.g. ML-DSA-only) build must be rejected here too — otherwise
        # this step goes green and the failure resurfaces later as an opaque
        # engine-import error in the calling job.
        required = ("dilithium_available", "kyber_available", "sphincs_available")
        missing = [name for name in required if not info.get(name)]
        if missing:
            raise SystemExit(f"AMA native PQC backend incomplete after install; missing {missing}: {info!r}")
        print("AMA Cryptography native PQC backend verified (ML-DSA-65 + Kyber-1024 + SPHINCS+)")
        PY

    - name: Gate engine import against the native AMA backend
      # The install step above already verifies all three PQC capabilities at the
      # AMA level (ML-DSA-65 + Kyber-1024 + SPHINCS+). This step adds the stronger,
      # end-to-end contract: it actually imports ``omni_mercury_engine``,
      # exercising the package's import-time PQC gate
      # (``omni_mercury_engine._pqc_gate``) against the freshly built backend.
      # That catches what a pure AMA-level capability probe cannot — an
      # engine-side gate regression, or an AMA/engine version skew where the gate
      # reads the ``*_AVAILABLE`` flags from a location the installed AMA no longer
      # populates — surfacing it here at the build seam rather than many minutes
      # later as an opaque pytest-collection / mypy "could not import" error in
      # the calling job.
      #
      # Self-gating: this action is reusable for pure-AMA jobs, so when the
      # engine is not installed (``find_spec`` is None) the gate is skipped
      # rather than forcing the package to be present. LD_LIBRARY_PATH was
      # exported to GITHUB_ENV above, so this step loads the freshly built .so.
      shell: bash
      run: |
        python - <<'PY'
        import importlib
        import importlib.util

        if importlib.util.find_spec("omni_mercury_engine") is None:
            print("omni_mercury_engine not installed in this job — engine-import gate skipped")
        else:
            importlib.import_module("omni_mercury_engine")
            print("omni_mercury_engine imports cleanly against the native AMA backend")
        PY
