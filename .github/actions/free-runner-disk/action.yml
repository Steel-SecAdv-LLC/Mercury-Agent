name: Free runner disk
description: >-
  Remove the toolchains a hosted Ubuntu runner ships and Mercury never uses
  (Android SDK, .NET, Swift, GHC, the CodeQL bundle), then refuse to continue
  when the free space on / is still below a stated floor. Every job that
  installs a torch-bearing extra must run this first: the default PyPI torch
  wheel brings the CUDA libraries, about 3.5 GB of wheels and several GB more
  once installed, and a runner that started with less headroom than usual ran
  out mid-install ("Disk quota exceeded", Security / Dependency Security Scan
  on main at 9bc3cee). tests/test_ci_disk_budget_contract.py enforces the rule
  across every workflow.

inputs:
  deep:
    description: >-
      "true" also purges the large apt packages (dotnet, llvm, temurin, ghc,
      mysql, postgresql) and prunes Docker images and build cache. Slower; for
      jobs that keep a pip cache, hold more than one heavy environment or
      build images.
    required: false
    default: "false"
  extra-paths:
    description: >-
      Further space-separated directories to remove, for a job that needs more
      than the default set (the Docker image build drops the whole tool cache).
    required: false
    default: ""
  minimum-free-gb:
    description: >-
      Fail the job here, naming the shortfall, when / has less than this many
      GB free after the cleanup. A clear failure before the install beats a
      quota error in the middle of it. The default covers one CUDA torch
      environment installed without pip's cache (about 10 GB at peak).
    required: false
    default: "12"

runs:
  using: composite
  steps:
    - name: Remove unused runner toolchains
      shell: bash
      env:
        DEEP: ${{ inputs.deep }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
        MIN_FREE_GB: ${{ inputs.minimum-free-gb }}
      run: |
        set -euo pipefail
        free_gb() { df -BG --output=avail / | tail -n 1 | tr -dc '0-9'; }
        before="$(free_gb)"
        # Independent trees: remove them concurrently.
        pids=()
        # shellcheck disable=SC2086  # EXTRA_PATHS is a space-separated list
        for dir in /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
                   /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL ${EXTRA_PATHS}; do
          if [ -e "${dir}" ]; then
            sudo rm -rf "${dir}" &
            pids+=("$!")
          fi
        done
        for pid in "${pids[@]}"; do wait "${pid}"; done
        if [ "${DEEP}" = "true" ]; then
          sudo apt-get remove --purge -y '^dotnet-.*' '^llvm-.*' 'temurin-.*' \
            'ghc.*' 'mysql.*' 'postgresql.*' >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          sudo apt-get clean || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
        fi
        after="$(free_gb)"
        echo "Free space on /: ${before} GB before, ${after} GB after (floor ${MIN_FREE_GB} GB)"
        {
          echo "### Runner disk"
          echo
          echo "Free on \`/\`: ${before} GB before cleanup, ${after} GB after; floor ${MIN_FREE_GB} GB."
        } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
        if [ "${after}" -lt "${MIN_FREE_GB}" ]; then
          echo "::error title=Runner disk below floor::${after} GB free on / after cleanup; this job needs at least ${MIN_FREE_GB} GB"
          exit 1
        fi
