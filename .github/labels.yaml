# Mercury Agent GitHub Labels Configuration
#
# This file defines issue and PR labels for consistent categorization.
# Apply using GitHub CLI: gh label create --force --name "name" --color "color" --description "desc"
# Or use a label sync tool like github-label-sync

# Priority Labels
- name: "priority: critical"
  color: "b60205"
  description: "Requires immediate attention - security or production issues"

- name: "priority: high"
  color: "d93f0b"
  description: "High priority - significant impact on users"

- name: "priority: medium"
  color: "fbca04"
  description: "Medium priority - should be addressed soon"

- name: "priority: low"
  color: "0e8a16"
  description: "Low priority - nice to have improvements"

# Type Labels
- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working as expected"

- name: "type: feature"
  color: "a2eeef"
  description: "New feature or enhancement request"

- name: "type: documentation"
  color: "0075ca"
  description: "Documentation improvements or additions"

- name: "type: refactor"
  color: "d4c5f9"
  description: "Code refactoring without behavior change"

- name: "type: performance"
  color: "f9d0c4"
  description: "Performance optimization"

- name: "type: security"
  color: "b60205"
  description: "Security-related issue or enhancement"

- name: "type: testing"
  color: "bfd4f2"
  description: "Testing improvements or additions"

- name: "type: ci/cd"
  color: "c5def5"
  description: "CI/CD pipeline improvements"

- name: "type: dependencies"
  color: "0366d6"
  description: "Dependency updates or issues"

