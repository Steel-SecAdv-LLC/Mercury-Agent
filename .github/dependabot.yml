# Mercury Agent Dependabot Configuration
# Automated dependency updates for security and maintenance.
#
# The ``registries:`` top-level key was previously declared with a
# ``pypi`` entry that no ``updates:`` block referenced.  Dependabot's
# schema validator (which runs on every push to ``main``) rejects
# unused registry declarations with::
#
#     The property '#/registries' includes the "pypi" registry which
#     is not used in any of the configurations
#
# Public pypi.org is Dependabot's default index for
# ``package-ecosystem: "pip"`` updates, so the explicit registry was
# also redundant — removing it both fixes the validator and matches
# the actual behaviour we already had.
#
# The ``docker``, ``github-actions`` and ``helm`` ecosystems previously
# listed ``"docker"``, ``"github-actions"`` and ``"kubernetes"`` labels
# respectively. None of those labels exist in the repository (only
# ``dependencies``/``security``/``python`` etc. do), which produced a
# Dependabot "labels could not be found" comment on PRs (see #324).
# Dropped the non-existent labels; the surviving ``dependencies``/
# ``security`` labels already convey the necessary triage signal.

version: 2

updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      # Weekly to reduce PR churn for a solo maintainer; security alerts
      # still open immediately regardless of this schedule.
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    # Cap concurrent Dependabot PRs so the queue stays reviewable.
    open-pull-requests-limit: 5
    reviewers:
      - "Steel-SecAdv-LLC/security-team"
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    # Group updates so non-security version bumps batch into one PR per
    # group instead of one PR per package.
    groups:
      # All security updates collapse into a single PR for fast review.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      ml-dependencies:
        applies-to: version-updates
        patterns:
          - "torch*"
          - "numpy"
          - "scipy"
          - "scikit-learn"
          - "pandas"
      web-dependencies:
        applies-to: version-updates
        patterns:
          - "fastapi"
          - "uvicorn"
          - "streamlit"
          - "httpx"
      crypto-dependencies:
        applies-to: version-updates
        patterns:
          - "cryptography"
          - "bcrypt"
      security-critical:
        applies-to: version-updates
        patterns:
          - "pip"
          - "setuptools"
          - "wheel"
          - "pillow"
          - "requests"
          - "urllib3"
          - "certifi"
      # Catch-all: every other version update batches into a single PR
      # so we don't get one PR per package each week. Dependabot evaluates
      # groups in order, so packages already claimed by the groups above
      # (ml-/web-/crypto-/security-critical) are excluded here by design.
      python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore major version updates for libraries with frequent breaking
    # changes; bump these manually when the maintainer has bandwidth.
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "scikit-learn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      # OpenCV 5.0 removed long-standing top-level ``cv2`` symbols (including
      # ``cv2.CascadeClassifier``, used by ``models/biometric_advanced.py``)
      # and the corresponding type stubs, breaking both the runtime path and
      # the blocking mypy gate. See the ``opencv-python-headless`` pin comment
      # in pyproject.toml. Bump manually once the codebase migrates.
      - dependency-name: "opencv-python-headless"
        update-types: ["version-update:semver-major"]
    # Vulnerability alerts configuration
    # Prioritize security updates over feature updates
    versioning-strategy: "increase-if-necessary"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "Steel-SecAdv-LLC/security-team"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    groups:
      docker-images:
        patterns:
          - "*"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "Steel-SecAdv-LLC/security-team"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Helm charts
  - package-ecosystem: "helm"
    directory: "/helm/mercury-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps(helm)"
      include: "scope"
    groups:
      helm-charts:
        patterns:
          - "*"
