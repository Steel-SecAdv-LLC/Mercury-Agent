# Mercury Agent Dependabot Configuration
# Automated dependency updates for security and maintenance

version: 2

registries:
  # PyPI registry (public)
  pypi:
    type: python-index
    url: https://pypi.org/simple
    replaces-base: true

updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 15
    reviewers:
      - "Steel-SecAdv-LLC/security-team"
    labels:
      - "dependencies"
      - "security"
      - "python"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    # Group security updates for faster review
    groups:
      security-updates:
        apply-to: security-updates
        patterns:
          - "*"
      ml-dependencies:
        patterns:
          - "torch*"
          - "numpy"
          - "scipy"
          - "pandas"
      web-dependencies:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "streamlit"
          - "httpx"
      crypto-dependencies:
        patterns:
          - "cryptography"
          - "bcrypt"
      # New group for security-critical packages
      security-critical:
        patterns:
          - "pip"
          - "setuptools"
          - "wheel"
          - "pillow"
          - "requests"
          - "urllib3"
          - "certifi"
    # Ignore major version updates for ML libs (may break compatibility)
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
    # Vulnerability alerts configuration
    # Prioritize security updates over feature updates
    versioning-strategy: "increase-if-necessary"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "Steel-SecAdv-LLC/security-team"
    labels:
      - "dependencies"
      - "security"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "Steel-SecAdv-LLC/security-team"
    labels:
      - "dependencies"
      - "security"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"

  # Helm charts
  - package-ecosystem: "helm"
    directory: "/helm/mercury-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "kubernetes"
    commit-message:
      prefix: "deps(helm)"
      include: "scope"
