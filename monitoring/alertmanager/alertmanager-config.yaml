# OMNI-AVA Alertmanager Configuration
# Routes alerts to appropriate receivers based on severity and team
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      # Global settings
      resolve_timeout: 5m
      # SMTP settings for email notifications
      smtp_smarthost: 'smtp.example.com:587'
      smtp_from: 'alerts@example.com'
      smtp_auth_username: 'alerts@example.com'
      smtp_auth_password: 'SMTP_PASSWORD'
      smtp_require_tls: true

      # Slack settings
      slack_api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'

      # PagerDuty settings
      pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

    # Alert templates
    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    # Routing tree
    route:
      # Default receiver
      receiver: 'default-receiver'
      # Group alerts by alertname and severity
      group_by: ['alertname', 'severity', 'team']
      # Wait before sending first notification
      group_wait: 30s
      # Wait before sending updated notification
      group_interval: 5m
      # Wait before re-sending notification
      repeat_interval: 4h

      routes:
        # Critical alerts - immediate notification
        - receiver: 'critical-pagerduty'
          match:
            severity: critical
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 1h
          continue: true

        # Critical alerts - also notify Slack
        - receiver: 'critical-slack'
          match:
            severity: critical
          continue: true

        # Warning alerts to Slack
        - receiver: 'warning-slack'
          match:
            severity: warning
          group_wait: 1m
          group_interval: 10m
          repeat_interval: 6h

        # Platform team alerts
        - receiver: 'platform-team'
          match:
            team: platform
          continue: true

        # ML team alerts
        - receiver: 'ml-team'
          match:
            team: ml

    # Inhibition rules
    inhibit_rules:
      # If service is down, don't alert on high error rate
      - source_match:
          alertname: 'OmniAvaServiceDown'
        target_match:
          alertname: 'OmniAvaHighErrorRate'
        equal: ['service']

      # If all replicas are down, don't alert on low replica count
      - source_match:
          alertname: 'OmniAvaAllReplicasDown'
        target_match:
          alertname: 'OmniAvaLowReplicaCount'
        equal: ['deployment']

      # Critical alerts inhibit warning alerts of same type
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname']

    # Receivers configuration
    receivers:
      - name: 'default-receiver'
        email_configs:
          - to: 'ops@example.com'
            send_resolved: true

      - name: 'critical-pagerduty'
        pagerduty_configs:
          - service_key: 'PAGERDUTY_SERVICE_KEY'
            severity: critical
            description: '{{ .CommonAnnotations.summary }}'
            details:
              firing: '{{ template "pagerduty.default.instances" .Alerts.Firing }}'
              resolved: '{{ template "pagerduty.default.instances" .Alerts.Resolved }}'
              num_firing: '{{ .Alerts.Firing | len }}'
              num_resolved: '{{ .Alerts.Resolved | len }}'

      - name: 'critical-slack'
        slack_configs:
          - channel: '#omni-ava-critical'
            username: 'OMNI-AVA Alerts'
            icon_emoji: ':rotating_light:'
            send_resolved: true
            title: '{{ .Status | toUpper }} - {{ .CommonAnnotations.summary }}'
            text: >-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              *Severity:* {{ .Labels.severity }}
              *Runbook:* {{ .Annotations.runbook_url }}
              {{ end }}
            actions:
              - type: button
                text: 'Runbook'
                url: '{{ (index .Alerts 0).Annotations.runbook_url }}'
              - type: button
                text: 'Silence'
                url: '{{ template "__alertmanagerURL" . }}/#/silences/new?filter=%7B{{ range .CommonLabels.SortedPairs }}{{ .Name }}%3D%22{{ .Value }}%22%2C%20{{ end }}%7D'

      - name: 'warning-slack'
        slack_configs:
          - channel: '#omni-ava-alerts'
            username: 'OMNI-AVA Alerts'
            icon_emoji: ':warning:'
            send_resolved: true
            title: '{{ .Status | toUpper }} - {{ .CommonAnnotations.summary }}'
            text: >-
              {{ range .Alerts }}
              *Alert:* {{ .Annotations.summary }}
              *Description:* {{ .Annotations.description }}
              {{ end }}

      - name: 'platform-team'
        email_configs:
          - to: 'platform-team@example.com'
            send_resolved: true
        slack_configs:
          - channel: '#platform-alerts'
            send_resolved: true

      - name: 'ml-team'
        email_configs:
          - to: 'ml-team@example.com'
            send_resolved: true
        slack_configs:
          - channel: '#ml-alerts'
            send_resolved: true
---
# Alertmanager ConfigMap for templates
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
data:
  omni-ava.tmpl: |
    {{ define "omni-ava.title" }}
    [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
    {{ end }}

    {{ define "omni-ava.text" }}
    {{ range .Alerts }}
    *Alert:* {{ .Labels.alertname }}
    *Severity:* {{ .Labels.severity }}
    *Summary:* {{ .Annotations.summary }}
    *Description:* {{ .Annotations.description }}
    *Runbook:* {{ .Annotations.runbook_url }}
    *Details:*
    {{ range .Labels.SortedPairs }}  - {{ .Name }}: {{ .Value }}
    {{ end }}
    {{ end }}
    {{ end }}
