# Mercury-Agent Prometheus Configuration
# Used by docker-compose.yml for local development.
# Production Kubernetes uses the PrometheusRule CRD in prometheus-rules.yaml and
# the PodMonitors in podmonitors.yaml instead.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

# Load alerting rules. rules.yml is rendered from the PrometheusRule CRD
# (prometheus-rules.yaml) by scripts/render_prometheus_rules.py; Prometheus
# cannot load the CRD itself (promtool: "field apiVersion not found").
rule_files:
  - "rules.yml"

scrape_configs:
  # Mercury-Agent API metrics
  - job_name: "mercury-agent-api"
    static_configs:
      - targets: ["mercury-agent:8000"]
        # Every rule selects {app="mercury-agent"} and groups by service; the
        # Kubernetes PodMonitors attach the same two labels.
        labels:
          app: mercury-agent
          service: api
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
