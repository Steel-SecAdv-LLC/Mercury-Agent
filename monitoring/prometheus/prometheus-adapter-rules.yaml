# prometheus-adapter rules backing the custom/external metrics in k8s/base/hpa.yaml.
#
# Pass as the adapter's config file, or under `rules:` in the
# prometheus-community/prometheus-adapter Helm chart (rules.custom /
# rules.external). Without these rules the HPAs' Pods/External metrics are
# "unavailable"; Kubernetes then refuses to scale those deployments *down* at all
# (an HPA skips scale-down while any of its metrics cannot be fetched).
#
# Series labels come from podmonitors.yaml (app, service, job).
rules:
  # mercury-agent-api-hpa: per-pod request rate.
  - seriesQuery: 'http_requests_total{app="mercury-agent",namespace!="",pod!=""}'
    resources:
      overrides:
        namespace: {resource: "namespace"}
        pod: {resource: "pod"}
    name:
      matches: "^http_requests_total$"
      as: "http_requests_per_second"
    metricsQuery: 'sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m])) by (<<.GroupBy>>)'
  # mercury-agent-api-hpa: per-pod p95 latency in seconds.
  - seriesQuery: 'http_request_duration_seconds_bucket{app="mercury-agent",namespace!="",pod!=""}'
    resources:
      overrides:
        namespace: {resource: "namespace"}
        pod: {resource: "pod"}
    name:
      matches: "^http_request_duration_seconds_bucket$"
      as: "http_request_duration_seconds_p95"
    metricsQuery: 'histogram_quantile(0.95, sum(rate(<<.Series>>{<<.LabelMatchers>>}[5m])) by (le, <<.GroupBy>>))'

externalRules:
  # mercury-agent-engine-hpa: consumer-group backlog. Every worker reports the
  # group-wide figure, so aggregate with max (a sum would multiply it by the
  # replica count). -1 means "backend could not report"; filtering it out makes
  # an all-unknown fleet read as "metric unavailable" (no scale-down) rather
  # than as an empty queue.
  - seriesQuery: 'omni_detection_queue_depth{app="mercury-agent",namespace!=""}'
    resources:
      overrides:
        namespace: {resource: "namespace"}
    name:
      matches: "^omni_detection_queue_depth$"
    metricsQuery: 'max(<<.Series>>{<<.LabelMatchers>>} >= 0) by (<<.GroupBy>>)'
