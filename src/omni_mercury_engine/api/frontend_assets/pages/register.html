<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Mercury Agent</title>
  <link rel="stylesheet" href="/static/mercury.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
</head>
<body data-page="register">
  <header class="site-header">
    <a class="brand" href="/">Mercury Agent</a>
    <nav aria-label="Account">
      <span data-nav-anon class="hidden"><a href="/login">Log in</a></span>
      <span data-nav-authed class="hidden"><a href="/dashboard">Dashboard</a></span>
    </nav>
  </header>
  <main class="narrow">
    <h1>Create your account</h1>
    <div class="card">
      <form id="register-form">
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="new-password" minlength="8" required>
          <p class="hint">At least 8 characters.</p>
        </div>
        <button type="submit">Register</button>
      </form>
      <p id="register-status" class="status" role="status" aria-live="polite"></p>
      <p class="hint">Already have an account? <a href="/login">Log in</a>.</p>
    </div>
  </main>
  <footer class="site-footer">Mercury Agent — Steel Security Advisors LLC</footer>
</body>
</html>
