<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password — Mercury Agent</title>
  <link rel="stylesheet" href="/static/mercury.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/auth.js" defer></script>
</head>
<body data-page="reset-password">
  <header class="site-header">
    <a class="brand" href="/">Mercury Agent</a>
    <nav aria-label="Account">
      <span data-nav-anon class="hidden"><a href="/login">Log in</a></span>
      <span data-nav-authed class="hidden"><a href="/dashboard">Dashboard</a></span>
    </nav>
  </header>
  <main class="narrow">
    <h1>Reset your password</h1>
    <section id="reset-request-section" class="card">
      <form id="reset-request-form">
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <button type="submit">Send reset link</button>
      </form>
      <p id="reset-request-status" class="status" role="status" aria-live="polite"></p>
    </section>
    <section id="reset-confirm-section" class="card hidden">
      <form id="reset-confirm-form">
        <div>
          <label for="new-password">New password</label>
          <input id="new-password" name="new-password" type="password"
                 autocomplete="new-password" minlength="8" required>
          <p class="hint">At least 8 characters. Every existing session will be signed out.</p>
        </div>
        <button type="submit">Set new password</button>
      </form>
      <p id="reset-confirm-status" class="status" role="status" aria-live="polite"></p>
      <p id="reset-next" class="hidden"><a href="/login">Continue to login</a></p>
    </section>
  </main>
  <footer class="site-footer">Mercury Agent — Steel Security Advisors LLC</footer>
</body>
</html>
