# Mercury Agent Helm Chart
# Neural-Symbolic AI Framework for Multi-Domain Anomaly Detection
apiVersion: v2
name: mercury-agent
description: |
  Mercury Agent (Omnidisciplinary Neural-Symbolic AI Virtual Analyst) is a comprehensive
  anomaly detection framework supporting medical, security intelligence, planetary
  monitoring, chemistry, and consciousness research domains.

