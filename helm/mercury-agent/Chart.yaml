version: 2.1.0
appVersion: "2.1.0"

# Minimum Kubernetes version required
kubeVersion: ">=1.23.0-0"

home: https://github.com/Steel-SecAdv-LLC/Mercury-Agent
icon: https://raw.githubusercontent.com/Steel-SecAdv-LLC/Mercury-Agent/main/docs/images/logo.png
sources:
  - https://github.com/Steel-SecAdv-LLC/Mercury-Agent

maintainers:
  - name: Steel Security Advisors LLC
    email: steel.sa.llc@gmail.com
    url: https://steel-secadv.com

keywords:
