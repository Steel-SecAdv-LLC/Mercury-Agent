  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - Initial Helm chart release
    - Added Kubernetes deployment manifests
    - Implemented HPA and PDB
    - Added monitoring integration

# No subchart dependencies, deliberately.
#
# This chart used to declare three optional ones -- prometheus 30.0.1, grafana
# ~10.5.15, redis 27.0.15 -- all disabled by default and all unreferenced by
# any template here. Helm's dependency check does not consult a dependency's
# `condition`: every declared dependency must be present in `charts/` or the
# chart cannot be rendered or installed at all. So `helm install mercury-agent
# ./helm/mercury-agent`, the command README.md and docs/DEPLOYMENT.md both
# publish, failed with:
#
#   Error: ... found in Chart.yaml, but missing in charts/ directory:
#   prometheus, grafana, redis
#
# and the standard remedy failed too -- `helm dependency update` cannot resolve
# prometheus 30.0.1, a version that has never existed in the
# prometheus-community index (its newest is in the 29.x line). The chart was
# therefore uninstallable by any documented route.
#
# Monitoring is served by the Prometheus Operator integration these templates
# genuinely implement (templates/servicemonitor.yaml, templates/
# prometheusrule.yaml); Redis, when the streaming engine needs one, is an
# external release addressed by URL. See the "Monitoring and cache
# integration" section of values.yaml.
