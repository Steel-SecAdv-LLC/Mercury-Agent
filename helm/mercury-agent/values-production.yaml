# Mercury Agent Production Environment Values
# High availability configuration with full security

namespace:
  name: mercury-agent

api:
  replicaCount: 3

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 10
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  ingress:
    # Off until a hostname is supplied. An externally reachable
    # Ingress needs a name that resolves, and a chart cannot know it;
    # the reserved *.example.com hostnames this file used to ship made
    # it look configured while routing nothing. Enable it together
    # with `api.ingress.hosts` (and `api.ingress.tls`) -- see the
    # `hosts:` note below. `templates/ingress.yaml` refuses to render
    # `enabled: true` with an empty `hosts`, so the two cannot drift
    # apart.
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/limit-rps: "100"
      nginx.ingress.kubernetes.io/limit-connections: "50"
    # Supply your own hostnames. This file used to ship
    # `mercury-agent.example.com` / `api.mercury-agent.example.com` -- an IANA
    # reserved documentation domain that nothing overrode -- so the rendered
    # production Ingress matched hostnames that cannot resolve and routed
    # nothing. `templates/ingress.yaml` now fails the render with an
    # actionable message rather than emitting a rule-less Ingress, so this
    # cannot be left unset by accident:
    #
    #   helm install mercury-agent ./helm/mercury-agent \
    #     -f helm/mercury-agent/values-production.yaml \
    #     --set-json 'api.ingress.hosts=[{"host":"api.your-domain.example",
    #        "paths":[{"path":"/","pathType":"Prefix"}]}]' \
    #     --set-json 'api.ingress.tls=[{"hosts":["api.your-domain.example"],
    #        "secretName":"mercury-agent-prod-tls"}]'
    #
    # cert-manager creates the Secret named in `tls[].secretName`.
    hosts: []
    tls: []

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: api
            topologyKey: topology.kubernetes.io/zone

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: api

engine:
  replicaCount: 2

  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: engine
            topologyKey: kubernetes.io/hostname

config:
  app:
    # The one setting that arms every production guard in the application:
    # API_KEY_HASH_SALT becomes mandatory instead of silently falling back to
    # the built-in default salt, CORS drops the localhost allowlist, and JWT
    # signing keys resolve through the production branch. No chart path set it
    # before, so "production" deployments ran in development mode.
    # It replaces four keys that had no reader anywhere in src/
    # (OMNI_LOG_LEVEL, OMNI_API_WORKERS, OMNI_ENABLE_PROFILING,
    # OMNI_ETHICS_STRICT_MODE) -- this file's entire config hardening was
    # inert.
    MERCURY_ENV: "production"
    OMNI_STRICT_VALIDATION: "true"

persistence:
  data:
    size: 100Gi
    storageClass: premium-rwo
  models:
    size: 200Gi
    storageClass: premium-rwo
  backup:
    enabled: true
    size: 500Gi
    storageClass: standard

networkPolicy:
  enabled: true
  ingressNamespaces:
    - ingress-nginx
    - istio-system
    - monitoring

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s

priorityClassName: system-cluster-critical
terminationGracePeriodSeconds: 120
