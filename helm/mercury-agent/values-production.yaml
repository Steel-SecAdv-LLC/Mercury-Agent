# Mercury Agent ♱ Production Environment Values
# High availability configuration with full security

namespace:
  name: mercury-agent

api:
  replicaCount: 3

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 10
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/limit-rps: "100"
      nginx.ingress.kubernetes.io/limit-connections: "50"
    hosts:
      - host: mercury-agent.example.com
        paths:
          - path: /
            pathType: Prefix
      - host: api.mercury-agent.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - mercury-agent.example.com
          - api.mercury-agent.example.com
        secretName: mercury-agent-prod-tls

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: api
          topologyKey: kubernetes.io/hostname
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: api
            topologyKey: topology.kubernetes.io/zone

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: api

engine:
  replicaCount: 2

  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "16Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: engine
            topologyKey: kubernetes.io/hostname

config:
  app:
    OMNI_LOG_LEVEL: "WARNING"
    OMNI_API_WORKERS: "4"
    OMNI_ENABLE_PROFILING: "false"
    OMNI_ETHICS_STRICT_MODE: "true"

persistence:
  data:
    size: 100Gi
    storageClass: premium-rwo
  models:
    size: 200Gi
    storageClass: premium-rwo
  backup:
    enabled: true
    size: 500Gi
    storageClass: standard

networkPolicy:
  enabled: true
  ingressNamespaces:
    - ingress-nginx
    - istio-system
    - monitoring

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s

priorityClassName: system-cluster-critical
terminationGracePeriodSeconds: 120
