{{- if and .Values.persistence.data.enabled (not .Values.persistence.data.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mercury-agent.dataPvcName" . }}
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - {{ .Values.persistence.data.accessMode }}
  {{- if or .Values.persistence.data.storageClass .Values.global.storageClass }}
  storageClassName: {{ .Values.persistence.data.storageClass | default .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.data.size }}
{{- end }}
---
{{- if and .Values.persistence.models.enabled (not .Values.persistence.models.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mercury-agent.modelsPvcName" . }}
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - {{ .Values.persistence.models.accessMode }}
  {{- if or .Values.persistence.models.storageClass .Values.global.storageClass }}
  storageClassName: {{ .Values.persistence.models.storageClass | default .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.models.size }}
{{- end }}
---
{{- if and .Values.persistence.backup.enabled (not .Values.persistence.backup.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mercury-agent.fullname" . }}-backup
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - {{ .Values.persistence.backup.accessMode }}
  {{- if or .Values.persistence.backup.storageClass .Values.global.storageClass }}
  storageClassName: {{ .Values.persistence.backup.storageClass | default .Values.global.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.backup.size }}
{{- end }}
