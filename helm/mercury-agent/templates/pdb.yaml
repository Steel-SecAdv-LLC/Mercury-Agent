{{- if and .Values.api.enabled .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mercury-agent.fullname" . }}-api
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.api.labels" . | nindent 4 }}
spec:
  {{- if .Values.api.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.api.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.api.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mercury-agent.api.selectorLabels" . | nindent 6 }}
{{- end }}
---
{{- if and .Values.engine.enabled .Values.engine.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mercury-agent.fullname" . }}-engine
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.engine.labels" . | nindent 4 }}
spec:
  {{- if .Values.engine.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.engine.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.engine.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.engine.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mercury-agent.engine.selectorLabels" . | nindent 6 }}
{{- end }}
