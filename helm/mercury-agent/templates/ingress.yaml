{{- if .Values.api.ingress.enabled }}
{{- if not .Values.api.ingress.hosts }}
{{- fail "api.ingress.enabled is true but api.ingress.hosts is empty. An Ingress with no rules routes nothing. Supply at least one entry, e.g.\n  --set-json 'api.ingress.hosts=[{\"host\":\"api.your-domain.example\",\"paths\":[{\"path\":\"/\",\"pathType\":\"Prefix\"}]}]'\nOmit \"host\" from an entry to match any Host header." }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mercury-agent.fullname" . }}
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.labels" . | nindent 4 }}
  {{- with .Values.api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.api.ingress.className }}
  ingressClassName: {{ .Values.api.ingress.className }}
  {{- end }}
  {{- if .Values.api.ingress.tls }}
  tls:
    {{- range .Values.api.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.api.ingress.hosts }}
    {{- /* A rule with no `host` matches every Host header -- the correct
           default for a cluster whose external name is not known at package
           time, and better than the reserved documentation domain this chart
           used to ship. Emitting `host: ""` would instead produce an invalid
           Ingress, so the key is omitted entirely when unset. */}}
    -
      {{- with .host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "mercury-agent.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
