{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "mercury-agent.fullname" . }}
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mercury-agent.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.metrics.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      # The chart's alert rules (rendered from the CRD) select
      # {app="mercury-agent"} and group by `service`; OmniMercuryServiceDown
      # reads up{job="mercury-agent-api"}. Attach all three, as the raw
      # manifests' PodMonitors do, then any operator relabelings.
      relabelings:
        - targetLabel: app
          replacement: mercury-agent
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: job
          replacement: mercury-agent-$1
        {{- with .Values.metrics.serviceMonitor.relabelings }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.metrics.serviceMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  namespaceSelector:
    matchNames:
      - {{ include "mercury-agent.namespace" . }}
{{- end }}
