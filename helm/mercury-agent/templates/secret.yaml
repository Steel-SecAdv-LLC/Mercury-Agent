{{- if not .Values.config.secrets.existingSecret }}
{{- if eq (.Values.config.app.MERCURY_ENV | default "") "production" }}
{{- /* The application makes both keys mandatory in production mode (api/auth.py and
       APIKeyStore.hash_key) and refuses to start without them. Fail the render here, so
       the mistake is reported by `helm install`, not by pods that crash-loop after it. */}}
{{- $_ := required "config.secrets.JWT_SECRET_KEY (or the JWT_SECRET alias) is required when config.app.MERCURY_ENV is production; set it, or set config.secrets.existingSecret to a Secret that holds it" (.Values.config.secrets.JWT_SECRET_KEY | default .Values.config.secrets.JWT_SECRET) }}
{{- $_ = required "config.secrets.API_KEY_HASH_SALT is required when config.app.MERCURY_ENV is production; set it, or set config.secrets.existingSecret to a Secret that holds it" .Values.config.secrets.API_KEY_HASH_SALT }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mercury-agent.secretName" . }}
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.config.secrets.DB_PASSWORD }}
  DB_PASSWORD: {{ .Values.config.secrets.DB_PASSWORD | quote }}
  {{- end }}
  {{- if .Values.config.secrets.API_SECRET_KEY }}
  API_SECRET_KEY: {{ .Values.config.secrets.API_SECRET_KEY | quote }}
  {{- end }}
  {{- /* Render the app-expected key JWT_SECRET_KEY; accept the pre-1.8 alias
         config.secrets.JWT_SECRET as a non-breaking fallback (prefer the new key). */}}
  {{- $jwtSecretKey := .Values.config.secrets.JWT_SECRET_KEY | default .Values.config.secrets.JWT_SECRET }}
  {{- if $jwtSecretKey }}
  JWT_SECRET_KEY: {{ $jwtSecretKey | quote }}
  {{- end }}
  {{- if .Values.config.secrets.API_KEY_HASH_SALT }}
  API_KEY_HASH_SALT: {{ .Values.config.secrets.API_KEY_HASH_SALT | quote }}
  {{- end }}
  {{- if .Values.config.secrets.MERCURY_CACHE_SECRET }}
  MERCURY_CACHE_SECRET: {{ .Values.config.secrets.MERCURY_CACHE_SECRET | quote }}
  {{- end }}
{{- end }}
