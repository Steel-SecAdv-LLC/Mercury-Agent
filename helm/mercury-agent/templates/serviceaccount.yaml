{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mercury-agent.api.serviceAccountName" . }}
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.api.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.api.serviceAccount.automountServiceAccountToken }}
{{- end }}
---
{{- if .Values.engine.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mercury-agent.engine.serviceAccountName" . }}
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.engine.labels" . | nindent 4 }}
  {{- with .Values.engine.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.engine.serviceAccount.automountServiceAccountToken }}
{{- end }}
