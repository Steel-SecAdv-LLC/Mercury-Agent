apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mercury-agent.configMapName" . }}
  namespace: {{ include "mercury-agent.namespace" . }}
  labels:
    {{- include "mercury-agent.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config.app }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
