# Mercury Agent Helm Chart Default Values
# This file contains the default configuration values for the Mercury Agent chart.
# All values can be overridden via command line or custom values files.

# Global settings
global:
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Storage class to use for all PVCs
  storageClass: ""
  # Node selector for all pods
  nodeSelector: {}

# Namespace configuration
namespace:
  create: true
  name: mercury-agent
  labels: {}
  annotations: {}

# Common labels applied to all resources
commonLabels: {}

# Common annotations applied to all resources
commonAnnotations: {}

# ============================================================================
# API Server Configuration
# ============================================================================
api:
  enabled: true
  replicaCount: 3

  image:
    repository: ghcr.io/steel-secadv-llc/mercury-agent
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  # Service account
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Resource requests and limits
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Autoscaling configuration
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
      scaleUp:
        stabilizationWindowSeconds: 60

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
    metricsPort: 9090
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    # A host-less rule matches any Host header, so the chart serves through
    # whatever name (or bare load-balancer address) the cluster answers on
    # with no editing. Supply `host:` per entry to pin a name -- and note that
    # `templates/ingress.yaml` refuses to render an enabled Ingress with an
    # EMPTY `hosts` list, so a missing hostname is a loud failure rather than
    # a rule-less Ingress that silently routes nothing.
    hosts:
      - paths:
          - path: /
            pathType: Prefix
    tls: []

  # Probes
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30

  # Environment variables
  env: {}

  # Extra environment variables from secrets/configmaps
  envFrom: []

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: api
            topologyKey: kubernetes.io/hostname

  # Topology spread constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

# ============================================================================
# Engine Worker Configuration
# ============================================================================
engine:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/steel-secadv-llc/mercury-agent
    tag: ""
    pullPolicy: IfNotPresent

  # Streaming anomaly-detection worker (consume -> detect -> publish). Topics /
  # consumer-group / backend are read from the chart ConfigMap (engine.streaming
  # below); STREAMING_BACKEND defaults to "memory". No shipped values file
  # overrides it, so running the engine against Kafka requires the operator to
  # set engine config.app.STREAMING_BACKEND=kafka and supply
  # KAFKA_BOOTSTRAP_SERVERS.
  command:
    - python
    - -m
    - omni_mercury_engine.cli
    - stream

  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "16Gi"
    # GPU support (uncomment if needed)
    # nvidia.com/gpu: "1"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ============================================================================
# Configuration
# ============================================================================
config:
  # Application configuration (ConfigMap)
  # Application configuration (ConfigMap). Every key below is read by
  # shipped code. Eleven keys that used to live here -- OMNI_LOG_LEVEL,
  # OMNI_CACHE_DIR, OMNI_DATA_DIR, OMNI_MODEL_DIR, OMNI_API_HOST,
  # OMNI_API_PORT, OMNI_API_WORKERS, OMNI_ENABLE_METRICS, OMNI_ENABLE_TRACING,
  # OMNI_ETHICS_ENABLED, OMNI_ETHICS_STRICT_MODE -- have zero readers anywhere
  # in src/: the API's bind address and port come from the container CMD's
  # uvicorn arguments, and the rest name knobs that do not exist. They are
  # gone; each key here is annotated with the module that reads it.
  app:
    # --- Runtime mode ------------------------------------------------------
    # omni_mercury_engine._env.get_mercury_env(). Unset -- which is what every
    # k8s and Helm path shipped before -- means "development": the API-key
    # hash salt stays at its hard-coded default, CORS installs the localhost
    # allowlist, and the production JWT branch is unreachable. Set it to
    # "production" (values-production.yaml and values-staging.yaml do) to arm
    # the fail-closed guards.
    MERCURY_ENV: "development"

    # --- Durable platform state -------------------------------------------
    # api/key_store.py, api/rate_limit_store.py, api/quota_store.py and the
    # identity/usage stores all key off MERCURY_KEYSTORE_PATH. Unset, every
    # one falls back to per-process memory: with replicaCount 3 and the HPA
    # scaling to 20, an account registered on one replica cannot log in on
    # another, API keys and quota counters die on restart, and the global
    # rate limit multiplies by the replica count.
    #
    # The path sits on the `persistence.data` PVC (ReadWriteMany, mounted at
    # /app/data). STORAGE REQUIREMENT: that storage class must provide working
    # POSIX advisory locks and shared-memory mapping, because the store runs
    # SQLite in WAL mode -- CephFS, Longhorn RWX and AWS EFS (NFSv4.1)
    # qualify, plain NFSv3 does not.
    MERCURY_KEYSTORE_PATH: "/app/data/mercury.db"
    MERCURY_AUDIT_LOG_DIR: "/app/data/audit"

    # --- Reverse proxy -----------------------------------------------------
    # api/client_ip.resolve_client_ip() and api/security_headers. One trusted
    # hop: the ingress controller. Without it the rate limiter keys every
    # request on the controller's pod IP (one bucket for the whole internet)
    # and HSTS is never emitted behind TLS termination. Set to "0" when no
    # proxy fronts the Service.
    MERCURY_TRUSTED_PROXY_HOPS: "1"

    # --- Request validation limits (api/server.py APIRequestValidator) -----
    OMNI_MAX_DATA_POINTS: "100000"
    OMNI_MAX_FEATURES: "1000"
    OMNI_MAX_STRING_LENGTH: "256"
    OMNI_MAX_NAN_RATIO: "0.1"
    OMNI_MAX_INF_RATIO: "0.01"
    OMNI_STRICT_VALIDATION: "false"

    # --- Global rate limiter (api/server.py RateLimitMiddleware) -----------
    OMNI_RATE_LIMIT_ENABLED: "true"
    OMNI_RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
    OMNI_RATE_LIMIT_BURST: "20"

    # --- Detector numerics (detectors/detection_config.py) -----------------
    OMNI_DETECTOR_NAN_POLICY: "neutral"

    # --- Numeric-library threading -----------------------------------------
    OMP_NUM_THREADS: "4"

    # Streaming worker settings (consumed by the engine's `stream` worker).
    # STREAMING_BACKEND defaults to the in-process "memory" backend; no shipped
    # values file overrides it -- set it to "kafka" here (and provide
    # KAFKA_BOOTSTRAP_SERVERS) to run the engine against a real broker.
    STREAMING_BACKEND: "memory"
    MERCURY_STREAM_INPUT_TOPIC: "mercury-detections"
    MERCURY_STREAM_OUTPUT_TOPIC: "mercury-anomalies"
    MERCURY_STREAM_CONSUMER_GROUP: "mercury-streaming-workers"
    MERCURY_METRICS_PORT: "9090"
    # The CLI's /metrics server binds loopback by default (secure-by-default
    # on bare hosts). In-cluster, Prometheus scrapes cross-pod at
    # <pod-ip>:MERCURY_METRICS_PORT, so widen the bind here explicitly.
    MERCURY_METRICS_HOST: "0.0.0.0"

  # Secrets configuration
  secrets:
    # If using existing secret, set name here
    existingSecret: ""
    # Values (only used if existingSecret is empty)
    DB_PASSWORD: ""
    API_SECRET_KEY: ""
    # The chart also accepts the pre-1.8 values key ``config.secrets.JWT_SECRET``
    # and renders it into the ``JWT_SECRET_KEY`` secret/env that the app reads;
    # prefer setting ``JWT_SECRET_KEY`` here directly.
    #
    # A value here must be real key material: ``api/auth.py`` rejects an empty,
    # whitespace-only, placeholder ("CHANGE_ME...", "changeme", "secret", ...)
    # or low-entropy key outright rather than signing with it. Generate with
    # ``openssl rand -hex 32``.
    JWT_SECRET_KEY: ""
    # Required whenever API-key auth is used with ``MERCURY_ENV=production``:
    # ``APIKeyStore.hash_key`` raises rather than hashing every key under the
    # built-in default salt. That guard only fires in production mode, which
    # no chart path used to select -- ``config.app.MERCURY_ENV`` above is what
    # arms it. Generate with ``openssl rand -hex 32``.
    API_KEY_HASH_SALT: ""
    # Recommended in production: shared HMAC key that signs cache entries
    # (read as ``MERCURY_CACHE_SECRET`` by the cache layer).
    MERCURY_CACHE_SECRET: ""

# ============================================================================
# Persistence
# ============================================================================
persistence:
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    size: 50Gi
    existingClaim: ""

  models:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    size: 100Gi
    existingClaim: ""

  backup:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 200Gi
    existingClaim: ""

# ============================================================================
# Network Policies
# ============================================================================
networkPolicy:
  enabled: true
  # Allow ingress from specific namespaces
  ingressNamespaces:
    - ingress-nginx
    - istio-system
    - monitoring

# ============================================================================
# Monitoring Configuration
# ============================================================================
metrics:
  enabled: true
  port: 9090
  path: /metrics

  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []

  prometheusRule:
    enabled: false
    rules: []

# ============================================================================
# Monitoring and cache integration
# ============================================================================
# This chart declares NO subchart dependencies.
#
# It used to declare three (prometheus 30.0.1, grafana ~10.5.15, redis 27.0.15)
# and carried matching `prometheus:` / `grafana:` / `redis:` value blocks. No
# template in this chart ever referenced any of them, all three defaulted to
# disabled -- and Helm requires every declared dependency to be vendored in
# `charts/` whether or not its condition is met, so `helm install
# mercury-agent ./helm/mercury-agent` (the command README.md and
# docs/DEPLOYMENT.md both give) failed outright with "found in Chart.yaml, but
# missing in charts/ directory". The documented remedy could not fix it
# either: `helm dependency update` failed on the prometheus pin, which names a
# version 30.0.1 that does not exist in the prometheus-community index.
#
# Monitoring integrates through the Prometheus Operator instead, which is what
# this chart's own templates actually implement. Set
# `metrics.serviceMonitor.enabled=true` and `metrics.prometheusRule.enabled=true`
# (the `metrics:` block above -- both gate on `metrics.enabled`, which defaults
# to true) and the chart emits a ServiceMonitor and a PrometheusRule for an
# existing operator to discover:
#
#   helm template mercury-agent ./helm/mercury-agent \
#     --set metrics.serviceMonitor.enabled=true \
#     --set metrics.prometheusRule.enabled=true
#
# `values-staging.yaml` and `values-production.yaml` already turn the
# ServiceMonitor on. The CI "Deployment Manifests" job renders exactly that
# command and fails if either object goes missing, so this replacement is a
# gated property rather than a claim in a comment.
#
# This is also the better architecture, not merely the one that renders: a
# cluster runs ONE monitoring stack (kube-prometheus-stack) and applications
# contribute ServiceMonitors to it. A subchart would have installed a second,
# app-scoped Prometheus that scrapes only Mercury and federates with nothing.
#
# Grafana dashboards live in `monitoring/grafana` in the repository and are
# provisioned into that same cluster-wide stack. Redis, when the streaming
# engine needs it, is addressed by URL through `config.app.REDIS_URL` -- an
# external release, not a subchart.

# ============================================================================
# Additional Configuration
# ============================================================================

# Priority class for pods
priorityClassName: ""

# Termination grace period
terminationGracePeriodSeconds: 60

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# DNS configuration
dnsPolicy: ClusterFirst
dnsConfig: {}
