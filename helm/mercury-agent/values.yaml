# Mercury Agent Helm Chart Default Values
# This file contains the default configuration values for the Mercury Agent chart.
# All values can be overridden via command line or custom values files.

# Global settings
global:
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Storage class to use for all PVCs
  storageClass: ""
  # Node selector for all pods
  nodeSelector: {}

# Namespace configuration
namespace:
  create: true
  name: mercury-agent
  labels: {}
  annotations: {}

# Common labels applied to all resources
commonLabels: {}

# Common annotations applied to all resources
commonAnnotations: {}

# ============================================================================
# API Server Configuration
# ============================================================================
api:
  enabled: true
  replicaCount: 3

  image:
    repository: ghcr.io/steel-secadv-llc/mercury-agent
    tag: ""  # Defaults to Chart.appVersion
    pullPolicy: IfNotPresent

  # Service account
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false

  # Pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # Container security context
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Resource requests and limits
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Autoscaling configuration
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
      scaleUp:
        stabilizationWindowSeconds: 60

  # Pod disruption budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
    metricsPort: 9090
    annotations: {}

  # Ingress configuration
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: mercury-agent.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Probes
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 30

  # Environment variables
  env: {}

  # Extra environment variables from secrets/configmaps
  envFrom: []

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/component: api
            topologyKey: kubernetes.io/hostname

  # Topology spread constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway

# ============================================================================
# Engine Worker Configuration
# ============================================================================
engine:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/steel-secadv-llc/mercury-agent
    tag: ""
    pullPolicy: IfNotPresent

  # Streaming anomaly-detection worker (consume -> detect -> publish). Topics /
  # consumer-group / backend are read from the chart ConfigMap (engine.streaming
  # below); STREAMING_BACKEND defaults to "memory". No shipped values file
  # overrides it, so running the engine against Kafka requires the operator to
  # set engine config.app.STREAMING_BACKEND=kafka and supply
  # KAFKA_BOOTSTRAP_SERVERS.
  command:
    - python
    - -m
    - omni_mercury_engine.cli
    - stream

  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: false

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  resources:
    requests:
      cpu: "1"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "16Gi"
    # GPU support (uncomment if needed)
    # nvidia.com/gpu: "1"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}

# ============================================================================
# Configuration
# ============================================================================
config:
  # Application configuration (ConfigMap)
  app:
    OMNI_LOG_LEVEL: "INFO"
    OMNI_CACHE_DIR: "/app/cache"
    OMNI_DATA_DIR: "/app/data"
    OMNI_MODEL_DIR: "/app/models"
    OMNI_API_HOST: "0.0.0.0"
    OMNI_API_PORT: "8000"
    OMNI_API_WORKERS: "4"
    OMP_NUM_THREADS: "4"
    OMNI_ENABLE_METRICS: "true"
    OMNI_ENABLE_TRACING: "true"
    OMNI_ETHICS_ENABLED: "true"
    OMNI_ETHICS_STRICT_MODE: "true"
    # Streaming worker settings (consumed by the engine's `stream` worker).
    # STREAMING_BACKEND defaults to the in-process "memory" backend; no shipped
    # values file overrides it — set it to "kafka" here (and provide
    # KAFKA_BOOTSTRAP_SERVERS) to run the engine against a real broker.
    STREAMING_BACKEND: "memory"
    MERCURY_STREAM_INPUT_TOPIC: "mercury-detections"
    MERCURY_STREAM_OUTPUT_TOPIC: "mercury-anomalies"
    MERCURY_STREAM_CONSUMER_GROUP: "mercury-streaming-workers"
    MERCURY_METRICS_PORT: "9090"
    # The CLI's /metrics server binds loopback by default (secure-by-default
    # on bare hosts). In-cluster, Prometheus scrapes cross-pod at
    # <pod-ip>:MERCURY_METRICS_PORT, so widen the bind here explicitly.
    MERCURY_METRICS_HOST: "0.0.0.0"

  # Secrets configuration
  secrets:
    # If using existing secret, set name here
    existingSecret: ""
    # Values (only used if existingSecret is empty)
    DB_PASSWORD: ""
    API_SECRET_KEY: ""
    # The chart also accepts the pre-1.8 values key ``config.secrets.JWT_SECRET``
    # and renders it into the ``JWT_SECRET_KEY`` secret/env that the app reads;
    # prefer setting ``JWT_SECRET_KEY`` here directly.
    JWT_SECRET_KEY: ""
    # Required in production when API-key auth is used: ``api/auth.py`` raises if
    # the built-in default salt is left in place. Rendered into the app env.
    API_KEY_HASH_SALT: ""
    # Recommended in production: shared HMAC key that signs cache entries
    # (read as ``MERCURY_CACHE_SECRET`` by the cache layer).
    MERCURY_CACHE_SECRET: ""

# ============================================================================
# Persistence
# ============================================================================
persistence:
  data:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    size: 50Gi
    existingClaim: ""

  models:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteMany
    size: 100Gi
    existingClaim: ""

  backup:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 200Gi
    existingClaim: ""

# ============================================================================
# Network Policies
# ============================================================================
networkPolicy:
  enabled: true
  # Allow ingress from specific namespaces
  ingressNamespaces:
    - ingress-nginx
    - istio-system
    - monitoring

# ============================================================================
# Monitoring Configuration
# ============================================================================
metrics:
  enabled: true
  port: 9090
  path: /metrics

  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
    relabelings: []
    metricRelabelings: []

  prometheusRule:
    enabled: false
    rules: []

# ============================================================================
# Dependencies Configuration
# ============================================================================
prometheus:
  enabled: false
  # Additional Prometheus configuration when enabled

grafana:
  enabled: false
  # Additional Grafana configuration when enabled
  adminPassword: ""
  dashboards:
    default:
      mercury-agent-overview:
        gnetId: 0
        revision: 1
        datasource: Prometheus

redis:
  enabled: false
  architecture: standalone
  auth:
    enabled: true
    password: ""

# ============================================================================
# Additional Configuration
# ============================================================================

# Priority class for pods
priorityClassName: ""

# Termination grace period
terminationGracePeriodSeconds: 60

# Extra volumes
extraVolumes: []

# Extra volume mounts
extraVolumeMounts: []

# Init containers
initContainers: []

# Sidecar containers
sidecars: []

# Pod annotations
podAnnotations: {}

# Pod labels
podLabels: {}

# DNS configuration
dnsPolicy: ClusterFirst
dnsConfig: {}
