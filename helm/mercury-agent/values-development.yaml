# Mercury Agent Development Environment Values
# Minimal resources for local development and testing

namespace:
  name: mercury-agent-dev

api:
  replicaCount: 1

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  ingress:
    enabled: true
    className: nginx
    # `.local` is reserved for mDNS and does not resolve through a cluster
    # ingress; a host-less rule matches whatever Host header the cluster
    # actually answers on, which is what a dev cluster needs.
    hosts:
      - paths:
          - path: /
            pathType: Prefix

engine:
  replicaCount: 1

  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "4Gi"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

config:
  app:
    # Development mode: the localhost CORS allowlist and the relaxed key
    # guards are what a local cluster wants. Replaces three keys with no
    # reader anywhere in src/.
    MERCURY_ENV: "development"
    OMNI_STRICT_VALIDATION: "false"
    OMNI_RATE_LIMIT_REQUESTS_PER_MINUTE: "1000"
    OMNI_RATE_LIMIT_BURST: "200"

persistence:
  data:
    size: 5Gi
  models:
    size: 10Gi
  backup:
    enabled: false

networkPolicy:
  enabled: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
