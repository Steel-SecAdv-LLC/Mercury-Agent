# Mercury Agent Staging Environment Values
# Moderate resources for integration testing

namespace:
  name: mercury-agent-staging

api:
  replicaCount: 2

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ingress:
    # Off until a hostname is supplied. An externally reachable
    # Ingress needs a name that resolves, and a chart cannot know it;
    # the reserved *.example.com hostnames this file used to ship made
    # it look configured while routing nothing. Enable it together
    # with `api.ingress.hosts` (and `api.ingress.tls`) -- see the
    # `hosts:` note below. `templates/ingress.yaml` refuses to render
    # `enabled: true` with an empty `hosts`, so the two cannot drift
    # apart.
    enabled: false
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    # Supply your own hostname; see values-production.yaml for the
    # --set-json form. Shipping `mercury-agent.staging.example.com` (a
    # reserved documentation domain) rendered an Ingress that routed nothing.
    hosts: []
    tls: []

engine:
  replicaCount: 1

  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "8Gi"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

config:
  app:
    # Staging runs in production mode so the fail-closed guards
    # (API_KEY_HASH_SALT required, no localhost CORS allowlist, production JWT
    # key resolution) are exercised before production meets them. Replaces
    # three keys with no reader anywhere in src/.
    MERCURY_ENV: "production"
    OMNI_STRICT_VALIDATION: "true"
    OMNI_RATE_LIMIT_REQUESTS_PER_MINUTE: "300"
    OMNI_RATE_LIMIT_BURST: "60"

persistence:
  data:
    size: 20Gi
  models:
    size: 50Gi
  backup:
    enabled: true
    size: 50Gi

networkPolicy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
