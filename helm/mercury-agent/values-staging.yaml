# Mercury-Agent Staging Environment Values
# Moderate resources for integration testing

namespace:
  name: mercury-agent-staging

api:
  replicaCount: 2

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 75

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts:
      - host: mercury-agent.staging.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - mercury-agent.staging.example.com
        secretName: mercury-agent-staging-tls

engine:
  replicaCount: 1

  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "8Gi"

  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

config:
  app:
    OMNI_LOG_LEVEL: "INFO"
    OMNI_API_WORKERS: "2"
    OMNI_ENABLE_PROFILING: "false"

persistence:
  data:
    size: 20Gi
  models:
    size: 50Gi
  backup:
    enabled: true
    size: 50Gi

networkPolicy:
  enabled: true

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
