# OMNI-AVA Development Environment Values
# Minimal resources for local development and testing

namespace:
  name: omni-ava-dev

api:
  replicaCount: 1

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: omni-ava.dev.local
        paths:
          - path: /
            pathType: Prefix

engine:
  replicaCount: 1

  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "4Gi"

  autoscaling:
    enabled: false

  podDisruptionBudget:
    enabled: false

config:
  app:
    OMNI_LOG_LEVEL: "DEBUG"
    OMNI_API_WORKERS: "1"
    OMNI_ENABLE_PROFILING: "true"

persistence:
  data:
    size: 5Gi
  models:
    size: 10Gi
  backup:
    enabled: false

networkPolicy:
  enabled: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
