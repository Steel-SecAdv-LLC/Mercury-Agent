{{- if .Values.engine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "omni-ava.fullname" . }}-engine
  namespace: {{ include "omni-ava.namespace" . }}
  labels:
    {{- include "omni-ava.engine.labels" . | nindent 4 }}
spec:
  {{- if not .Values.engine.autoscaling.enabled }}
  replicas: {{ .Values.engine.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "omni-ava.engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "omni-ava.engine.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "omni-ava.podAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "omni-ava.engine.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.engine.podSecurityContext | nindent 8 }}
      {{- with .Values.engine.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.engine.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: engine
          image: {{ include "omni-ava.engine.image" . }}
          imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
          {{- with .Values.engine.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "omni-ava.configMapName" . }}
            - secretRef:
                name: {{ include "omni-ava.secretName" . }}
          env:
            - name: OMNI_WORKER_MODE
              value: "true"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            {{- toYaml .Values.engine.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from omni_anomaly_engine import OmniAnomalyEngine; print('healthy')"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "from omni_anomaly_engine import OmniAnomalyEngine; print('ready')"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.engine.securityContext | nindent 12 }}
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: cache
              mountPath: /app/cache
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.data.enabled }}
            - name: data
              mountPath: /app/data
            {{- end }}
            {{- if .Values.persistence.models.enabled }}
            - name: models
              mountPath: /app/models
            {{- end }}
      volumes:
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 5Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        {{- if .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "omni-ava.dataPvcName" . }}
        {{- end }}
        {{- if .Values.persistence.models.enabled }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "omni-ava.modelsPvcName" . }}
        {{- end }}
      terminationGracePeriodSeconds: 120
{{- end }}
