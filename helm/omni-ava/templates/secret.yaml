{{- if not .Values.config.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omni-ava.secretName" . }}
  namespace: {{ include "omni-ava.namespace" . }}
  labels:
    {{- include "omni-ava.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.config.secrets.DB_PASSWORD }}
  DB_PASSWORD: {{ .Values.config.secrets.DB_PASSWORD | quote }}
  {{- end }}
  {{- if .Values.config.secrets.API_SECRET_KEY }}
  API_SECRET_KEY: {{ .Values.config.secrets.API_SECRET_KEY | quote }}
  {{- end }}
  {{- if .Values.config.secrets.JWT_SECRET }}
  JWT_SECRET: {{ .Values.config.secrets.JWT_SECRET | quote }}
  {{- end }}
{{- end }}
