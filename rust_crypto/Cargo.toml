[package]
name = "mercury_crypto"
version = "0.1.0"
edition = "2021"
authors = ["Steel Security Advisors LLC"]
description = "High-performance cryptographic operations for Mercury Agent"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/Steel-SecAdv-LLC/Mercury-Agent"

# Build for Python extension module
[lib]
name = "mercury_crypto"
crate-type = ["cdylib"]

[dependencies]
# PyO3 for Python bindings (>=0.24.1 fixes RUSTSEC-2025-0020)
pyo3 = { version = "0.24", features = ["extension-module"] }

# Core crypto libraries
ring = "0.17"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
blake3 = "1.5"
sha2 = "0.10"
sha3 = "0.10"
argon2 = "0.5"

# Post-Quantum Cryptography
# pqcrypto = { version = "0.17", default-features = false, features = ["kyber", "dilithium"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random number generation
rand = "0.8"
rand_chacha = "0.3"

# Utilities
hex = "0.4"
base64 = "0.22"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[features]
default = ["standard-crypto"]
standard-crypto = []
# post-quantum = ["pqcrypto"]

# Build configuration for different platforms
[target.'cfg(target_os = "linux")'.dependencies]
jemallocator = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific dependencies if needed

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific dependencies if needed
