---
# VolumeSnapshot class for backup snapshots
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: omni-ava-snapshot
  labels:
    app.kubernetes.io/name: omni-ava
# Change driver based on cloud provider
driver: ebs.csi.aws.com
deletionPolicy: Retain
parameters:
  # AWS-specific
  # GCP: type: pd-standard
  # Azure: incremental: "true"
