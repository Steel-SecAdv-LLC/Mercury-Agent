# OMNI-AVA Persistent Volume Claims
# Storage configuration for data, models, and logs
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omni-ava-data
  namespace: omni-ava
  labels:
    app.kubernetes.io/name: omni-ava
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 50Gi
---
# PVC for ML models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omni-ava-models
  namespace: omni-ava
  labels:
    app.kubernetes.io/name: omni-ava
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi
---
# PVC for backup storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omni-ava-backup
  namespace: omni-ava
  labels:
    app.kubernetes.io/name: omni-ava
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 200Gi
---
