# Mercury-Agent ConfigMaps -- file-shaped configuration.
#
# The application's environment configuration (`mercury-agent-config`) is NOT
# here: it is generated by the base kustomization's configMapGenerator from
# `config/mercury-agent.env`. It has to be a generator rather than a plain
# resource, because all three environment overlays merge into it
# (`behavior: merge`), and kustomize can only merge a generated ConfigMap --
# merging into a plain resource fails the build outright with
# `id ...ConfigMap..."mercury-agent-config" does not exist; cannot merge or
# replace`, which is why `kustomize build` on the development, staging and
# production overlays used to exit 1.
#
# Generation also gives the map a content-hash name suffix, so a config change
# rolls the Deployments instead of silently applying to new pods only.
---
# ConfigMap for Prometheus metrics configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: mercury-agent-prometheus-config
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'mercury-agent-api'
        static_configs:
          - targets: ['mercury-agent-api:8000']
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'mercury-agent-engine'
        static_configs:
          - targets: ['mercury-agent-engine:9090']
        metrics_path: /metrics
        scrape_interval: 15s
---
# ConfigMap for logging configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: mercury-agent-logging-config
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: logging
data:
  logging.yaml: |
    version: 1
    disable_existing_loggers: false

    formatters:
      standard:
        format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
      json:
        class: pythonjsonlogger.jsonlogger.JsonFormatter
        format: '%(asctime)s %(name)s %(levelname)s %(message)s'

    handlers:
      console:
        class: logging.StreamHandler
        level: INFO
        formatter: json
        stream: ext://sys.stdout

      file:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: standard
        filename: /app/logs/mercury-agent.log
        maxBytes: 10485760
        backupCount: 5

    loggers:
      omni_mercury_engine:
        level: INFO
        handlers: [console, file]
        propagate: false

      uvicorn:
        level: INFO
        handlers: [console]
        propagate: false

    root:
      level: INFO
      handlers: [console]
