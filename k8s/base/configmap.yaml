# Mercury-Agent ConfigMap - Application Configuration
# Contains non-sensitive configuration for the Mercury-Agent engine
apiVersion: v1
kind: ConfigMap
metadata:
  name: mercury-agent-config
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: config
data:
  # Application Settings
  OMNI_LOG_LEVEL: "INFO"
  OMNI_CACHE_DIR: "/app/cache"
  OMNI_DATA_DIR: "/app/data"
  OMNI_MODEL_DIR: "/app/models"

  # API Server Settings
  OMNI_API_HOST: "0.0.0.0"
  OMNI_API_PORT: "8000"
  OMNI_API_WORKERS: "4"
  OMNI_API_TIMEOUT: "120"

  # Performance Settings
  OMP_NUM_THREADS: "4"
  PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:512"
  TORCH_HOME: "/app/models"

  # Python Settings
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "random"

  # Feature Flags
  OMNI_ENABLE_METRICS: "true"
  OMNI_ENABLE_TRACING: "true"
  OMNI_ENABLE_PROFILING: "false"

  # Detection Configuration
  OMNI_DEFAULT_SENSITIVITY: "0.5"
  OMNI_MAX_BATCH_SIZE: "1000"
  OMNI_DETECTION_TIMEOUT: "60"

  # Ethical Framework Settings
  OMNI_ETHICS_ENABLED: "true"
  OMNI_ETHICS_STRICT_MODE: "true"

  # Streaming Worker Settings (consumed by `mercury stream`, the engine
  # deployment's entrypoint). STREAMING_BACKEND defaults to the in-process
  # "memory" backend so the base manifests run with no external broker; the
  # distributed overlay patches it to "kafka" and supplies KAFKA_BOOTSTRAP_SERVERS
  # / REDIS_URL.
  STREAMING_BACKEND: "memory"
  MERCURY_STREAM_INPUT_TOPIC: "mercury-detections"
  MERCURY_STREAM_OUTPUT_TOPIC: "mercury-anomalies"
  MERCURY_STREAM_CONSUMER_GROUP: "mercury-streaming-workers"
  MERCURY_METRICS_PORT: "9090"
  # The CLI's /metrics server binds loopback by default (secure-by-default on
  # bare hosts). In-cluster, Prometheus scrapes cross-pod at
  # <pod-ip>:MERCURY_METRICS_PORT, so widen the bind here explicitly.
  MERCURY_METRICS_HOST: "0.0.0.0"
---
# ConfigMap for Prometheus metrics configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: mercury-agent-prometheus-config
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'mercury-agent-api'
        static_configs:
          - targets: ['mercury-agent-api:8000']
        metrics_path: /metrics
        scrape_interval: 10s

      - job_name: 'mercury-agent-engine'
        static_configs:
          - targets: ['mercury-agent-engine:9090']
        metrics_path: /metrics
        scrape_interval: 15s
---
# ConfigMap for logging configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: mercury-agent-logging-config
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: logging
data:
  logging.yaml: |
    version: 1
    disable_existing_loggers: false

    formatters:
      standard:
        format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
      json:
        class: pythonjsonlogger.jsonlogger.JsonFormatter
        format: '%(asctime)s %(name)s %(levelname)s %(message)s'

    handlers:
      console:
        class: logging.StreamHandler
        level: INFO
        formatter: json
        stream: ext://sys.stdout

      file:
        class: logging.handlers.RotatingFileHandler
        level: DEBUG
        formatter: standard
        filename: /app/logs/mercury-agent.log
        maxBytes: 10485760
        backupCount: 5

    loggers:
      omni_mercury_engine:
        level: INFO
        handlers: [console, file]
        propagate: false

      uvicorn:
        level: INFO
        handlers: [console]
        propagate: false

    root:
      level: INFO
      handlers: [console]
