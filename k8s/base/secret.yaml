# Mercury-Agent Secrets Configuration
#
# This manifest declares the SHAPE of the secret the Deployments consume via
# `envFrom: secretRef`. It deliberately ships NO key material.
#
# It used to ship values -- `JWT_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_
# SECURE_RANDOM"`, a matching `API_SECRET_KEY`, a `DB_PASSWORD`, a
# `GRAFANA_ADMIN_PASSWORD`, and a placeholder TLS key pair -- and this file is
# in the base's `resources:`, so `kubectl apply -k k8s/base` installed a
# working, world-readable JWT signing key straight from the repository. The
# application's own guard could not catch it: `api/auth.py` only fell through
# to key derivation when `JWT_SECRET_KEY` was *absent*, and this Secret made it
# present. (That guard now also rejects a placeholder, an empty value, or a
# key with too little entropy -- see `JWTAuth._validate_configured_key` -- so
# the two layers fail closed independently.)
#
# The `DB_*` keys are gone entirely: no code in `src/` reads `DB_HOST`,
# `DB_PORT`, `DB_NAME`, `DB_USER`, `DB_PASSWORD` or `API_SECRET_KEY`. Nor
# `GRAFANA_ADMIN_PASSWORD` -- Grafana is not part of these manifests.
#
# Populate it, in the namespace the overlay deploys to, with one of:
#
#   # 1. Directly, from generated material (nothing lands in git):
#   kubectl -n <namespace> create secret generic mercury-agent-secrets \
#     --from-literal=JWT_SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=API_KEY_HASH_SALT="$(openssl rand -hex 32)" \
#     --from-literal=AMA_MASTER_SEED="$(openssl rand -hex 64)"
#
#   # 2. Or via External Secrets Operator / Vault / cloud secret manager --
#   #    point an ExternalSecret at `target.name: mercury-agent-secrets`.
#
# Required keys, and what happens without each when MERCURY_ENV=production
# (which the staging and production overlays set):
#
#   JWT_SECRET_KEY     32+ random bytes, hex. Absent -> the signing key is
#                      derived through AMA HD key management from
#                      AMA_MASTER_SEED; absent along with AMA_MASTER_SEED too,
#                      the seed is per-process and tokens stop verifying
#                      across replicas.
#   API_KEY_HASH_SALT  32 random bytes, hex. Absent -> APIKeyStore.hash_key()
#                      raises, so API-key authentication fails closed rather
#                      than hashing every key under the built-in default salt.
#   AMA_MASTER_SEED    64 random bytes, hex. Makes JWT key derivation
#                      deterministic fleet-wide.
#
# Optional: HUGGINGFACE_TOKEN, for gated model downloads.
apiVersion: v1
kind: Secret
metadata:
  name: mercury-agent-secrets
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: secrets
  annotations:
    # Applying this manifest must never clobber material an operator (or an
    # ExternalSecret) has already written into the Secret.
    kustomize.toolkit.fluxcd.io/ssa: merge
type: Opaque
# No `data` / `stringData`: an empty Secret satisfies the Deployments'
# `envFrom` (so pods schedule and the fail-closed guards in the application
# are what report a missing key, loudly and in the logs) while shipping
# nothing an attacker can read out of this repository.
