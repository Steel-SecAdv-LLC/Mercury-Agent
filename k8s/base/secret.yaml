# Mercury-Agent Secrets Configuration
# Contains sensitive configuration that should be managed securely
# NOTE: In production, use external secret management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: mercury-agent-secrets
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials (if using external DB)
  DB_HOST: "localhost"
  DB_PORT: "5432"
  DB_NAME: "omni_mercury"
  DB_USER: "omni_user"
  # In production, use a strong password from secret manager
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # API authentication
  API_SECRET_KEY: "CHANGE_ME_IN_PRODUCTION_USE_SECURE_RANDOM"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION_USE_SECURE_RANDOM"

  # External service credentials (placeholders)
  HUGGINGFACE_TOKEN: ""

  # Monitoring credentials
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
---
# Secret for TLS certificates
apiVersion: v1
kind: Secret
metadata:
  name: mercury-agent-tls
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
stringData:
  # Placeholder - use cert-manager in production
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    PLACEHOLDER_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    PLACEHOLDER_KEY
    -----END PRIVATE KEY-----
---
