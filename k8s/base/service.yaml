# Mercury-Agent Service Configurations
# Exposes the API and internal services within the cluster
apiVersion: v1
kind: Service
metadata:
  name: mercury-agent-api
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: None
---
# Headless service for StatefulSet (if needed)
apiVersion: v1
kind: Service
metadata:
  name: mercury-agent-api-headless
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# Engine service for internal communication
apiVersion: v1
kind: Service
metadata:
  name: mercury-agent-engine
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: engine
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: engine
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
# NodePort service for development/testing access
apiVersion: v1
kind: Service
metadata:
  name: mercury-agent-api-nodeport
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: api
    environment: development
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
---
