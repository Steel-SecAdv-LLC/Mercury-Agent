# Mercury-Agent Ingress Configuration
#
# Routes external traffic to the API service.
#
# NO HOST IS SET, deliberately. This Ingress previously served
# `mercury-agent.example.com` and `api.mercury-agent.example.com` -- an IANA
# reserved documentation domain that no overlay, values file or patch ever
# replaced, so every rule matched a hostname that could not resolve and the
# Ingress routed nothing in any environment. A host-less rule matches *any*
# Host header, which means these manifests serve correctly through whatever
# name (or bare load-balancer address) the cluster actually answers on,
# immediately and with no editing.
#
# To pin a hostname and terminate TLS, add this patch to your overlay -- one
# place, real values, no placeholder anywhere in the repository:
#
#   patches:
#     - target:
#         kind: Ingress
#         name: mercury-agent-ingress
#       patch: |-
#         - op: add
#           path: /metadata/annotations/cert-manager.io~1cluster-issuer
#           value: letsencrypt-prod
#         - op: replace
#           path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
#           value: "true"
#         - op: add
#           path: /spec/tls
#           value:
#             - hosts: [api.your-domain.example]
#               secretName: mercury-agent-tls-cert
#         - op: add
#           path: /spec/rules/0/host
#           value: api.your-domain.example
#
# cert-manager creates the `mercury-agent-tls-cert` Secret named there; the
# base ships no TLS Secret of its own. (It used to ship a `mercury-agent-tls`
# Secret holding a PLACEHOLDER_CERTIFICATE / PLACEHOLDER_KEY pair, under a
# name the Ingress never referenced -- dead weight that looked like
# configuration.)
#
# Security response headers are NOT set here. They used to be, through
# `nginx.ingress.kubernetes.io/configuration-snippet`, which belongs to an
# annotation group ingress-nginx has disabled by default since v1.9
# (`allow-snippet-annotations: false`): a default controller's admission
# webhook REJECTS an Ingress carrying it, so the annotation did not merely
# fail to apply headers -- it blocked the Ingress from being created at all.
# The headers now come from the application
# (`omni_mercury_engine.api.security_headers`), which covers every deployment
# topology including the ones with no ingress-nginx in front.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mercury-agent-ingress
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    # Edge rate limiting (the application enforces its own limits as well).
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # Off until an overlay supplies a host and a certificate: redirecting to
    # HTTPS on an Ingress with no TLS block is an infinite redirect.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mercury-agent-api
                port:
                  number: 80
---
# Certificate Issuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: steel.sa.llc@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
---
# Certificate Issuer for staging (testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: steel.sa.llc@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: nginx
