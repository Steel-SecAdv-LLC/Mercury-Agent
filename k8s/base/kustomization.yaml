# Kustomize base configuration for Mercury-Agent
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mercury-agent-base

commonLabels:
  app.kubernetes.io/name: mercury-agent
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - ingress.yaml

configMapGenerator:
  # The application's environment configuration. Generated (not a plain
  # resource in configmap.yaml) because every environment overlay merges into
  # it with `behavior: merge`, and kustomize can only merge into a ConfigMap
  # that a generator produced.
  - name: mercury-agent-config
    behavior: create
    envs:
      - config/mercury-agent.env
  - name: mercury-agent-app-info
    literals:
      - app-name=mercury-agent
      - version=2.1.0
      - environment=base
