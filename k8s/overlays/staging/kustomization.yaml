# Kustomize overlay for staging environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mercury-agent-staging

namespace: mercury-agent-staging

commonLabels:
  environment: staging

resources:
  - ../../base

namePrefix: staging-

patches:
  # Moderate replicas for staging
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-api
      spec:
        replicas: 2
    target:
      kind: Deployment
      name: mercury-agent-api

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-engine
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: mercury-agent-engine

  # Staging resource allocation
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "1"
                    memory: "2Gi"
    target:
      kind: Deployment
      name: mercury-agent-api

  # Moderate HPA for staging
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: mercury-agent-api-hpa
      spec:
        minReplicas: 2
        maxReplicas: 5
    target:
      kind: HorizontalPodAutoscaler
      name: mercury-agent-api-hpa

  # Moderate storage
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: mercury-agent-data
      spec:
        resources:
          requests:
            storage: 20Gi
    target:
      kind: PersistentVolumeClaim
      name: mercury-agent-data

configMapGenerator:
  - name: mercury-agent-config
    behavior: merge
    literals:
      # Staging runs in production mode so the fail-closed guards
      # (API_KEY_HASH_SALT required, no localhost CORS allowlist, production
      # JWT key resolution) are exercised before production sees them.
      - MERCURY_ENV=production
      - OMNI_STRICT_VALIDATION=true
      - OMNI_RATE_LIMIT_REQUESTS_PER_MINUTE=300
      - OMNI_RATE_LIMIT_BURST=60
