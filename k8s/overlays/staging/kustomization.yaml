# Kustomize overlay for staging environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: omni-ava-staging

namespace: omni-ava-staging

commonLabels:
  environment: staging

resources:
  - ../../base

namePrefix: staging-

patches:
  # Moderate replicas for staging
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: omni-ava-api
      spec:
        replicas: 2
    target:
      kind: Deployment
      name: omni-ava-api

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: omni-ava-engine
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: omni-ava-engine

  # Staging resource allocation
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: omni-ava-api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "1"
                    memory: "2Gi"
    target:
      kind: Deployment
      name: omni-ava-api

  # Moderate HPA for staging
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: omni-ava-api-hpa
      spec:
        minReplicas: 2
        maxReplicas: 5
    target:
      kind: HorizontalPodAutoscaler
      name: omni-ava-api-hpa

  # Moderate storage
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: omni-ava-data
      spec:
        resources:
          requests:
            storage: 20Gi
    target:
      kind: PersistentVolumeClaim
      name: omni-ava-data

configMapGenerator:
  - name: omni-ava-config
    behavior: merge
    literals:
      - OMNI_LOG_LEVEL=INFO
      - OMNI_ENABLE_PROFILING=false
      - OMNI_API_WORKERS=2
