# Kustomize overlay for development environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mercury-agent-development

namespace: mercury-agent-dev

commonLabels:
  environment: development

resources:
  - ../../base

namePrefix: dev-

patches:
  # Reduce replicas for development
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-api
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: mercury-agent-api

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-engine
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: mercury-agent-engine

  # Reduce resource limits
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: "100m"
                    memory: "256Mi"
                  limits:
                    cpu: "500m"
                    memory: "1Gi"
    target:
      kind: Deployment
      name: mercury-agent-api

  # Disable HPA in development
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: mercury-agent-api-hpa
      spec:
        minReplicas: 1
        maxReplicas: 2
    target:
      kind: HorizontalPodAutoscaler
      name: mercury-agent-api-hpa

  # Reduce storage
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: mercury-agent-data
      spec:
        resources:
          requests:
            storage: 5Gi
    target:
      kind: PersistentVolumeClaim
      name: mercury-agent-data

configMapGenerator:
  - name: mercury-agent-config
    behavior: merge
    literals:
      # Development stays in development mode: the dev CORS allowlist and the
      # relaxed key guards are what a local cluster wants.
      - MERCURY_ENV=development
      - OMNI_STRICT_VALIDATION=false
      - OMNI_RATE_LIMIT_REQUESTS_PER_MINUTE=1000
      - OMNI_RATE_LIMIT_BURST=200
