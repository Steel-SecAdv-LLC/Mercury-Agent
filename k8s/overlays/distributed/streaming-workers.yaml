# Mercury Agent Streaming Workers
# Dedicated workers for processing streaming data from Kafka/Redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercury-streaming-worker
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: streaming-worker
    app.kubernetes.io/version: "2.1.0"
spec:
  replicas: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: mercury-agent
      app.kubernetes.io/component: streaming-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mercury-agent
        app.kubernetes.io/component: streaming-worker
        app.kubernetes.io/version: "2.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: mercury-agent-engine
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: streaming-worker
                topologyKey: kubernetes.io/hostname

      containers:
        - name: worker
          image: ghcr.io/steel-secadv-llc/mercury-agent:latest
          imagePullPolicy: Always
          command:
            - python
            - -m
            - omni_mercury_engine.cli
            - stream
            - --input-topic
            - mercury-detections
            - --output-topic
            - mercury-anomalies
            - --consumer-group
            - mercury-streaming-workers

          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP

          env:
            - name: STREAMING_BACKEND
              value: "kafka"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "mercury-kafka:9092"
            - name: REDIS_URL
              value: "redis://mercury-redis:6379"
            - name: WORKER_CONCURRENCY
              value: "4"
            - name: BATCH_SIZE
              value: "100"
            - name: BATCH_TIMEOUT_MS
              value: "100"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          envFrom:
            - configMapRef:
                name: mercury-agent-config
            - secretRef:
                name: mercury-agent-secrets

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "print('healthy')"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "print('ready')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: cache
              mountPath: /app/cache
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /app/models

      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: models
          persistentVolumeClaim:
            claimName: mercury-agent-models

      terminationGracePeriodSeconds: 60
      restartPolicy: Always
---
# Streaming Worker HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mercury-streaming-worker-hpa
  namespace: mercury-agent
  labels:
    app.kubernetes.io/name: mercury-agent
    app.kubernetes.io/component: streaming-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mercury-streaming-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Scale based on Kafka consumer lag (requires KEDA or custom metrics)
    # - type: External
    #   external:
    #     metric:
    #       name: kafka_consumer_lag
    #       selector:
    #         matchLabels:
    #           topic: mercury-detections
    #     target:
    #       type: AverageValue
    #       averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
        - type: Percent
          value: 25
          periodSeconds: 120
      selectPolicy: Min
---
# PodDisruptionBudget for Streaming Workers
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mercury-streaming-worker-pdb
  namespace: mercury-agent
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mercury-agent
      app.kubernetes.io/component: streaming-worker
---
# Network Policy for Streaming Workers
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mercury-streaming-worker-network-policy
  namespace: mercury-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: streaming-worker
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # Allow Kafka access
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/name: mercury-kafka-kafka
      ports:
        - protocol: TCP
          port: 9092
    # Allow Redis access
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
