# Kustomize overlay for production environment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: mercury-agent-production

namespace: mercury-agent

commonLabels:
  environment: production

resources:
  - ../../base

namePrefix: prod-

patches:
  # Production replicas
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-api
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: mercury-agent-api

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-engine
      spec:
        replicas: 2
    target:
      kind: Deployment
      name: mercury-agent-engine

  # Production resource allocation
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-api
      spec:
        template:
          spec:
            containers:
              - name: api
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
    target:
      kind: Deployment
      name: mercury-agent-api

  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: mercury-agent-engine
      spec:
        template:
          spec:
            containers:
              - name: engine
                resources:
                  requests:
                    cpu: "1"
                    memory: "4Gi"
                  limits:
                    cpu: "4"
                    memory: "16Gi"
    target:
      kind: Deployment
      name: mercury-agent-engine

  # Production HPA settings
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: mercury-agent-api-hpa
      spec:
        minReplicas: 3
        maxReplicas: 20
    target:
      kind: HorizontalPodAutoscaler
      name: mercury-agent-api-hpa

  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: mercury-agent-engine-hpa
      spec:
        minReplicas: 2
        maxReplicas: 10
    target:
      kind: HorizontalPodAutoscaler
      name: mercury-agent-engine-hpa

  # Production storage
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: mercury-agent-data
      spec:
        resources:
          requests:
            storage: 50Gi
    target:
      kind: PersistentVolumeClaim
      name: mercury-agent-data

  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: mercury-agent-models
      spec:
        resources:
          requests:
            storage: 100Gi
    target:
      kind: PersistentVolumeClaim
      name: mercury-agent-models

configMapGenerator:
  - name: mercury-agent-config
    behavior: merge
    literals:
      # The one setting that arms every production guard in the application:
      # API_KEY_HASH_SALT becomes mandatory (instead of silently falling back
      # to the hard-coded default salt), CORS drops the localhost allowlist,
      # and JWT signing keys resolve through the production branch. Every
      # deployment path shipped without it before, so every deployment ran in
      # development mode.
      - MERCURY_ENV=production
      - OMNI_STRICT_VALIDATION=true
      - OMNI_RATE_LIMIT_REQUESTS_PER_MINUTE=100
      - OMNI_RATE_LIMIT_BURST=20
