# =============================================================================
# Mercury-Agent Pre-commit Configuration
# =============================================================================
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# Update hooks: pre-commit autoupdate
# =============================================================================

repos:
  # ==========================================================================
  # Security Scanning
  # ==========================================================================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: package.lock.json

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: ['-c', 'pyproject.toml', '-r', 'src/', '--severity-level', 'medium']
        additional_dependencies: ['bandit[toml]']
        pass_filenames: false

  # ==========================================================================
  # Code Formatting
  # ==========================================================================
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3.12
        args: ['--config', 'pyproject.toml']

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--settings-path', 'pyproject.toml']

  # ==========================================================================
  # Linting
  # ==========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0  # PINNED with ci.yml + pyproject [dev] (check_pinned_tool_versions.py)
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0  # PINNED with ci.yml + pyproject [dev] (check_pinned_tool_versions.py)
    hooks:
      - id: flake8
        args: ['--config', '.flake8']
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions

  # ==========================================================================
  # Type Checking
  # ==========================================================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        args: ['--config-file', 'pyproject.toml', '--follow-imports=silent', '--ignore-missing-imports', '--no-error-summary']
        additional_dependencies:
          - types-requests
          - pydantic

  # ==========================================================================
  # General File Hygiene
  # ==========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        # Reviewed, deliberate model artifacts are exempt: a commit-hygiene
        # size cap must not silently dictate model architecture (e.g. forcing a
        # smaller hidden_dim just to stay under the limit). Capacity is chosen
        # on held-out evidence (scripts/sweep_fusion_capacity.py); the cap still
        # guards every other path against accidental large files.
        exclude: |
          (?x)^(
            src/omni_mercury_engine/models/checkpoints/.*\.pt|
            src/omni_mercury_engine/security/sigma_immutable_weights\.pt
          )$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--branch', 'master']

  # ==========================================================================
  # Documentation
  # ==========================================================================
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: ['--convention=google']
        files: ^src/

  # ==========================================================================
  # Mercury drift gates (local operator tools)
  # ==========================================================================
  - repo: local
    hooks:
      - id: mercury-algorithm-name-drift
        name: mercury — algorithm name drift gate
        entry: python -m omni_mercury_engine.tools.algorithm_name_drift_gate
        language: system
        pass_filenames: false
        files: ^(README|SECURITY|ARCHITECTURE)\.md$|^docs/.*\.md$|^src/.*pqc.*\.py$
      - id: mercury-workflow-version-drift
        name: mercury — workflow AMA_REF drift gate
        entry: python -m omni_mercury_engine.tools.workflow_version_drift_gate
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.github/workflows/.*\.ya?ml)$
      - id: mercury-pinned-tool-versions
        name: mercury — pinned dev-tool version parity gate
        # Asserts black/mypy/types-requests/pydocstyle carry identical exact
        # pins wherever each is pinned (black spans pyproject, ci.yml,
        # format.yml and this file; the others a subset), with a >=2-surface
        # floor.  Dependabot only edits pyproject.toml, so without this gate a
        # bump silently diverges the inline workflow pins (the bug it guards).
        entry: python scripts/check_pinned_tool_versions.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|\.pre-commit-config\.yaml|\.github/workflows/(ci|format)\.ya?ml)$
      - id: mercury-canonical-python-headers
        name: mercury — canonical Python/Rust headers
        entry: python scripts/normalize_headers.py --check
        language: system
        pass_filenames: false
        files: ^((src|tests|scripts|tools|research|benchmarks|examples)/.*\.py|rust_crypto/src/.*\.rs)$
      - id: mercury-codebase-scale-drift
        name: mercury — README codebase-scale drift gate
        # Local twin of the Workflow Hardening step (ci.yml "Run
        # codebase-scale documentation drift gate"): catches a stale
        # README scale block at commit time, before CI.  Dependency-free
        # and sub-second — the script measures the tree with stdlib only.
        entry: python scripts/measure_codebase_scale.py --check README.md
        language: system
        pass_filenames: false
        files: ^(README\.md|(src|tests)/.*\.py|\.github/workflows/.*\.ya?ml)$
      - id: mercury-convergence-proof
        name: mercury — convergence-proof emitter (--check)
        entry: python -m omni_mercury_engine.tools.convergence_proof_emitter --check
        language: system
        pass_filenames: false
        files: ^(docs/MATH_SPEC\.md|src/omni_mercury_engine/tools/convergence_proof_emitter\.py)$

  # ==========================================================================
  # Commit Message Linting
  # ==========================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

# =============================================================================
# CI Integration
# =============================================================================
ci:
  autofix_commit_msg: 'style: auto-fix by pre-commit hooks'
  autofix_prs: true
  autoupdate_branch: 'develop'
  autoupdate_commit_msg: 'chore: update pre-commit hooks'
  autoupdate_schedule: weekly
  skip: [mypy]  # Skip mypy in CI (run separately with full deps)
