# Mercury-Agent Local Development — Docker Compose
#
# Starts the Mercury-Agent API together with a lightweight monitoring stack
# (Prometheus + Grafana) that mirrors the production observability setup.
#
# Usage:
#   cp .env.example .env          # fill in JWT_SECRET_KEY at minimum
#   docker compose up -d          # start all services
#   curl http://localhost:8000/health
#   open http://localhost:3000    # Grafana (admin / admin)
#   open http://localhost:9090    # Prometheus

services:
  # ---------------------------------------------------------------------------
  # Mercury-Agent API
  # ---------------------------------------------------------------------------
  mercury-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: mercury-agent:local
    container_name: mercury-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override to non-production so startup doesn't require all prod secrets
      MERCURY_AGENT_ENV: ${MERCURY_AGENT_ENV:-development}
      OMNI_API_HOST: "0.0.0.0"
      OMNI_API_PORT: "8000"
      OMNI_LOG_FORMAT: ${OMNI_LOG_FORMAT:-text}
    volumes:
      # Persist model cache and on-disk detections between restarts
      - mercury-cache:/app/cache
      - mercury-models:/app/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    depends_on:
      prometheus:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Prometheus — metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: mercury-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  # ---------------------------------------------------------------------------
  # Grafana — dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    container_name: mercury-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  mercury-cache:
  mercury-models:
  prometheus-data:
  grafana-data:
