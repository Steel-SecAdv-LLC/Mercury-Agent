#
# Reviewed dependency licenses for scripts/check_dependency_licenses.py.
#
# An entry covers a dependency only while its observed license metadata is
# one of `signatures`, exactly as the gate prints it. If the dependency's
# metadata changes, the entry stops matching and the gate fails until the
# dependency is reviewed again. `name` may be a glob over normalised names.
#
# status = "verified"  The license is established by primary evidence the
#                      metadata does not carry; `evidence` names it.
# status = "permitted" Covered by an additional permission Mercury's copyright
#                      holder grants under AGPL section 7, in the project file
#                      `permission` names (the gate checks it exists and is a
#                      section 7 grant).
# status = "flagged"   The metadata names a license not known to be
#                      AGPL-compatible. The owner decides; the gate reports a
#                      warning on every run and never passes it silently.

[[review]]
name = "tokenizers"
status = "verified"
signatures = ["Classifier: Apache Software License"]
evidence = """\
The wheel ships no license file, only the unversioned classifier. The \
project's sdist (tokenizers-0.23.3, tokenizers/LICENSE, sha256 \
c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4) is the \
Apache License, Version 2.0 text."""

[[review]]
name = "namex"
status = "verified"
signatures = ["none"]
evidence = """\
No License, License-Expression or classifier in its metadata. The wheel \
(namex-0.1.0, dist-info/licenses/LICENSE, sha256 \
29aea94ee8d7f78b22d2f7ea626fa513dce47feb17f86c1430ec0d56e3e40a7f) is the \
Apache License, Version 2.0 notice, copyright 2023 fchollet; it arrives as a \
dependency of keras."""

[[review]]
name = "regex"
status = "flagged"
signatures = ["License-Expression: Apache-2.0 AND CNRI-Python"]
reason = """\
Declared Apache-2.0 AND CNRI-Python (code derived from CPython's re module \
under the CNRI Python 1.6 license, which the FSF lists as GPL-incompatible \
for its Virginia choice-of-law clause). Mercury's own code never imports it, \
but it is loaded and run whenever Mercury's VLM and LLM detectors import \
transformers ([vlm], [llm], [foundation] via chronos): transformers refuses to \
import without it (dependency_versions_check) and its utils import \
auto_docstring, which imports regex and decorates the BLIP and Qwen2-VL \
classes Mercury uses (verified against transformers 5.20.2). Owner decision: \
extend the section 7 permission to it, or a supported path without \
transformers."""

[[review]]
name = "nvidia-*"
status = "permitted"
permission = "LICENSE-EXCEPTION"
signatures = [
    "License-Expression: LicenseRef-NVIDIA-Proprietary",
    "License: LicenseRef-NVIDIA-Proprietary",
    "License: NVIDIA Proprietary Software",
]
reason = """\
NVIDIA's proprietary CUDA runtime libraries, installed as dependencies of the \
CUDA builds of torch from PyPI; Mercury's own code does not link them. They \
keep the image's documented, opt-in GPU support working. Combining Mercury \
with them is permitted by the section 7 additional permission in \
LICENSE-EXCEPTION (owner decision, 2026-10-21)."""
