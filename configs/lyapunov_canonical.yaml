# Canonical Lyapunov certificate for Mercury Agent.
#
# This file is the **single source of truth** for the Lyapunov decay rate
# `lambda` referenced throughout the codebase (docs/MATH_SPEC.md §2.2,
# README.md, src/omni_mercury_engine/core/three_r/fusion.py
# verify_lyapunov_stability()).  It is consumed by
# `tools/lyapunov_validator.py` and is verified on every CI run via
# `tests/tools/test_lyapunov_validator.py`.
#
# To change the canonical lambda, edit `A` and `P` below so the
# generalized eigenvalue analysis certifies the new rate, update the
# `lambda` field to match the *computed* value reported by
# `python -m tools.lyapunov_validator configs/lyapunov_canonical.yaml`,
# and run the test suite.

# Continuous-time linear surrogate of the fusion-score trajectory used
# to certify the global decay rate.  With P = I, A^T P + P A = 2 A,
# so the generalized eigenvalues of the symmetric pencil
# (A^T P + P A, P) are {-0.5, -1.0}.  The certified rate is therefore
# computed_lambda = -max_eig = 0.5, and the canonical claim below
# (0.25) is satisfied with margin.
A:
  - [-0.25, 0.0]
  - [0.0, -0.5]

# Quadratic Lyapunov candidate V(x) = x^T P x.  Identity P gives the
# natural ||x||^2 candidate; positive-definite by construction.
P:
  - [1.0, 0.0]
  - [0.0, 1.0]

# Certified decay rate.  Must satisfy lambda <= -max_eig(A^T P + P A, P);
# for the matrices above the certified rate is exactly 0.5, so claiming
# 0.25 is provably satisfied with margin (matches docs/MATH_SPEC.md).
lambda: 0.25
