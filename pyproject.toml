[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mercury-agent"
version = "1.7.0"
description = "Mercury Agent: ML-Centric Multi-Domain Anomaly Detection Framework"
readme = "README.md"
license = {text = "GPL-3.0+"}
requires-python = ">=3.11"
authors = [
    {name = "Steel Security Advisors LLC", email = "steel.sa.llc@gmail.com"}
]
maintainers = [
    {name = "Steel Security Advisors LLC", email = "steel.sa.llc@gmail.com"}
]
keywords = [
    "anomaly-detection",
    "machine-learning",
    "deep-learning",
    "cybersecurity",
    "multi-domain",
    "fusion-network",
    "time-series"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    # Lightweight core -- enough for CLI, statistical detectors, and rule-based
    # detection without pulling in ~2 GB of PyTorch.  For the full ML stack,
    # install mercury-agent[ml] or mercury-agent[all].
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "click>=8.1.0",
    "pydantic>=2.13.3",
    "bcrypt>=4.0.1",
    "cryptography>=46.0.7",  # CVE-2026-26007, CVE-2026-34073, CVE-2026-39892
    "pillow>=12.2.0",  # Security: CVE-2026-25990, CVE-2026-40192
    "requests>=2.33.1",  # Security: CVE-2026-25645
    "tqdm>=4.65.0",
    "networkx>=3.6.1",
    "defusedxml>=0.7.1",
    # PyYAML is required by ``configs/*.yaml`` loaders in
    # ``omni_mercury_engine.core.config._load_yaml`` (currently defensive
    # against ImportError but should not need to be) and by the v1.7.0
    # operator tooling: ``tools.lyapunov_validator``,
    # ``scripts.run_ablation``, ``scripts.run_hardware_benchmark``.  We
    # declare it as a core dep so every install path that ships these
    # tools also ships a usable YAML parser.  Note: the λ drift gate
    # (``scripts/check_readme_lyapunov.py``) is import-based — it
    # imports ``LyapunovConstants.LAMBDA_CONVERGENCE`` and
    # ``double_helix_engine.LAMBDA_DECAY`` directly, so the
    # ``docs-lambda-drift`` and ``workflow-hardening`` CI jobs run
    # ``pip install -e .`` before invoking the gate.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Core ML stack -- PyTorch and supporting libraries.
# scikit-learn is NOT required by Mercury's core detection pipeline.
# It is only needed for optional third-party comparison benchmarks.
ml = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pytorch-lightning>=2.0.0",
    "timm>=1.0.26",
    "opencv-python-headless>=4.8.0",
]

# Visual anomaly detection (PatchCore, PaDiM, STFPM, etc.)
visual = [
    "mercury-agent[ml]",
]

# Vision-Language Model detectors (AnyAnomaly, LAVAD)
vlm = [
    "transformers>=4.36.0",
    "accelerate>=1.13.0",
]

# Foundation model adapters (TimeGPT, Chronos, etc.)
foundation = [
    "stumpy>=1.14.1",
    "nixtla>=0.5.0",
]

# Medical dataset loaders (MIT-BIH, PhysioNet)
medical = [
    "wfdb>=4.3.1",
]

# Compliance frameworks (NIST CSF 2.0 live-reference fetcher, OSHA/eCFR
# citation resolvers).  openpyxl is required to parse the authoritative
# NIST CSF 2.0 Reference Tool download
# (https://csrc.nist.gov/extensions/nudp/services/json/csf/download?olirids=all)
# which is delivered as an XLSX workbook.  Without this extra, the
# integrator can still operate in offline mode via
# ``reference_source="builtin"``.
compliance = [
    "openpyxl>=3.1.0",
]

# Deep face recognition
face = [
    "deepface>=0.0.79",
    # tf-keras is required by retinaface (imported transitively by
    # deepface) starting with tensorflow 2.16; without it,
    # ``retinaface.commons.package_utils.validate_for_keras3()``
    # raises ``ValueError`` at import time, breaking any module that
    # does ``from deepface import DeepFace`` even inside a try/except
    # block that only catches ``ImportError``.  Pin the floor so the
    # contract is explicit in the extras graph.
    "tf-keras>=2.16",
]

# API server
api = [
    # 0.136.3 is excluded: that single release is flagged malicious by
    # OSV advisory MAL-2026-4750 — it injected an undocumented typosquat
    # dependency (``fastar>=0.9.0``) into its ``[standard]`` extra,
    # turning the canonical ``pip install "fastapi[standard]"`` path into
    # a dependency-confusion vector.  The exclusion (not a floor bump)
    # keeps Mercury on the validated 0.136.1 surface today while still
    # accepting any clean post-0.136.3 release automatically.
    "fastapi>=0.136.1,!=0.136.3",
    "httpx>=0.28.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.9",  # Required by FastAPI for form/file handling
    # ``pyjwt`` removed in v1.7.0: replaced by Mercury's native
    # ``omni_mercury_engine.security.native_jwt`` HS256 implementation
    # (pure stdlib) to retire the upstream-disputed PYSEC-2025-183 /
    # CVE-2025-45768 advisory from the audited supply chain.  No
    # third-party JWT library is required at runtime; see the
    # 2026-05-20 "Permanent supply-chain remediation" entry in
    # ``CHANGELOG.md`` for the rationale.
]

# SOTA anomaly detection models (TranAD, MAAT, etc.)
sota = [
    "mercury-agent[ml]",
    "einops>=0.8.2",
]

# LLM integration for zero-shot anomaly detection
llm = [
    "transformers>=4.36.0",
    "accelerate>=1.13.0",
    "openai>=1.0.0",
    "anthropic>=0.8.0",
]

# Drift detection (Alibi-Detect compatible)
drift = [
    "scipy>=1.10.0",
]

# Optional: third-party comparison benchmarks (sklearn detectors as external baselines)
benchmark-comparison = [
    "scikit-learn>=1.3.0",
]

# Fairness and bias mitigation
fairness = [
    "fairlearn>=0.13.0",
]

# Post-Quantum Cryptography - Primary backend (AMA Cryptography)
pqc = [
    # Pinned to v3.2.0 to match the validated real-AMA surface used by
    # CI (`AMA_REF: v3.2.0`) and the production PQC gate.
    # v3.2.0 (this pin) extends v3.1.0 with the
    # ``native_hmac_sha256`` / ``native_hmac_sha256_2`` Python
    # bindings consumed by
    # ``omni_mercury_engine.security.native_jwt._sign`` for the
    # HS256 / HS512 JOSE signing path.  See CHANGELOG ``[Unreleased]``
    # § "AMA-routed JWT HMAC signatures".  Pinning the
    # git ref (rather than tracking the
    # default branch) protects Mercury's reproducible-build promise:
    # an upstream main-branch force-push or breaking change cannot
    # silently bump the Mercury PQC surface mid-cycle.  Bump this tag
    # in lockstep with `tests/security/test_pqc_gate_real_ama.py` and
    # the migration notes in `docs/MIGRATION-1.6-to-1.7.md` §3.
    "ama-cryptography @ git+https://github.com/Steel-SecAdv-LLC/AMA-Cryptography.git@v3.2.0",  # Primary: Steel Security PQC framework (v3.2.0 adds native_hmac_sha256 / native_hmac_sha256_2 bindings used by native_jwt HS256 routing)
]


# Streaming infrastructure (Kafka, Redis)
streaming = [
    "aiokafka>=0.10.0",  # Async Kafka client
    "redis>=5.0.0",  # Redis with async support
]

# Efficiency optimizations
#
# ``joblib`` removed in v1.7.0: ``ParallelExecutor`` now uses
# :mod:`concurrent.futures` from the stdlib, retiring the
# upstream-disputed PYSEC-2024-277 / CVE-2024-34997 advisory.  See the
# 2026-05-20 "Permanent supply-chain remediation" entry in
# ``CHANGELOG.md`` for the supply-chain rationale.
optimization = [
    "psutil>=7.2.2",
]

# Benchmarking and evaluation
benchmark = [
    "hypothesis>=6.0.0",
    # ``joblib`` removed in v1.7.0 (see ``optimization`` extra above).
    "matplotlib>=3.10.9",
]

# Development tools
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "hypothesis>=6.0.0",
    "black>=26.3.1,<27.0.0",  # CVE-2026-32274
    "mypy>=1.20.2",
    "ruff>=0.15.12",
    "pre-commit>=3.5.0",
]

# Load testing
loadtest = [
    "locust>=2.20.0",  # Load testing framework
]

# Domain-specific loader dependencies (currently all loaders use stdlib + numpy + pandas,
# but these are reserved for future external API client libraries)
domains = [
    "aiohttp>=3.13.4",  # Security: CVE-2026-34513 through CVE-2026-34525
]

# GUI / visualization dashboard
gui = [
    "plotly>=5.18.0",
]

# Third-party explainers (optional).  Mercury's default explainability path is
# self-contained: IntegratedGradients + a faithfulness evaluator implemented
# in-repo (no captum), validated by benchmarks/explanation_fidelity.py
# (recovery@3 0.678, comprehensiveness 0.40 vs 0.22 random; see PR #265).
# SHAP and LIME are model-agnostic alternatives that the explainability
# adapters use *when present* and degrade gracefully when absent
# (cognitive/explainability.py guards both behind SHAP_AVAILABLE / LIME_AVAILABLE).
# Install this extra only if you want those external backends.
explainability = [
    "shap>=0.46.0",
    "lime>=0.2.0.1",
]

# Full installation with all features
all = [
    "mercury-agent[ml,visual,vlm,foundation,medical,face,api,sota,llm,drift,fairness,streaming,optimization,benchmark,domains,gui,explainability]",
]

# Test environment: all runtime features + dev tooling
test = [
    "mercury-agent[all,dev]",
]

[project.scripts]
mercury-agent = "omni_mercury_engine.cli:main"

[project.urls]
Homepage = "https://github.com/Steel-SecAdv-LLC/Mercury-Agent"
Documentation = "https://github.com/Steel-SecAdv-LLC/Mercury-Agent/tree/main/docs"
Repository = "https://github.com/Steel-SecAdv-LLC/Mercury-Agent.git"
Issues = "https://github.com/Steel-SecAdv-LLC/Mercury-Agent/issues"
Changelog = "https://github.com/Steel-SecAdv-LLC/Mercury-Agent/blob/main/CHANGELOG.md"

# =============================================================================
# Setuptools Configuration
# =============================================================================
# Explicit package discovery: restrict setuptools auto-find to the
# ``src/`` layout's ``omni_mercury_engine`` package tree only.  Without
# this block, modern setuptools (>= 64) auto-discovery would also
# consider top-level repo directories (``tools/``, ``scripts/``,
# ``benchmarks/``, ``configs/``) for inclusion, and a future regression
# that, say, dropped an ``__init__.py`` into ``benchmarks/`` would
# silently start shipping a ``benchmarks`` top-level package alongside
# ``omni_mercury_engine`` in the installed wheel.  Pinning the
# discovery rules here (``where=["src"]`` + ``include`` whitelist +
# ``namespaces=false``) makes the wheel's top-level surface a
# deliberate engineering decision, not an artifact of which
# directories happen to exist at build time.  The ``tools/`` package
# at the repo root remains importable for ``python -m tools.X`` from
# a source checkout (which is how the operator scripts are invoked)
# but does NOT enter ``pip install mercury-agent`` namespace.
[tool.setuptools.packages.find]
where = ["src"]
include = ["omni_mercury_engine*"]
namespaces = false

# Ship the PEP 561 ``py.typed`` marker inside the installed package so
# downstream mypy / pyright runs (and our own CI critical-tests gate)
# treat ``omni_mercury_engine`` as a typed library rather than an
# un-typed third-party import.  Without this marker, mypy emits
# ``[import-untyped]`` for every ``from omni_mercury_engine.X import ...``
# in test code -- which is exactly the failure that surfaced once
# ``--ignore-missing-imports`` was removed from the CI gates.
[tool.setuptools.package-data]
# ``py.typed`` ships the PEP 561 marker; ``models/checkpoints/*.pt`` ships the
# default fusion checkpoint (generated by ``scripts/train_default_fusion.py``)
# so ``mercury-agent detect -d fusion`` has trained weights out of the box even
# from a built wheel, where ``Path(__file__).parent`` resolves inside the
# installed package rather than the source tree.
omni_mercury_engine = ["py.typed", "models/checkpoints/*.pt"]

# =============================================================================
# Black Configuration
# =============================================================================
[tool.black]
line-length = 100
target-version = ['py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
  | __pycache__
)/
'''

# =============================================================================
# MyPy Configuration - Strict Type Checking
# =============================================================================
#
# TYPE COVERAGE STATUS
#   * src/omni_mercury_engine/ -- 100 percent strict, full annotations,
#     gated in CI with no --ignore-missing-imports.  Ships a PEP 561
#     ``py.typed`` marker so downstream callers (and our own tests)
#     pick up the inline types instead of being treated as un-typed.
#   * tests/ -- the entire tree is gated in CI.  The two remaining
#     relaxations are ``--allow-untyped-defs`` (a function with no
#     annotations at all passes; partial annotation is still a hard
#     error) and ``--disable-error-code untyped-decorator`` (pytest's
#     ``@fixture`` / ``@parametrize`` decorators return ``Any`` from
#     public stubs).  Both are pytest-idiom flags, not silencers --
#     no per-error suppressions ride on top of the gate.
#
# Third-party boundaries are declared per-module under the
# [[tool.mypy.overrides]] block below.  The src/ and critical-tests
# CI gates both run without --ignore-missing-imports so any new
# un-declared external import fails the build instead of being
# silenced.
#
# The strict settings below apply to the entire codebase.
# =============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
# Allow subclassing Any - required for torch.nn.Module, pydantic.BaseModel, etc.
# These libraries lack complete type stubs, returning Any for their base classes
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
extra_checks = true  # Replaces deprecated strict_concatenate
show_error_codes = true
show_column_numbers = true
pretty = true
enable_error_code = ["ignore-without-code"]

# Per-module overrides for third-party libraries
