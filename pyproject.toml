[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-anomaly-engine"
version = "1.0.0"
description = "OMNI ♱ AVA: ML-Centric Multi-Domain Anomaly Detection Framework"
readme = "README.md"
license = {text = "GPL-3.0+"}
requires-python = ">=3.12"
authors = [
    {name = "Steel Security Advisors LLC", email = "support@steelsecurityadvisors.com"}
]
maintainers = [
    {name = "Steel Security Advisors LLC", email = "support@steelsecurityadvisors.com"}
]
keywords = [
    "anomaly-detection",
    "machine-learning",
    "deep-learning",
    "cybersecurity",
    "multi-domain",
    "fusion-network",
    "time-series"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pytorch-lightning>=2.0.0",
    "pandas>=2.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "bcrypt>=4.0.1",
    "cryptography>=43.0.1",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "networkx>=3.0",
    "timm>=0.9.0",
]

[project.optional-dependencies]
# Visual anomaly detection (PatchCore, PaDiM, STFPM, etc.)
visual = [
    "torchvision>=0.17.0",
    "timm>=0.9.0",
]

# Vision-Language Model detectors (AnyAnomaly, LAVAD)
vlm = [
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
]

# Foundation model adapters
foundation = [
    "stumpy>=1.12.0",
    "nixtla>=0.5.0",
]

# Deep face recognition
face = [
    "deepface>=0.0.79",
]

# API server
api = [
    "fastapi>=0.109.0",
    "httpx>=0.25.0",
    "uvicorn>=0.25.0",
]

# Development tools
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

# Full installation with all features
all = [
    "omni-anomaly-engine[visual,vlm,foundation,face,api]",
]

[project.urls]
Homepage = "https://github.com/Steel-SecAdv-LLC/OMNI-AVA"
Documentation = "https://github.com/Steel-SecAdv-LLC/OMNI-AVA/tree/main/docs"
Repository = "https://github.com/Steel-SecAdv-LLC/OMNI-AVA.git"
Issues = "https://github.com/Steel-SecAdv-LLC/OMNI-AVA/issues"
Changelog = "https://github.com/Steel-SecAdv-LLC/OMNI-AVA/blob/main/CHANGELOG.md"

# =============================================================================
# Black Configuration
# =============================================================================
[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | venv
  | __pycache__
)/
'''

# =============================================================================
# isort Configuration
# =============================================================================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["omni_anomaly_engine"]
known_third_party = ["torch", "numpy", "scipy", "sklearn", "pandas", "fastapi"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip_gitignore = true
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# =============================================================================
# MyPy Configuration - Strict Type Checking
# =============================================================================
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true
show_error_codes = true
show_column_numbers = true
pretty = true

# Per-module overrides for third-party libraries
[[tool.mypy.overrides]]
module = [
    "deepface.*",
    "cv2.*",
    "qutip.*",
    "sklearn.*",
    "scipy.*",
    "torch.*",
    "torchvision.*",
    "pytorch_lightning.*",
    "tensorboard.*",
    "psutil.*",
    "structlog.*",
    "timm.*",
    "transformers.*",
    "accelerate.*",
    "stumpy.*",
    "nixtla.*",
    "chronos.*",
    "faiss.*",
    "FrEIA.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "ml: marks ML-dependent tests",
    "security: marks security tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["src/omni_anomaly_engine"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# Flake8 Configuration (via pyproject.toml support)
# =============================================================================
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E402", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
    ".mypy_cache",
    ".pytest_cache",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
]
max-complexity = 10

# =============================================================================
# Pylint Configuration
# =============================================================================
[tool.pylint.main]
jobs = 0  # Auto-detect number of processors
py-version = "3.12"
recursive = true
ignore = [".git", "__pycache__", "build", "dist", ".venv", "venv"]
ignore-patterns = ["test_.*\\.py"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "line-too-long",  # Handled by black
    "fixme",  # Allow TODO comments
]
enable = [
    "useless-suppression",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 10
max-public-methods = 25
max-returns = 8
max-statements = 60
min-public-methods = 1

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

# =============================================================================
# Bandit Security Scanner Configuration
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist"]
skips = ["B101", "B311"]  # Skip assert and random warnings in tests
targets = ["src/omni_anomaly_engine"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

# =============================================================================
# Ruff Configuration (Fast Python Linter)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "PERF",   # Perflint
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # Line too long (handled by black)
    "B008",   # Function call in default argument
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value comparison
    "S101",   # Assert usage (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["omni_anomaly_engine"]

# =============================================================================
# Pydocstyle Configuration
# =============================================================================
[tool.pydocstyle]
convention = "google"
match = "(?!test_).*\\.py"
match_dir = "^(?!tests|build|dist|venv|\\.venv).*"
add-ignore = ["D100", "D104", "D105", "D107"]

# =============================================================================
# Vulture (Dead Code Detection)
# =============================================================================
[tool.vulture]
min_confidence = 80
paths = ["src/omni_anomaly_engine"]
exclude = ["tests/", "venv/", ".venv/", "build/", "dist/"]
sort_by_size = true

# =============================================================================
# Radon (Code Complexity)
# =============================================================================
[tool.radon]
exclude = "tests/*,venv/*,.venv/*,build/*,dist/*"
cc_min = "C"  # Minimum complexity grade to report
mi_min = "B"  # Minimum maintainability index
show_closures = true

# =============================================================================
# Pyright Configuration (Alternative Type Checker)
# =============================================================================
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportPrivateUsage = "warning"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "error"
reportUninitializedInstanceVariable = "warning"
reportCallInDefaultInitializer = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportAssertAlwaysTrue = "error"
reportSelfClsParameterName = "error"
reportImplicitStringConcatenation = "warning"
reportInvalidStubStatement = "error"
reportIncompleteStub = "warning"
reportUnsupportedDunderAll = "warning"
reportUnusedCallResult = "none"
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/build",
    "**/dist",
    "**/venv",
    "**/.venv",
]

# =============================================================================
# Semantic Release Configuration
# =============================================================================
[tool.semantic_release]
version_variable = [
    "src/omni_anomaly_engine/__init__.py:__version__",
    "pyproject.toml:version",
]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"
