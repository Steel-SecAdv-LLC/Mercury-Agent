    # the cert body can record the omission reason.
    "pkcs11",
]
ignore_missing_imports = true

# =============================================================================
# Strict Type Checking - Module Overrides
# =============================================================================
# Type safety enforced with targeted exceptions for third-party integration.
# Strict mode enabled for business logic while accommodating external libraries.

[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.*",
]
ignore_errors = false
strict = true
# Allow subclassing torch.nn.Module (returns Any from stubs)
disallow_subclassing_any = false

# CLI module uses click decorators which are untyped
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.cli",
]
disallow_untyped_decorators = false

# API modules use FastAPI decorators which are untyped in strict mode
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.api.*",
]
disallow_untyped_decorators = false

# ML modules extend torch.nn.Module and use numba @jit decorators
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.ml.*",
    "omni_mercury_engine.models.*",
    "omni_mercury_engine.detectors.*",
    "omni_mercury_engine.cognitive.*",
    "omni_mercury_engine.biometric.*",
    "omni_mercury_engine.harmonics.*",
    "omni_mercury_engine.quantum_computing.*",
    "omni_mercury_engine.medical.*",
    "omni_mercury_engine.emergent.*",
    "omni_mercury_engine.space.*",
]
disallow_untyped_decorators = false
# torch.nn.Module methods return Any; allow returning these
warn_return_any = false


# Report generator uses untyped reportlab library
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.utils.report_generator",
]
disallow_untyped_calls = false

# AutoML and optimization modules return values from optuna/numpy
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.automl.*",
]
warn_return_any = false

# Core modules interacting with numpy/scipy for numerical computation
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.core.benevolence_optimization",
    "omni_mercury_engine.core.gosnn_integration",
    "omni_mercury_engine.core.gosnn_3r_integration",
    "omni_mercury_engine.core.engine_config",
    "omni_mercury_engine.core.score_calibration",
    "omni_mercury_engine.core.governed_fusion",
    "omni_mercury_engine.core.robust_pooling",
]
warn_return_any = false

# Integration stubs return values from external APIs/caches
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.integrations.stubs.*",
]
warn_return_any = false

# Explainability modules return values from shap/lime
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.explainability.*",
]
warn_return_any = false

# Crypto module returns values from cryptography library
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.crypto.*",
]
warn_return_any = false

# Dataset loaders handle numpy arrays with complex shapes
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.datasets.*",
]
warn_return_any = false

# Data sources handle numpy arrays with complex shapes
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.data_sources.*",
]
warn_return_any = false

# Scaling/distributed modules have complex async patterns
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.scaling.*",
    "omni_mercury_engine.distributed.*",
]
warn_return_any = false

# Infrastructure modules have async iterators and streaming patterns
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.infrastructure.*",
]
warn_return_any = false
# Allow flexible async patterns
disallow_untyped_calls = false

# Integration hub uses pydantic decorators
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.integrations.*",
]
warn_return_any = false
disallow_untyped_decorators = false

# Federated learning has numerical computation patterns
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.federated_learning.*",
    "omni_mercury_engine.federated.*",
]
warn_return_any = false

# Core engine config uses pydantic model_validator decorators
[[tool.mypy.overrides]]
module = [
    "omni_mercury_engine.core.engine_config",
]
disallow_untyped_decorators = false

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "ml: marks ML-dependent tests",
    "security: marks security tests",
    "network: marks tests requiring network access (deselect with '-m \"not network\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source = ["src/omni_mercury_engine"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# =============================================================================
# Flake8 Configuration (via pyproject.toml support)
# =============================================================================
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E402", "E501", "E704"]  # E704: Protocol stubs are valid PEP 544
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
    ".mypy_cache",
    ".pytest_cache",
]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
]
max-complexity = 10

# =============================================================================
# Pylint Configuration
# =============================================================================
[tool.pylint.main]
jobs = 0  # Auto-detect number of processors
py-version = "3.12"
recursive = true
ignore = [".git", "__pycache__", "build", "dist", ".venv", "venv"]
ignore-patterns = ["test_.*\\.py"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "line-too-long",  # Handled by black
    "fixme",  # Allow TODO comments
]
enable = [
    "useless-suppression",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 10
max-public-methods = 25
max-returns = 8
max-statements = 60
min-public-methods = 1

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true

# =============================================================================
# Bandit Security Scanner Configuration
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist"]
# B311: pseudo-random for ML (init, dropout, shuffle, anomaly noise).
#   Every np.random / random use under src/ is ML / numerics, not
#   crypto -- AMA owns crypto random. Documented and not enumerated
#   per-call.
#
# B310 (urllib_urlopen) is NOT skipped. ``urllib.request.urlopen``
# has been removed from src/ in favour of SafeHTTPClient and a B310
# finding now indicates a real regression. The two tests in
# tests/security/test_safe_http.py::TestNoNoSecForUrlopen pin this
# at the source level.
#
# B101 (assert) is NOT skipped at the bandit level. Type-narrowing
# asserts remain in numerics-heavy modules (detectors, automl,
# federated_learning) where they exist to satisfy mypy and document
# invariants that the surrounding code relies on; bandit reports
# these as low-severity findings and CI's ``bandit -ll`` floor
# filters them out. Security-sensitive asserts that gated control
# flow (the previous ``assert last_exc is not None`` in
# ``datasets/base.py`` for example) have been replaced with explicit
# ``raise RuntimeError`` -- those are the cases where ``-O`` would
# turn a refusal into silent success.
skips = ["B311"]
targets = ["src/omni_mercury_engine"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

# =============================================================================
# Ruff Configuration (Fast Python Linter)
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # Pylint
    "PERF",   # Perflint
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit (security)
]
ignore = [
    "ARG001", # Unused function argument (interface requirements)
    "ARG002", # Unused method argument (interface requirements)
    "ARG004", # Unused static method argument (interface requirements)
    "B007",   # Unused loop control variable (intentional)
    "B023",   # Function uses loop variable (bound via default arg)
    "B904",   # Raise without from (sometimes intentional)
    "B905",   # zip without strict (backwards compatibility)
    "C416",   # Unnecessary dict comprehension (readability)
    "E402",   # Module import not at top (license headers before imports)
    "E501",   # Line too long (handled by black)
    "B008",   # Function call in default argument
    "ERA001", # Commented-out code (documentation/examples)
    "PERF102", # Incorrect dict iterator (readability)
    "PERF401", # Manual list comprehension (readability preference)
    "PERF403", # Manual dict comprehension (readability)
    "PLC0415", # Import outside top level (conditional/lazy imports)
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches (complex logic is sometimes necessary)
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR1714", # Repeated equality comparison (readability)
    "PLR2004", # Magic value comparison
    "PLW0603", # Global statement (sometimes necessary)
    "PLW2901", # Redefined loop name (intentional in some cases)
    "PTH103", # os.makedirs (acceptable)
    "PTH110", # os.path.exists (acceptable)
    "PTH118", # os.path.join (acceptable)
    "PTH120", # os.path.dirname (acceptable)
    "PTH123", # builtin open (acceptable)
    "RUF001", # Ambiguous unicode character
    "RUF002", # Ambiguous unicode character in docstring
    "RUF003", # Ambiguous unicode character in comment (σ_Immutable, φ, etc.)
    "RUF005", # Collection literal concatenation (readability)
    "RUF012", # Mutable class default (intentional for configs)
    "RUF034", # Useless if-else (readability preference)
    "RUF059", # Unused unpacked variable (interface requirement)
    "S101",   # Assert usage (needed in tests)
    "S110",   # try-except-pass (intentional silence)
    "S112",   # try-except-continue (intentional silence)
    "S301",   # Pickle usage (documented security considerations)
    "S311",   # Suspicious non-cryptographic random (intentional use)
    "SIM102", # Collapsible if (readability preference)
    "SIM105", # Suppressible exception (contextlib.suppress alternative)
    "SIM108", # If-else instead of ternary (readability preference)
    "SIM115", # Open file with context handler (tempfile pattern)
    "SIM116", # If-else instead of dict lookup (readability)
    "TC004",  # Move import out of type-checking block (conditional imports)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "S105", "S108", "S603", "S607", "S608"]
"__init__.py" = ["F401"]
"benchmarks/**/*.py" = ["S102", "S108", "S310", "S607", "PTH100", "C408", "PLR1722", "F841", "B015", "SIM118", "B006"]
"docs/**/*.py" = ["RUF015"]
# scripts/persist_benchmark_to_pr.py: every urllib.urlopen call targets the
# hardcoded ``GITHUB_API = "https://api.github.com"`` constant defined at
# module top-level; no user input is interpolated into the scheme/host, so
# S310's "audit URL open for permitted schemes" finding does not apply.
"scripts/persist_benchmark_to_pr.py" = ["S310"]
# S310: urlopen calls use TrustedEndpoints class with hardcoded HTTPS URLs
# TrustedEndpoints.validate_url() provides SSRF protection via domain allowlist
"src/omni_mercury_engine/datasets/*.py" = ["S310"]
"src/omni_mercury_engine/detectors/**/*.py" = ["S310"]
# Operator tools intentionally accept user paths and shell out to a
# hardcoded `git` executable for release manifest provenance.  The
# subprocess invocations have no user input in the program name.
"src/omni_mercury_engine/tools/*.py" = ["S603", "S607", "TC003", "PLW0108", "SIM118", "PTH105", "PTH108"]
"src/omni_mercury_engine/validation/data_loaders.py" = ["S310"]
"src/omni_mercury_engine/security/input_validation.py" = ["S310"]
# C408: dict() is idiomatic for Plotly visualization code
"src/omni_mercury_engine/gui/**/*.py" = ["C408"]
# SIM113: Manual batch counting is intentional for stepped iteration and conditional logic
"src/omni_mercury_engine/detectors/advanced/*.py" = ["SIM113"]
# S310: Financial stubs use hardcoded HTTPS URLs for trusted financial APIs
"src/omni_mercury_engine/integrations/stubs/financial.py" = ["S310"]
"src/omni_mercury_engine/integrations/stubs/weather.py" = ["S310"]
# RUF100: noqa: F401 needed for Flake8 compat on wildcard re-exports
"src/omni_mercury_engine/core/self_healing.py" = ["RUF100"]
# UP046: Using Generic[T] for Python 3.11 compatibility (PEP 695 requires Python 3.12+)
"src/omni_mercury_engine/distributed/raft_consensus.py" = ["UP046"]

[tool.ruff.lint.isort]
known-first-party = ["omni_mercury_engine"]
known-third-party = ["torch", "numpy", "scipy", "pandas", "fastapi"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
force-wrap-aliases = true
combine-as-imports = true
split-on-trailing-comma = true
lines-after-imports = -1

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["omni_mercury_engine"]
known_third_party = ["torch", "numpy", "scipy", "pandas", "fastapi"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
combine_as_imports = true
split_on_trailing_comma = true
lines_after_imports = -1

# =============================================================================
# Pydocstyle Configuration
# =============================================================================
[tool.pydocstyle]
convention = "google"
match = "(?!test_).*\\.py"
match_dir = "^(?!tests|build|dist|venv|\\.venv).*"

# =============================================================================
# Vulture (Dead Code Detection)
# =============================================================================
[tool.vulture]
min_confidence = 80
paths = ["src/omni_mercury_engine"]
exclude = ["tests/", "venv/", ".venv/", "build/", "dist/"]
sort_by_size = true

# =============================================================================
# Radon (Code Complexity)
# =============================================================================
[tool.radon]
exclude = "tests/*,venv/*,.venv/*,build/*,dist/*"
cc_min = "C"  # Minimum complexity grade to report
mi_min = "B"  # Minimum maintainability index
show_closures = true

# =============================================================================
# Pyright Configuration (Alternative Type Checker)
# =============================================================================
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportPrivateUsage = "warning"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "error"
reportUninitializedInstanceVariable = "warning"
reportCallInDefaultInitializer = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportAssertAlwaysTrue = "error"
reportSelfClsParameterName = "error"
reportImplicitStringConcatenation = "warning"
reportInvalidStubStatement = "error"
reportIncompleteStub = "warning"
reportUnsupportedDunderAll = "warning"
reportUnusedCallResult = "none"
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/build",
    "**/dist",
    "**/venv",
    "**/.venv",
]

# =============================================================================
# Semantic Release Configuration
# =============================================================================
[tool.semantic_release]
version_variable = [
    "src/omni_mercury_engine/__init__.py:__version__",
    "pyproject.toml:version",
]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install build && python -m build"
commit_message = "chore(release): {version} [skip ci]"
