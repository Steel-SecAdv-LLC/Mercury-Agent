# Mercury Agent Safety Policy (v3.0)
# Policy for the Safety CLI scanner. It holds NO accepted vulnerabilities:
# the Python-package gate (`safety check --policy-file .safety-policy-v2.yml`,
# which exists to override this file's auto-discovery) runs with zero risk
# acceptance, and the deployment-image gate's acceptances live in `.trivyignore`
# (enumerated, expiring) with their rationale in SECURITY.md and CHANGELOG.md.
#
# Last Updated: 2026-10-17. This file previously listed eight CVEs as accepted
#   until 2026-08-02 (quarterly review). That review had lapsed, the entries
#   were Debian bookworm findings from before the image moved to trixie
#   (SECURITY.md, "Trixie re-enumeration", 2026-06-18), none of them is in
#   `.trivyignore`, and no gate read them. A lapsed acceptance that nothing
#   enforces is not a control, so they are removed rather than re-dated; a
#   scanner that auto-discovers this file no longer waves them through.
# Reviewed By: Steel Security Advisors LLC
# Next Review: 2027-01-17 (quarterly)
#
# Reference: https://docs.safetycli.com/safety-docs/policy-file

version: '3.0'

scanning-settings:
  max-depth: 6
  exclude: []
  include-files: []
  system:
    targets: []

report:
  dependency-vulnerabilities:
    enabled: true
    auto-ignore-in-report:
      python:
        environment-results: true
        unpinned-requirements: true
      cvss-severity: []

fail-scan-with-exit-code:
  dependency-vulnerabilities:
    enabled: true
    fail-on-any-of:
      cvss-severity:
        - critical
        - high
      exploitability:
        - critical
        - high

security-updates:
  dependency-vulnerabilities:
    auto-security-updates-limit:
      - patch

installation:
  default-action: allow
  audit-logging:
    enabled: true
  allow:
    packages: []
    vulnerabilities: {}
  deny:
    packages: {}
    vulnerabilities:
      warning-on-any-of:
        cvss-severity: []
      block-on-any-of:
        cvss-severity: []
